<style>
/* ================================================================ Breath: the rebuilt book's look (look A in docs/superpowers/specs/2026-11-25-vocal-directions.html)
   Dawn air by default, Dusk at night, the gold accent in both (pink until 26 Nov; the token is still named --rose). The token names keep the old book's (--rust, --sage, --panel …)
   so the reused sketch.css, reading.js and qbank.js pick up the new colours without edits. Off notes are amber, never red. */
:root{   /* Dawn */
  --bg:#fbf1e1; --bg2:#e3e8f3; --grad:radial-gradient(120% 90% at 50% 0%,#fbf1e1 0%,#f0f0f3 55%,#e3e8f3 100%);
  --panel:rgba(255,255,255,.6); --panel2:#e9ecf6; --glass:rgba(255,255,255,.55);
  --ink:#2b2e4a; --ink2:#454a6b; --mute:#6b6f8c; --rule:rgba(43,46,74,.16);
  --rose:#a97b22; --rust:var(--rose); --acc:var(--rose); --gold:#8a5a8f;   /* --rose is the accent (gold); --gold is the highlight (plum) */
  --teal:#3f8a87; --sage:#5f9a7c; --plum:#8a5a8f; --navy:#45588a;
  --ok:#5f9a7c; --warn:#d9772e; --bad:#d9772e;   /* amber leaning orange, so an off note never reads as the gold of your part */
  --onacc:#2b2e4a; --dark:#2b2e4a; --ondark:#fbf1e1;
  --display:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --body:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --toph:64px; --tabh:84px;
  color-scheme:light;
}
:root[data-theme="dusk"]{
  --bg:#262446; --bg2:#3d2c48; --grad:radial-gradient(120% 90% at 50% 0%,#3d2c48 0%,#2e2a4c 50%,#1f1e3a 100%);
  --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.12); --glass:rgba(255,255,255,.07);
  --ink:#f1e9ef; --ink2:#d6cbdc; --mute:#a99db6; --rule:rgba(241,233,239,.16);
  --rose:#e3b85c; --gold:#c39ac8; --teal:#72b8b3; --sage:#86c2a1; --plum:#c39ac8; --navy:#97a8d8;
  --ok:#86c2a1; --warn:#f0995a; --bad:#f0995a;
  --onacc:#1f1e3a; --dark:#14132a; --ondark:#f1e9ef;
  color-scheme:dark;
}
@media (max-width:700px){ :root{ --tabh:64px; } }

/* ---------------------------------------------------------------- the frame: top bar, the scrolling middle, the tabs */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
/* the iPhone: no zoom on a double tap, none on a tap into a small box (16px or more), no text inflation; an installed app never zooms back out */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} body{touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
body{background:var(--bg);background-image:var(--grad);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;display:grid;grid-template-rows:auto 1fr auto;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.005em;margin:0}
em{font-style:italic}

.top{display:flex;align-items:center;gap:12px;height:calc(var(--toph) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:34px;height:34px;flex:none;color:var(--ink)}
.brand .mk svg{width:100%;height:100%;display:block}
.brand .bt{font-family:var(--display);font-size:30px;line-height:1;white-space:nowrap}
.brand em{color:var(--rose)}
.tools{margin-left:auto;margin-right:-11px;display:flex;align-items:center;gap:6px}   /* the last icon's glyph lines up with the content edge, not its 44px tap circle */
.streak{font-size:14px;color:var(--mute);padding:0 8px;letter-spacing:.02em;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--glass)}

.main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left))}
.view{max-width:1120px;margin:0 auto}

.tabs{display:flex;justify-content:center;align-items:center;gap:6px;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding:0 max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left));border-top:1px solid var(--rule)}
.tabs button{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:16px;color:var(--ink2);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs .ti{display:none}
.tabs .ts{display:none}
@media (max-width:700px){
  .tabs{gap:0;justify-content:space-around}
  .tabs button{flex-direction:column;gap:2px;padding:6px 4px;border-radius:14px;font-size:11px;flex:1 1 0;min-width:0}
  .tabs .ti{display:block;line-height:0}
  .tabs .tl{display:none}
  .tabs .ts{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .brand .bt{font-size:24px}
  .streak{display:none}
}

/* ---------------------------------------------------------------- the player dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom));z-index:40;
  display:flex;align-items:center;gap:12px;width:max-content;max-width:min(560px,calc(100vw - 24px));padding:6px 10px 6px 6px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule);box-shadow:0 8px 28px rgba(43,46,74,.16)}
.dock-play{width:46px;height:46px;flex:none;border-radius:999px;background:var(--rose);color:var(--onacc);display:grid;place-items:center}
.dock-play[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dock-label{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.dock-tempo{display:flex;align-items:center;gap:4px;flex:none;color:var(--ink2)}
.dock-tempo button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.dock-tempo button:hover{background:var(--panel2)}
.dock-bpm{min-width:2.4ch;text-align:right;font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink)}
.dock-tempo small{font-size:11px;color:var(--mute);margin-right:2px}
body.docked .main{padding-bottom:90px}

/* ---------------------------------------------------------------- sheets: the glossary, a concept, My Voice */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(43,46,74,.28);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px 0}
.sheet{width:100%;max-width:720px;max-height:82vh;display:flex;flex-direction:column;background:var(--bg);background-image:var(--grad);color:var(--ink);
  border-radius:22px 22px 0 0;border:1px solid var(--rule);border-bottom:0;box-shadow:0 -10px 40px rgba(43,46,74,.18);padding-bottom:env(safe-area-inset-bottom);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(48px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 14px 8px 22px}
.sheet-head h2{font-size:30px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-x{font-size:28px;line-height:1}
.sheet-body{overflow-y:auto;padding:4px 22px 22px;-webkit-overflow-scrolling:touch}
#gq{width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);font-size:16px;margin-bottom:10px}
.g-list{display:flex;flex-direction:column}
.g-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 4px;border-bottom:1px solid var(--rule)}
.g-row b{font-weight:500}
.g-row span{font-size:14px;color:var(--mute)}
.g-none{color:var(--mute);padding:10px 4px}
.c-term{font-size:34px;margin:4px 0 6px}
.c-short{font-size:18px;margin:0 0 8px}
.c-more{color:var(--ink2);margin:0 0 12px}
.c-see{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:6px 0 14px}
.c-see .k{width:100%;margin:0}
.c-acts{display:flex;gap:10px;flex-wrap:wrap}
.term{color:inherit;text-decoration:underline dotted var(--rose);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
.mv{padding:12px 0;border-bottom:1px solid var(--rule)}
.mv:last-child{border-bottom:0}
.mv p{margin:2px 0 8px}
.mv-big{font-family:var(--display);font-size:36px}
.mv-dots{display:flex;gap:6px}
.mv-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rose);opacity:.6}
.mv-dots i.on{background:var(--rose);opacity:1}
.mv-care{display:flex;flex-wrap:wrap;gap:6px 14px}

/* ---------------------------------------------------------------- the common pieces */
.ph{font-size:44px;line-height:1.05;margin:14px 0 16px}
.card{background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:16px 18px;border:1px solid var(--rule)}
.card h2,.card .t{font-family:var(--display);font-size:26px;margin:0 0 6px}
.card p{margin:4px 0;max-width:62ch}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:16px}
.btn.acc{background:var(--rose);color:var(--onacc)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--rule)}
/* ---------------------------------------------------------------- the shim's classes: what the reused pages draw with */
.hd2{margin:14px 0 16px}
.hd2 h1{font-size:44px;line-height:1.05}
.hd2 h1 em{color:var(--rose)}
.hd2 .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-top:6px;color:var(--ink2)}
.hd2 .key{color:var(--mute);font-size:14px}
.sec{background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:16px 18px;border:1px solid var(--rule);margin:0 0 14px;min-width:0}
.sec h2{font-size:26px;margin:0 0 8px}
.sec h2 small{font-family:var(--body);font-size:14px;color:var(--mute);margin-left:6px}
.toolbar,.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin:0 0 14px}
.pick,.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.pick>span,.ctl .label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.pick select,.ctl select,.ctl input[type=text]{padding:9px 16px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--rule)}
.seg button{padding:7px 16px;border-radius:999px;color:var(--ink2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.body{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.muted{color:var(--mute)}
.big{max-width:100%;overflow-x:auto}
.big svg{max-width:100%;height:auto}
.note{font-family:var(--display);font-size:32px}
.note small{font-family:var(--body);font-size:15px;color:var(--mute);margin-left:8px}
.thumb{border-radius:14px;border:1px solid var(--rule);background:var(--panel)}
.tempo{display:flex;align-items:center;gap:8px}
.tempo input[type=range]{accent-color:var(--rose)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.play.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
/* ---------------------------------------------------------------- the keyboard (from voice.css), the lane, the range column */
.kbwrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.kb{position:relative;display:flex;height:96px;width:max-content;border-radius:10px}
.kb .w{flex:none;width:34px;height:100%;border:1.5px solid var(--rule);border-radius:0 0 8px 8px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10.5px;color:var(--mute);margin-right:-1.5px}
.kb .b{position:absolute;top:0;width:21px;height:58%;background:var(--ink);border-radius:0 0 5px 5px;z-index:2;border:0;padding:0}
.kb .w.on{background:var(--rose);color:var(--onacc)} .kb .b.on{background:var(--rose)}
.kb .w.you{box-shadow:inset 0 -6px 0 var(--sage)} .kb .b.you{box-shadow:inset 0 -5px 0 var(--sage)}
.kb .w.c{color:var(--ink)}
canvas.lane{display:block}
svg.rangecol{display:block;width:100%;height:100%}

/* ---------------------------------------------------------------- Ear & Pitch */
.ear-modes{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 12px;margin:-4px 0 4px}
.ear-modes button{flex:none;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--rule);color:var(--ink2);font-size:15px;white-space:nowrap}
.ear-modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ear{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.ear-stage{height:min(52vh,420px);padding:0;overflow:hidden}
.ear-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.readout{display:flex;flex-direction:column;gap:6px}
.ro-note{font-family:var(--display);font-size:52px;line-height:1}
.ro-cents{font-size:17px;color:var(--ink2);min-height:1.4em}
.ro-held{font-size:15px;color:var(--ok);min-height:1.4em}
.ro-msg{font-size:15px;color:var(--warn);margin:0}
.ro-msg:empty{display:none}
.ro-tech{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);margin:0;overflow-wrap:anywhere}
.cue{margin:0;color:var(--ink2)}
.guide{margin:0;color:var(--mute);max-width:52ch}
.ear-range{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.ear-range svg{height:300px}
.ear-range p{margin:0}
.ladder-stage{height:auto;padding:12px}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;justify-content:space-between;align-items:baseline;padding:10px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--rule);transition:background .15s,transform .15s}
.rung b{font-family:var(--display);font-size:26px;font-weight:400}
.rung span{color:var(--mute)}
.rung.dim{opacity:.45}
.rung.lit{background:var(--ok);color:var(--onacc);transform:scale(1.02);opacity:1}
.rung.lit span{color:var(--onacc)}
@media (max-width:700px){
  .ear{grid-template-columns:minmax(0,1fr)}
  .ear-stage{height:min(40vh,300px)}
  .ladder-stage{height:auto}
  .ro-note{font-size:42px}
  .ear-range svg{height:240px}
}
.mv-range{display:flex;gap:16px;align-items:center}
.mv-singer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line, rgba(0,0,0,.08))}
.mv-singer .mv-name{font:inherit;font-size:1.05em;padding:6px 10px;border-radius:10px;border:1px solid var(--line, rgba(0,0,0,.15));background:transparent;color:inherit;width:11em;max-width:100%}
.mv-singer.on .mv-name{border-color:var(--rose)}
.mv-sr{opacity:.75;flex:1;min-width:8em}
.mv-now{font-size:.85em;color:var(--rose)}
#mv-add{margin-top:10px}
.streak.singer{color:var(--rose);display:inline-block;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
@media (max-width:420px){ .top:has(#singer-name:not([hidden])) .brand .bt{display:none} }   /* two singers on a phone: the name of who is singing takes the wordmark’s place */   /* shown on a phone too, where the streak hides: whose range is in use matters there */
.mv-col{width:84px;height:240px;flex:none}
.mv-words{min-width:0}

.toast{position:fixed;left:50%;top:calc(var(--toph) + 12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:60;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------------------------------------------------------- the How-to card */
.howto{display:flex;flex-direction:column;gap:14px;min-width:0}
.ht-sec{min-width:0}
.ht-sec h3{font:400 24px/1.1 var(--display);margin:0 0 8px;color:var(--ink)}
.ht-intro{font-size:17px;margin:0 0 8px}
.ht-steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:16px}
.ht-steps li::marker{color:var(--rose);font-weight:600}
.ht-faults{margin:0;display:grid;gap:4px 0}
.ht-faults dt{font-weight:600;margin-top:6px}
.ht-faults dt:first-child{margin-top:0}
.ht-faults dd{margin:0;color:var(--ink2)}
.ht-credit{font-size:12px;color:var(--mute);margin:6px 0 0}
.ht-credit a{color:inherit}
.ht-refslot{margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ht-refinvite{margin:0;font-size:14px;color:var(--ink2)}
.ht-watch{display:inline-block;margin-top:8px;color:var(--ink);font-size:15px}
.ht-says{min-height:1.4em;margin:8px 0 0;font-size:16px;color:var(--ink)}
.ht-says:empty{display:none}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--ink2);text-decoration:underline;font-size:14px;cursor:pointer}

/* ---------------------------------------------------------------- Warm Up */
.warm-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 12px;margin:-4px 0 4px}
.warm-tabs button{flex:none;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--rule);color:var(--ink2);font-size:15px;white-space:nowrap}
.warm-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex-group h2{font:400 26px/1.1 var(--display);margin:18px 0 8px}
.ex-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.ex-row{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--rule);color:var(--ink);min-width:0}
.ex-row b{font-size:17px;font-weight:600}
.ex-row span{font-size:14px;color:var(--ink2);line-height:1.35}
.warm-ex{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.wx-main{display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:0}
.wx-back{align-self:flex-start}
.wx-name{font:400 34px/1.05 var(--display);margin:0}
.wx-sub,.wx-hint{margin:0;color:var(--ink2);font-size:15px}
.wx-fig svg{width:100%;height:140px;display:block}
.wx-lane{height:230px;padding:8px;overflow:hidden}
.wx-card{min-width:0}
.warm-breath{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.br-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.br-pick{justify-content:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.br-phases{margin:0;color:var(--ink2);font-size:14px;text-align:center}
.bring{--dur:4s;position:relative;width:min(240px,62vw);aspect-ratio:1;display:grid;place-items:center}
.bring-c{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--rose),transparent 70%);opacity:.35;transform:scale(.55);transition:transform var(--dur) ease-in-out,opacity var(--dur) ease-in-out}
.bring.full .bring-c{transform:scale(1);opacity:.6}
.bring::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--rose);opacity:.5}
.bring-t{position:relative;text-align:center}
.bring-n{font:400 56px/1 var(--display)}
.bring-l{font-size:14px;color:var(--ink2);max-width:14em;margin:6px auto 0}
@media (prefers-reduced-motion:reduce){.bring-c{transition:none}}
.sess-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.sess{display:flex;flex-direction:column;gap:8px}
.sess-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sess-head h2{font:400 26px/1.1 var(--display);margin:0}
.sess-min{color:var(--ink2);font-size:15px}
.sess p{margin:0;color:var(--ink2);font-size:14px}
.sess-steps{margin:0;padding-left:1.3em;font-size:14px;columns:2;column-gap:18px}
.sess-steps i{font-style:normal;color:var(--mute);margin-left:6px}
.sess-start{align-self:flex-start}
.mirror-host{height:min(440px,60vh);padding:0;overflow:hidden;margin-top:12px}
.mirror{position:relative;width:100%;height:100%}
.mirror canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:700px){
  .warm-ex,.warm-breath{grid-template-columns:minmax(0,1fr)}
  .wx-main{position:static}
  .sess-steps{columns:1}
}

/* ---------------------------------------------------------------- the session screen and Hands-free */
.sess-screen{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-bottom:18px}
.ss-top{display:flex;justify-content:space-between;width:100%;color:var(--ink2);font-size:14px}
.ss-name{font:400 40px/1.05 var(--display);margin:4px 0 0}
.ss-stage{position:relative;width:min(300px,72vw);aspect-ratio:1}
.ss-ring,.ss-ring svg{position:absolute;inset:0;width:100%;height:100%}
.ss-track{fill:none;stroke:var(--rule);stroke-width:5}
.ss-arc{fill:none;stroke:var(--rose);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ss-anim{position:absolute;inset:16%;display:grid;place-items:center}
.ss-anim .anim,.ss-anim svg{width:100%;height:100%}
.ss-left{font:400 52px/1 var(--display);font-variant-numeric:tabular-nums}
.ss-phase{min-height:1.3em;color:var(--ink);font-size:17px}
.ss-next{color:var(--ink2);font-size:15px}
.ss-controls{justify-content:center;margin-top:6px}
.ss-btn{min-width:96px;justify-content:center}
.ss-btn.armed{background:var(--warn);color:var(--onacc);border-color:var(--warn)}
.ss-detail{text-align:left;width:100%;margin-top:10px}
.ss-intro{font-size:16px;margin:0 0 8px}
.ss-done{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0}
/* Hands-free: the calm screen, big targets, no tabs */
body.hf-on #tabs,body.hf-on #dock{display:none}
.sess-screen.hf{min-height:calc(100dvh - var(--toph) - 40px);justify-content:center;gap:14px}
.sess-screen.hf .ss-name{font-size:48px}
.sess-screen.hf .ss-stage{width:min(340px,80vw)}
.sess-screen.hf .ss-btn{min-width:110px;min-height:56px;font-size:18px}
/* the animations */
.anim svg{overflow:visible}
.anim [class^="a-"]{stroke:var(--rose);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a-breath{fill:var(--rose)!important;opacity:.28;transform-origin:60px 60px;animation:a-breathe 8s ease-in-out infinite}
.inhale .a-breath{animation:none;transform:scale(1.25);transition:transform 3s ease-in-out}
@keyframes a-breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.25)}}
.a-lip{fill:var(--rose)!important;opacity:.5;animation:a-flutter .08s linear infinite alternate}
.a-lo{animation-direction:alternate-reverse}
@keyframes a-flutter{from{transform:translateY(-1.6px)}to{transform:translateY(1.6px)}}
.a-air{opacity:.6;stroke-dasharray:4 6;animation:a-blow .6s linear infinite}
@keyframes a-blow{to{stroke-dashoffset:-20}}
.a-ring{transform-origin:60px 60px;opacity:0;animation:a-hum 2.4s ease-out infinite}
.a-ring.r2{animation-delay:.8s}.a-ring.r3{animation-delay:1.6s}
@keyframes a-hum{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.a-curve{opacity:.35}
.a-dot{fill:var(--rose)!important;stroke:none!important}
.a-tap{fill:var(--rose)!important;stroke:none!important;opacity:.25;transform-box:fill-box;transform-origin:center;animation:a-tap 1s ease-in-out infinite}
@keyframes a-tap{0%,100%{opacity:.25;transform:scale(.8)}12%{opacity:1;transform:scale(1.15)}}
.a-sway{transform-origin:60px 100px;animation:a-sway 4s ease-in-out infinite}
.a-sway *{stroke:var(--rose);fill:none;stroke-width:3}
@keyframes a-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.a-straw{stroke-width:6!important;opacity:.6}
.a-bub{fill:var(--rose)!important;stroke:none!important;opacity:0;animation:a-bub 2.1s ease-out infinite}
@keyframes a-bub{0%{transform:translate(0,0);opacity:.8}100%{transform:translate(10px,-24px);opacity:0}}
.anim[data-anim="melody"] svg{width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}.anim animateMotion{display:none}}
@media (max-width:700px){.ss-name{font-size:34px}.sess-screen.hf .ss-name{font-size:40px}}

/* ---------------------------------------------------------------- Today */
.today{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1100px;margin:0 auto}
.today-hero{display:flex;flex-direction:column;align-items:center;gap:12px}
.today-begin{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);padding:4px}
.tb-word{font:400 32px/1.1 var(--display)}
.tb-sub{color:var(--ink2);font-size:15px}
.bring.idle .bring-c{animation:a-breathe 8s ease-in-out infinite}
.today-hf{min-height:52px;font-size:17px;padding:10px 24px}
.today-plans{justify-content:center}
.ladder5{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:l}
.ladder5 li{counter-increment:l;display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.ladder5 li:first-child{border-top:0}
.ladder5 li::before{content:counter(l);grid-row:span 2;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rose);color:var(--rose);display:grid;place-items:center;font-size:13px;font-weight:600}
.ladder5 li.done::before{content:"✓";background:var(--sage);border-color:var(--sage);color:var(--onacc)}
.ladder5 b{font-weight:600}
.ladder5 span{font-size:13px;color:var(--ink2)}
.today-range p{margin:6px 0 10px;font-size:14px;color:var(--ink2)}
.tr-col{height:260px;display:flex;justify-content:center}
.tr-col svg{height:100%;width:auto}
.today-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.today-card{text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.today-card p{margin:0;font-size:14px;color:var(--ink2)}
@media (min-width:900px){
  .today{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,280px);align-items:start}
  .today-range{grid-column:1;grid-row:1 / span 2}
  .today-hero{grid-column:2;grid-row:1}
  .today-ladder{grid-column:2;grid-row:2}
  .today-cards{grid-column:3;grid-row:1 / span 2;grid-template-columns:minmax(0,1fr)}
}

/* ---------------------------------------------------------------- Sing Together */
.tg-parts{gap:10px 14px}
.tg-top{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.tg-lane{height:240px;padding:8px;overflow:hidden}
.tg-go{gap:10px}
.tg-says{margin:0;color:var(--ink2);font-size:15px;min-height:1.4em}
.tg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:0 14px;align-items:start}
.tg-card p{margin:10px 0 0;color:var(--ink2);line-height:1.5}
.tg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tg-table{border-collapse:separate;border-spacing:3px;font-size:14px}
.tg-table th{font-weight:600;color:var(--mute);font-size:12px;padding:2px 4px}
.tg-table th button,.tg-table td button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:5px 7px;border-radius:9px}
.tg-table td.l{font-size:13px;color:var(--ink2);white-space:nowrap;padding-right:6px}
.tg-table td.l button{flex-direction:row;gap:6px}
.tg-table td.maj button{background:color-mix(in srgb,var(--rose) 18%,transparent)}
.tg-table td.min button{background:color-mix(in srgb,var(--teal) 16%,transparent)}
.tg-table small{font-size:10px;color:var(--mute)}
.tg-safe td{text-align:center;min-width:26px;border-radius:7px}
.tg-safe td.on{background:color-mix(in srgb,var(--rose) 22%,transparent);font-weight:600}
.tg-safe td.off{color:var(--mute)}
.tg-grid svg{width:100%;max-width:300px;height:auto;display:block;margin:8px 0}
.tg-stacks{display:flex;flex-wrap:wrap;gap:10px}
.tg-stack{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--glass);min-width:84px}
.tg-stack b{font-weight:600;font-size:14px}
.tg-stack small{font-size:11.5px;color:var(--mute);text-align:center}
.tg-col{display:flex;flex-direction:column;gap:3px}
.tg-col i{font-style:normal;width:34px;height:26px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--teal) 22%,transparent);font-weight:600}
.tg-col i.lead{background:var(--rose);color:var(--onacc)}
.tg-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.tg-blend{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.tg-blend dt{font-weight:600}
.tg-blend dd{margin:0;color:var(--ink2)}
@media (max-width:600px){ .tg-lane{height:200px} .tg-parts .seg button{padding:7px 12px;font-size:14px} }
.tg-stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.tg-fig{display:grid;align-items:center;padding:10px;overflow-x:auto}
.tg-fig svg{height:200px;width:auto;min-width:100%;max-width:none}   /* drawn at a readable size; a long phrase scrolls inside the card */
@media (max-width:760px){ .tg-stage{grid-template-columns:minmax(0,1fr)} .tg-fig svg{height:170px} }
.ss-begin{display:block;margin:6px auto 0;min-width:min(100%,260px);min-height:64px;font-size:22px}
/* Duet: two singers at one screen */
.tg-duet-parts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:12px 0}
.tg-duet-parts .tg-who{font-size:1.1em}
.tg-duet-parts .tg-says{flex-basis:100%;margin:2px 0 0}
.tg-add{margin:0 0 12px}
.tg-phrases{align-items:center;gap:10px;margin:10px 0}
.duet-stage{padding:12px 14px;min-width:0;max-width:100%;overflow:hidden}   /* a long phrase scrolls inside, never the page */
.duet-phrase{overflow-x:auto}
.duet-row{padding:4px 0}
.duet-name{display:block;font-weight:700;font-size:1.05em;letter-spacing:.02em}
.duet-svg svg{display:block;max-width:none}
.duet-next{opacity:.4;margin-top:8px;border-top:1px dashed var(--rule);padding-top:6px;overflow:hidden}
/* the duet's full-screen view (body.hf-on hides the tabs and the dock) */
.duet-full{position:fixed;inset:0;z-index:60;background:var(--grad);display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
.df-top{display:flex;align-items:baseline;gap:12px;font-size:1.25em}
.df-top #df-close{margin-left:auto}
.duet-full-stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.duet-full-stage .duet-name{font-size:1.3em}
.df-go{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.df-go .btn{min-height:52px;padding-inline:22px;font-size:1.05em}
/* your own songs: the editor (the ladder on the left, the roll on the right; stacked on a phone) */
.tg-mine{margin:-4px 0 12px}
.se-fields .se-input{font:inherit;padding:8px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);min-width:0}
.se-fields #se-title{width:14em;max-width:100%}
.se-num{width:5.5em}
.se-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.se-ladder{display:flex;flex-direction:column;gap:3px}
.se-rung{font:inherit;font-size:.92em;padding:6px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);text-align:left;min-height:34px;white-space:nowrap}
.se-rung.do{font-weight:700;border-color:var(--rose)}
.se-right{min-width:0;display:flex;flex-direction:column;gap:10px}
.se-roll{position:relative;overflow-x:auto;overflow-y:hidden;border-radius:12px;background:color-mix(in srgb, var(--panel) 70%, transparent);border:1px solid var(--rule)}
.se-roll-in{position:relative;height:100%;min-width:100%}
.se-bar{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
.se-note,.se-hnote{position:absolute;height:22px;border-radius:11px;border:0;padding:0 6px;font:700 12px/22px var(--body, inherit);color:#fff;background:var(--rose);text-align:left;overflow:hidden;cursor:pointer}
.se-note{height:22px}
.se-note.rest{background:transparent;border:1.5px dashed var(--rule)}
.se-note.sel,.se-hnote.sel{outline:3px solid var(--gold);outline-offset:1px}
.se-hnote{background:var(--teal);height:26px;line-height:26px;font-size:13px;border-radius:13px}
.se-hnote.pinned{box-shadow:inset 0 0 0 2px #fff}
.se-hnote.off{background:var(--warn)}
.se-roll-k{position:absolute;left:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted, #888)}
.se-empty{position:absolute;left:16px;top:40%;margin:0}
.se-htools{align-items:center}
.se-warn{color:var(--warn);font-size:.92em}
.se-chords{display:flex;flex-wrap:wrap;gap:8px}
.se-barchord{display:flex;flex-direction:column;gap:2px;font-size:.85em}
.se-chord{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
.se-words{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
.se-end{gap:10px;flex-wrap:wrap;margin:8px 0 24px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
@media (max-width:560px){ .se-grid{grid-template-columns:1fr} .se-ladder{flex-direction:row;flex-wrap:wrap} .se-rung{min-height:40px;padding:6px 8px} }

/* ---------------------------------------------------------------- Songs & Keys: move a song (sk-) */
.sk-move{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;align-items:start;margin-top:10px}
@media (max-width:860px){.sk-move{grid-template-columns:minmax(0,1fr)}}
.sk-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.sk-song .pick select{max-width:100%}
.sk-notes{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:8px}
.sk-note{display:flex;align-items:flex-end;gap:8px}
.sk-key{font-family:var(--display);font-size:36px;line-height:1.1;margin:0 0 6px}
.sk-result .ok{color:var(--ok)} .sk-result .warn{color:var(--warn);font-weight:600}
.sk-result .kb{margin:10px 0 6px;max-width:100%;overflow-x:auto}
.sk-keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.sk-keys button{min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:transparent;color:var(--mute);font-family:var(--display);font-size:20px}
.sk-keys button[data-fit="fits"]{border-color:var(--sage);color:var(--ink);background:color-mix(in srgb,var(--sage) 14%,transparent)}
.sk-keys button[data-fit="tight"]{border-color:var(--warn);border-style:dashed;color:var(--ink)}
.sk-keys button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.sk-listcard .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#sk-title{flex:1 1 160px;min-width:0;min-height:44px;border:1px solid var(--rule);border-radius:10px;background:transparent;color:var(--ink);padding:0 12px;font:inherit}
.sk-list{display:flex;flex-direction:column;gap:4px}
.sk-row{display:flex;align-items:center;gap:6px;border-top:1px solid var(--rule);padding-top:4px}
.sk-open{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink2);font:inherit;padding:8px 0;min-height:44px}
.sk-open b{color:var(--ink)}
.sk-x{width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:22px}
/* Songs & Keys: the circle and the chords in a key */
.sk-cof{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.sk-cof{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sk-cof button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 2px;border-radius:12px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);min-width:0}
.sk-cof b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.1}
.sk-cof small{font-size:11.5px;color:var(--mute);text-align:center}
.sk-cof span{color:var(--navy);font-weight:600}
.sk-cof button[aria-pressed="true"]{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.sk-chords{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px}
@media (max-width:700px){.sk-chords{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sk-chords button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:12px;border:1.5px solid var(--rule);background:transparent;color:var(--ink);min-width:0;transition:background .15s}
.sk-chords button.on{background:color-mix(in srgb,var(--sage) 22%,transparent);border-color:var(--sage)}
.sk-chords .nm{font-family:var(--display);font-size:24px}
.sk-chords .rn{font-size:12px;font-weight:700;color:var(--sage)}
.sk-chords .ns{font-size:12px;color:var(--mute)}
/* the phone: tab strips wrap instead of running off the edge, and a choice group is a row of separate chips, not one tall pill */
@media (max-width:600px){
  .warm-tabs,.ear-modes{flex-wrap:wrap;overflow-x:visible}
  .warm-tabs button,.ear-modes button{padding:8px 14px}
  .seg{display:flex;background:none;border:0;padding:0;gap:6px}
  .seg button{background:var(--glass);border:1px solid var(--rule);padding:8px 14px}
  .seg button[aria-pressed="true"]{border-color:var(--ink)}
}

/* ===== VI · the Song Sketchpad (cp-): your song | the compass with the microphone under it | then notes to sing, words, saved songs */
:root{--cp-wedge:color-mix(in srgb,var(--sage) 18%,var(--bg))}
:root[data-theme="dusk"]{--cp-wedge:color-mix(in srgb,var(--sage) 26%,var(--bg))}
.controls{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:flex-end;margin:4px 0 10px}
.controls .ctl{display:flex;flex-direction:column;gap:3px;min-width:0}
.controls .tempo{display:flex;align-items:center;gap:8px;min-height:44px}
.controls .tempo input[type=range]{width:140px}
.controls .tempo output{font-weight:800;font-size:15px;min-width:6ch;font-variant-numeric:tabular-nums}
.cp-name{border:0;border-bottom:1.5px solid var(--rule);background:transparent;font-family:var(--display);font-size:22px;letter-spacing:.05em;padding:3px 0;min-width:0;width:100%;color:var(--ink)}
.cp-studio{display:grid;grid-template-columns:minmax(0,.9fr) minmax(360px,1.1fr);gap:14px 34px;align-items:start}
@media (max-width:760px){.cp-studio{grid-template-columns:minmax(0,1fr)}.cp-dialcol{order:-1}}
.cp-songbox{display:flex;flex-direction:column;gap:8px}
.cp-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cp-bar{border:1.5px solid var(--rule);background:transparent;border-radius:9px;min-height:62px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;min-width:0;color:var(--ink)}
.cp-bar .cn{font-family:var(--display);font-size:21px;line-height:1.05}
.cp-bar .rn{font-size:11.5px;font-weight:700;color:var(--mute)}
.cp-bar.out .rn{color:var(--rust)}
.cp-bar[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.cp-bar.now{background:var(--panel2)}
.cp-bar.empty{border-style:dashed;color:var(--mute);font-weight:700;text-align:center;font-family:var(--display);font-size:22px}
.cp-bar.empty.first{font-size:12.5px;font-family:var(--body)}
.cp-x{position:absolute;top:1px;right:4px;color:var(--mute);font-size:16px;line-height:1;padding:2px 4px}
.cp-form{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.cp-form span{border-radius:6px;padding:3px 8px;color:var(--onacc)}
.cp-form .chip{min-height:30px;min-width:0;padding:3px 8px;font-size:12.5px}
.cp-where{border-left:3px solid var(--sage);padding:4px 0 4px 10px;font-size:14px;color:var(--ink2);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.cp-where b{color:var(--ink)}
.cp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-tools .quiet{border-color:transparent;color:var(--ink2);padding-left:4px;padding-right:4px}
.cp-dialcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cp-dialcol>div:first-child{width:100%;display:flex;justify-content:center}
.cp-dial{width:100%;max-width:340px;height:auto;display:block;user-select:none;-webkit-user-select:none}
@media (min-height:900px){.cp-dial{max-width:440px}}
@media (max-width:760px){.cp-dial{max-width:420px}}
.cp-dial text{font-family:var(--body);pointer-events:none}
.cp-cell{cursor:pointer}
.cp-cell:focus-visible path:first-child{stroke:var(--gold);stroke-width:3}
.cp-needle{transition:transform .45s cubic-bezier(.3,1.35,.5,1);transform-origin:220px 220px}
@media (prefers-reduced-motion:reduce){.cp-needle{transition:none}}
/* the listening block under the wheel */
.cp-live{width:100%;max-width:430px;display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.cp-live{max-width:none}}
.cp-live .cp-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-live .cp-top .btn{min-width:7.5em;justify-content:center}
.cp-for{font-size:16px;min-height:40px;padding-top:5px;padding-bottom:4px;font-weight:700}
.cp-hear{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.cp-hear>div:first-child{min-width:0}
.cp-meter{position:relative;height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.cp-meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rule);border-radius:6px;transition:width .06s linear}
.cp-meter.hot i{background:var(--sage)}
.cp-meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.cp-cents{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-cents:empty{display:none}
.cp-cents.ok{color:var(--ok)}
.cp-heardbox{display:flex;align-items:baseline;gap:9px;min-width:8ch;max-width:60%;justify-content:flex-end;text-align:right;flex-wrap:wrap}
.cp-heardbox b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;transition:opacity .2s;color:var(--ink)}
.cp-heardbox b.dim{opacity:.3}
.cp-heardbox small{font-size:12.5px;font-weight:700;color:var(--mute)}
/* the suggested chords: one line of chips, ruled in the wheel's own colours */
.cp-next{width:100%;max-width:430px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp-next .lbl{font-size:12.5px;font-weight:700;color:var(--mute);margin-right:2px}
.cp-next .chip{border-left-width:4px;min-width:0;padding:4px 9px 3px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.cp-next .chip b{font-family:var(--display);font-weight:400;font-size:18px}
.cp-next .chip small{font-size:10.5px;font-weight:700;color:var(--mute)}
.cp-next .chip.next{border-left-color:var(--gold)}
.cp-next .chip.far{border-left-color:var(--rust)}
/* what a take heard: the line, the key it fits, the chords under it */
.cp-msg{font-size:14px;color:var(--ink2)}
.cp-msg:empty{display:none}
.cp-msg b{color:var(--ink)}
.cp-take{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--sage);padding:2px 0 2px 10px}
.cp-take .heard{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.cp-take .lbl{font-size:12px;font-weight:700;color:var(--mute);margin-right:2px}
.cp-take .line{font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--ink);word-spacing:.15em}
.cp-take .heard .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--mute);min-height:0;padding:0 4px;align-self:center}
.cp-take .key,.cp-take .under{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cp-take .under b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.cp-take .chip{min-height:30px;min-width:0;padding:3px 9px;font-size:12.5px}
.cp-take .chip.acc{background:var(--sage);border-color:var(--sage);color:var(--onacc)}
.cp-lower{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.cp-land{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px;color:var(--ink2)}
.cp-land b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.cp-land small{font-size:12px;font-weight:700;color:var(--mute)}
/* inside the Breath shell: the old frame's quiet button, the form's label, the take-length select, the wheel at phone width */
.cp-tools .btn.quiet{background:transparent;color:var(--ink2)}
.cp-form span.muted{background:none;color:var(--mute);padding-left:0}
.cp-form b.muted{color:var(--mute)}
.cp-for{border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:0 14px;min-height:44px}
.cp-dialcol,.cp-dialcol>div:first-child{width:100%;min-width:0}
.cp-dial{max-width:min(440px,100%)}

,3],"why":"a yawn lifts the palate and drops the larynx; sighing down from the top lets go of whatever the session tightened","how":"start a yawn, then sigh the sound down from the top on an easy “hah”. Let it get breathy at the bottom. Nothing is held.","climb":3,"start":"C4","startMidi":60,"legato":true},{"id":"cooldown","name":"Descending slides","cat":"Cool-down","pattern":["5","4","3","2","1"],"semis":[7,5,4,2,0],"syl":"oh → ah","beats":[1,1,1,1,2],"why":"two or three minutes of downward slides bring the voice back to speaking range and leave the folds settled, not swollen","how":"light and lazy, sliding down on “oh” opening to “ah”, a little lip trill on the bottom note. Go as low as is easy, never pushed.","climb":3,"start":"E4","startMidi":64,"legato":true},{"id":"hey","name":"“Hey!” pulses","cat":"Distortion","pattern":["1","1","1","1"],"semis":[0,0,0,0],"syl":"hey!","beats":[1,1,1,1],"why":"each “hey” is a kick from the belly on open air: the power a scream needs comes from support, so this builds the engine first","how":"call it like you are hailing a friend across a street — not shouting, calling. The belly flicks in on every “hey”; the throat stays open.","climb":3,"start":"G3","startMidi":55,"legato":false},{"id":"fry","name":"Vocal fry","cat":"Distortion","pattern":["1"],"semis":[0],"syl":"uhhh (fry)","beats":[6],"why":"the creaky, rattling lowest register — folds vibrating loosely and slowly on almost no air. It is the source of the fry scream","how":"a lazy, bored “uhhh” on a slow exhale until it crackles like a creaky door. Soft, steady, effortless. If it tightens, you have left fry and started squeezing.","climb":2,"start":"G3","startMidi":55,"legato":true},{"id":"fryscale","name":"Fry into tone","cat":"Distortion","pattern":["1","2","3","2","1"],"semis":[0,2,4,2,0],"syl":"uh (fry → tone)","beats":[2,1,1,1,2],"why":"links the fry to a sung note and back, so the rattle sits on top of the voice instead of replacing it","how":"start in fry, let the p
