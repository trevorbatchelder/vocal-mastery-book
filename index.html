  const src = seg('Song', [['book', 'From the book'], ['any', 'Any song']], st.src, x => set('src', x)); skId(src).id = 'sk-src'; tools.append(src);
  v.append(tools);

  // the song: a piece from the book (or one of yours), or any song by its key and its two ends
  const msg = h('p', {class: 'muted', id: 'sk-msg'});
  let span = null, title = st.title;
  const songBox = h('div', {class: 'card sk-song'});
  if (st.src === 'book') {
    if (mySongsLoaded && !skShelf().some(g => g.items.some(x => x[0] === st.piece))) { st.piece = skShelf()[0].items[0][0]; save(); }   // a song that is gone
    const piece = pieceById(st.piece);
    songBox.append(pick('Song', skShelf(), piece.id, x => set('piece', x), 'sk-piece'));
    span = pieceSpan(piece); title = piece.title;
    if (span) songBox.append(h('p', {class: 'muted'}, `As written: ${span.key} ${span.mode}, from ${noteIn(span.key, span.mode, span.lo)} to ${noteIn(span.key, span.mode, span.hi)}.`));
    else songBox.append(h('p', {}, `“${piece.title}” has no notes yet.`));
  } else {
    const keyOpts = [{group: 'Major', items: D.keys.map(k => [`${k}:major`, `${k} major`])}, {group: 'Minor', items: keyNames('minor').map(k => [`${k}:minor`, `${k} minor`])}];
    const note = (label, k, id) => {

      return h('div', {class: 'sk-note'}, pick(label, SK_NOTES.map(m => [m, midiName(m)]), st[k], x => set(k, +x), id), btn);
    };
    songBox.append(pick('Key it is in', keyOpts, `${st.key0}:${st.mode}`, x => { const [k, m] = x.split(':'); st.key0 = k; set('mode', m); }, 'sk-key0'),
      h('div', {class: 'sk-notes'}, note('Lowest note', 'lo', 'sk-lo'), note('Highest note', 'hi', 'sk-hi')), msg);
    span = songSpan({key: st.key0, mode: st.mode, lo: st.lo, hi: st.hi});
  }
  const left = h('div', {class: 'sk-col'}, songBox), right = h('div', {class: 'sk-col'});
  v.append(h('div', {class: 'sk-move'}, left, right));
  if (span) drawAnswer(left, right, st, span, who, ranges, rangeOf, set);
  drawKeyList(right, st, span, title, who, save);
}

// the answer: the key, how far it moved, the new ends against the range, a guitar capo, and the other eleven keys
function drawAnswer(left, right, st, span, who, ranges, rangeOf, set) {
  const choices = keyChoices(span, ranges), c = (st.pick && choices.find(x => x.key === st.pick)) || choices[0];
  const nm = m => noteIn(c.key, span.mode, m);
  const ends = who.map((s, i) => [c.lo - c.shifts[0] + c.shifts[i], c.hi - c.shifts[0] + c.shifts[i]]);
  const res = h('div', {class: 'card sk-result'},
    h('div', {class: 'sk-key'}, `Sing it in ${c.key} ${span.mode}.`),
    h('p', {}, c.move === 0 ? 'That is where it is written.' : `That is ${moveWords(c.move)} from ${span.key} ${span.mode}.`),
    h('p', {}, who.length === 1 ? `Lowest ${nm(ends[0][0])}, highest ${nm(ends[0][1])}.`
      : who.map((s, i) => `${s.name}: ${nm(ends[i][0])} to ${nm(ends[i][1])}`).join(' · ') + '.'));
  // the fit, per singer: inside, or which end runs past and by how much (amber)
  const past = who.map((s, i) => { const r = ranges[i] || keysMid(); return {s, i, low: r[0] - ends[i][0], high: ends[i][1] - r[1]}; }).filter(x => x.low > 0 || x.high > 0);
  const whose = who.length === 1 ? (ranges[0] ? 'your range' : 'a middle range') : ranges.every(Boolean) ? 'both your ranges' : 'both ranges';
  if (!past.length) res.append(h('p', {class: 'ok'}, `Inside ${whose}${who.length === 1 && c.room >= 2 ? ', with room at both ends' : ''}.`));
  past.forEach(({s, i, low, high}) => { const hs = n => `${n} half step${n === 1 ? '' : 's'}`;
    res.append(h('p', {class: 'warn'}, low > 0 && high > 0 ? `This song is wider than ${rangeOf(s, i)}: the top runs past by ${hs(high)} and the bottom by ${hs(low)}.`
      : high > 0 ? `The top runs past ${rangeOf(s, i)} by ${hs(high)}.` : `The bottom runs past ${rangeOf(s, i)} by ${hs(low)}.`)); });
  if (who.length === 2 && c.shifts[0] !== c.shifts[1]) { const up = c.shifts[1] > c.shifts[0] ? who[1] : who[0];
    res.append(h('p', {}, `${skSings(up)} it ${Math.abs(c.shifts[1] - c.shifts[0]) > 12 ? 'two octaves' : 'an octave'} higher.`)); }
  const noRange = who.filter((s, i) => !ranges[i]);
  if (noRange.length) res.append(h('p', {class: 'muted'}, who.length === 1 ? 'Using a middle range. Find yours in Ear & Pitch.'
    : noRange.map(s => `${s.name} has no range yet, so a middle range stands in.`).join(' '), ' ', h('button', {class: 'linkbtn', on: {click: () => { setActiveSinger(noRange[0].id); go('ear'); }}}, 'Find a range')));
  const r0 = ranges[0] || keysMid(), lo = Math.max(36, Math.min(r0[0], ...ends.flat()) - 2), hi = Math.min(84, Math.max(r0[1], ...ends.flat()) + 2);
  res.append(keyboard(lo, hi, {lit: [...new Set(ends.flat())], you: ranges[0] || null, on: m => hearNote(m)}),
    h('div', {class: 'row'}, h('button', {class: 'btn', id: 'sk-hear', on: {click: () => hearPair(ends[0][0], ends[0][1])}}, 'Hear the lowest and highest')));
  const cap = capoFor(c.key, span.mode), shape = x => `${x.shape} shapes`;
  if (cap.length) res.append(h('p', {class: 'muted'}, `On guitar: ${cap[0].capo ? `capo ${cap[0].capo}, play the ${shape(cap[0])}` : `play the ${shape(cap[0])}, no capo`}`
    + (cap[1] ? `, or capo ${cap[1].capo} with the ${shape(cap[1])}.` : '.')));
  left.append(res);
  right.append(h('div', {class: 'card'}, h('div', {class: 'k'}, 'Other keys, best first'),
    h('div', {class: 'sk-keys'}, choices.map(x => h('button', {'data-fit': x.fit, 'aria-pressed': x.key === c.key ? 'true' : 'false',
      'aria-label': `${x.key} ${span.mode}: ${x.fit === 'fits' ? 'fits' : x.fit === 'tight' ? 'a stretch' : 'out of range'}`, on: {click: () => { st.pick = x.key; keep('songs', st); go('songs', 'move'); }}}, x.key))),
    h('p', {class: 'muted'}, 'Solid sage fits, dashed amber is a stretch, faint runs out of range.')));
}

// listen for one held note: 0.6 s of steady pitch (within half a semitone of its middle) gives the note; 8 s of nothing gives up
async function listenNote(btn, msg) {
  msg.textContent = '';
  let left = false; onLeave(() => { left = true; });          // a tap elsewhere while the permission is still being asked
  const ok = Mic.ok || await Mic.open();
  if (left) { if (ok) Mic.stop(); return null; }
  if (!ok) { msg.textContent = micMessage(Mic.state); return null; }
  return new Promise(res => {
    const buf = []; let done = false, un = () => {}, to = 0;
    const finish = m => { if (done) return; done = true; un(); clearTimeout(to); Mic.stop(); btn.textContent = 'Sing it'; res(m); };
    btn.textContent = 'Listening'; msg.textContent = 'Sing the note and hold it.';
    un = Mic.onFrame(fr => {
      const now = performance.now();
      if (fr.midi == null) { buf.length = 0; return; }
      buf.push({t: now, m: fr.midi}); while (buf.length && buf[0].t < now - 600) buf.shift();
      if (buf[buf.length - 1].t - buf[0].t < 550) return;
      const med = buf.map(x => x.m).sort((a, b) => a - b)[buf.length >> 1];
      if (buf.every(x => Math.abs(x.m - med) < .5)) { msg.textContent = ''; finish(Math.min(84, Math.max(36, Math.round(med)))); }   // inside the pickers' reach
    });
    to = setTimeout(() => { msg.textContent = 'The book heard no steady note. Hold one note a little longer.'; finish(null); }, 8000);
    onLeave(() => finish(null));
  });
}

// Keys & chords: the twelve keys round the circle of fifths (signature, relative minor), and the seven chords of the one you pick
function drawKeysView(v, st, save) {
  const K = D.keys.includes(st.key) ? st.key : 'C', row = D.cof.find(r => r[0] === K), rows = D.chordsInKey[K];
  v.append(h('p', {class: 'lede', html: glossify('Each step along the circle of fifths adds a sharp or takes away a flat, and the next key shares six of its seven notes. Pick a key to see and hear its chords.')}));
  const cof = h('div', {class: 'sk-cof'}, D.cof.map(([k, sig, m]) => h('button', {'data-key': k, 'aria-pressed': k === K ? 'true' : 'false',
    on: {click: () => { st.key = k; save(); hearChord(chordMidi(k, D.chordsInKey[k][0])); go('songs', 'keys'); }}},
    h('b', {}, k), h('small', {}, sig === '—' ? 'none' : sig), h('span', {}, m))));
  const cards = rows.map(r => h('button', {on: {click: e => { hearChord(chordMidi(K, r)); const c = e.currentTarget; c.classList.add('on'); setTimeout(() => c.classList.remove('on'), 300); }}},
    h('span', {class: 'nm'}, r.name), h('span', {class: 'rn'}, r.roman), h('span', {class: 'ns'}, r.notes.join(' '))));
  const minor = row[2].slice(0, -1) + ' minor';
  v.append(h('div', {class: 'card'}, h('div', {class: 'k'}, 'The circle of fifths'), cof),
    h('div', {class: 'card'}, h('div', {class: 'k'}, `The chords in ${K} major`), h('div', {class: 'sk-chords'}, cards),
      h('p', {class: 'muted sk-rel'}, `Its relative minor, ${minor}, uses the same seven chords; its home chord is the vi.`)));
  offer({label: `I–IV–V–I in ${K}`, play: (bpm, onStop, onBeat) => { const b = 60 / bpm, ev = [];
    [0, 3, 4, 0].forEach((d, i) => { for (let k = 0; k < 4; k++) ev.push({at: (i * 4 + k) * b, fn: t => { click(t, k === 0); if (k === 0) chordMidi(K, rows[d]).forEach(m => sing(m, t, b * 3.8, {gain: .18})); },
      ui: () => { onBeat(k); cards.forEach((c, j) => c.classList.toggle('on', j === d)); }}); });
    Seq.run(ev, 16 * b, () => { cards.forEach(c => c.classList.remove('on')); onStop(); }); }});
}

/* ---- session.js ---- */
/* ================================================================ the session engine: a plan of timed steps, run for you
   No DOM here: the screen (sessscreen.js) draws it, Hands-free adds the voice. The clock waits while the voice names a step,
   the book sings each pitched step from your range, the last five seconds tick, and a finished session counts the day. */
function durWords(secs) {
  const words = {60: 'One minute', 90: 'A minute and a half', 120: 'Two minutes', 180: 'Three minutes'};
  return words[secs] || `${secs} seconds`;
}
// what the voice says as a step begins: its name and length every time, how to do it only the first three times
const HEARD_TIMES = 3;
function stepLines(id, secs, heard) {
  const c = D.coach[id] || {cue: id}, lines = [`${c.cue}. ${durWords(secs)}.`];
  if (c.intro && (heard[id] || 0) < HEARD_TIMES) lines.push(c.intro);
  return lines;
}
const PLAN_OF = id => D.sessions.find(p => p.id === id) || D.sessions.find(p => p.id === 'daily');
const doneToday = () => { const d = store.get('done.' + today(), {}); return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; };

function makeSession(planId, {auto = true, sing = true, voice = false, speakMax = null, onChange = () => {}, onTick = () => {}, onDone = () => {}, onStep = () => {}} = {}) {
  const plan = PLAN_OF(planId), R = savedRange();
  const steps = plan.steps.map(s => ({id: s.id, secs: s.secs, ex: EXMAP[s.id] || null, c: D.coach[s.id] || {cue: s.id}}));
  let timer = 0, watchdog = 0, counted = false;
  const S = {plan, steps, i: -1, left: 0, elapsed: 0, running: false, paused: false, speaking: false,
    get step() { return steps[S.i] || null; }, get next() { return steps[S.i + 1] || null; },
    start() { if (S.running) return; try { audio(); } catch (e) {} S.running = true; S.paused = false; if (auto) timer = setInterval(S.tick, 1000); begin(0); },
    tick() {
      if (!S.running || S.paused || S.speaking) return;
      S.left--; S.elapsed++;
      if (S.elapsed === 300) count();                      // five minutes practised counts the day, finished or not
      if (S.left > 0 && S.left <= 5) chime(false);
      onTick(S);
      if (S.left <= 0) { const d = doneToday(); d[S.step.id] = true; store.set('done.' + today(), d); begin(S.i + 1); }
    },
    pause() { if (!S.running || S.paused) return; S.paused = true; S.speaking = false; quiet(); onChange(S); },   // not speaking: a cancelled line's onend says nothing more
    resume() { if (!S.running || !S.paused) return; S.paused = false; S.speaking = false; singStep(); onChange(S); },
    skip() { if (S.running) begin(S.i + 1); },
    end() { stopAll(); onChange(S); },
  };
  function count() { if (!counted) { counted = true; markDay(); } }
  function chime(accent) { try { click(A.ctx.currentTime + .01, accent); } catch (e) {} }
  function quiet() { clearTimeout(watchdog); if (typeof Seq !== 'undefined') Seq.stop(); if (voice) Speak.stop(); }
  function stopAll() { quiet(); clearInterval(timer); S.running = false; S.paused = false; S.speaking = false; }
  function singStep() {
    const st = S.step; if (!sing || !st || !st.ex || !S.running || S.paused) return;
    let {start, climb} = warmStart(st.ex, R);
    if (st.ex.cat === 'Distortion' || st.ex.cat === 'Cool-down') climb = Math.min(climb, 3);
    exerciseLoop(st.ex, start, climb, M.bpm, (k, root) => onStep(k, root, st));
  }
  function begin(j) {
    quiet();
    if (j >= steps.length) { stopAll(); count(); onChange(S); onDone(S); return; }
    S.i = j; S.left = steps[j].secs; chime(true); onChange(S);
    if (!voice) { singStep(); return; }
    // the voice names the step; the clock and the singing wait for it (or for the watchdog, if the voice never ends)
    const heard = store.get('heard', {}) || {}, lines = stepLines(steps[j].id, steps[j].secs, heard);
    S.speaking = true;
    const go_ = () => { if (!S.speaking || S.i !== j) return; S.speaking = false; clearTimeout(watchdog); singStep(); onChange(S); };
    const max = speakMax != null ? speakMax : 2 + lines.join(' ').length * .075;
    watchdog = setTimeout(go_, max * 1000);
    const say = k => { if (k >= lines.length) return go_(); Speak.say(lines[k], {onend: () => { if (S.i === j && S.speaking) say(k + 1); }}); };
    say(0);
    heard[steps[j].id] = (heard[steps[j].id] || 0) + 1; store.set('heard', heard);
  }
  return S;
}

/* ---- sessscreen.js ---- */
/* ================================================================ the session screen: one countdown, one thing to do, the next one named
   The same screen runs a session at a glance (with the how-to written underneath) and Hands-free: the phone in a pocket,
   the voice naming each step, the screen kept awake, the tabs out of the way. */

// what is happening, drawn: each coach.anim kind is one small looping picture (all still under reduced motion)
function animEl(kind, ex) {
  const svg = body => `<svg viewBox="0 0 120 120" aria-hidden="true">${body}</svg>`;
  const pics = {
    breath: svg('<circle class="a-breath" cx="60" cy="60" r="34"/>'),
    trill: svg('<path class="a-lip a-up" d="M30 58 Q45 46 60 54 Q75 46 90 58 Q60 62 30 58Z"/><path class="a-lip a-lo" d="M30 62 Q60 60 90 62 Q75 80 60 78 Q45 80 30 62Z"/>'
      + '<path class="a-air" d="M96 54h12M98 60h14M96 66h12"/>'),
    hum: svg('<path class="a-mouth" d="M34 60 Q60 66 86 60"/><circle class="a-ring r1" cx="60" cy="60" r="20"/><circle class="a-ring r2" cx="60" cy="60" r="20"/><circle class="a-ring r3" cx="60" cy="60" r="20"/>'),
    siren: svg('<path id="a-curve" class="a-curve" d="M14 92 C 40 92, 44 24, 60 24 S 80 92, 106 92"/><circle class="a-dot" r="6"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"><mpath href="#a-curve"/></animateMotion></circle>'),
    taps: svg([28, 50, 72, 94].map((x, i) => `<circle class="a-tap" style="animation-delay:${i * .25}s" cx="${x}" cy="60" r="8"/>`).join('')),
    body: svg('<g class="a-sway"><circle cx="60" cy="38" r="12"/><path d="M34 96 Q36 64 60 60 Q84 64 86 96"/></g>'),
    straw: svg('<path class="a-straw" d="M60 104 L60 30"/>' + [0, 1, 2].map(i => `<circle class="a-bub" style="animation-delay:${i * .7}s" cx="60" cy="28" r="4"/>`).join('')),
  };
  if (kind === 'melody' && ex) return h('div', {class: 'anim', 'data-anim': 'melody', html: patternSVG(ex)});
  return h('div', {class: 'anim', 'data-anim': kind in pics ? kind : 'breath', html: pics[kind] || pics.breath});
}
// where a breath step is in its phases, from the seconds it has run
function breathPhase(br, t) {
  const cycle = br.phases.reduce((a, p) => a + p[1], 0); let x = t % cycle;
  for (let k = 0; k < br.phases.length; k++) { if (x < br.phases[k][1]) return {k, name: br.phases[k][0], left: br.phases[k][1] - Math.floor(x)}; x -= br.phases[k][1]; }
  return {k: 0, name: br.phases[0][0], left: br.phases[0][1]};
}

function sessionScreen(v, planId, {handsfree = false, wait = false} = {}) {
  const C = 2 * Math.PI * 90;
  const arc = h('div', {class: 'ss-ring', html: `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ss-track" cx="100" cy="100" r="90"/><circle class="ss-arc" cx="100" cy="100" r="90" stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 100 100)"/></svg>`});
  const animBox = h('div', {class: 'ss-anim'}), left = h('div', {class: 'ss-left', id: 'ss-left'}, '');
  const name = h('h2', {class: 'ss-name', id: 'ss-name'}, ''), stepNo = h('div', {class: 'ss-step', id: 'ss-step'}), phase = h('div', {class: 'ss-phase', 'aria-live': 'polite'});
  const next = h('div', {class: 'ss-next', id: 'ss-next'}), detail = h('div', {class: 'ss-detail'});
  const pause = h('button', {class: 'btn ghost ss-btn', id: 'ss-pause'}, 'Pause'), skip = h('button', {class: 'btn ghost ss-btn', id: 'ss-skip'}, 'Skip'), end = h('button', {class: 'btn ghost ss-btn', id: 'ss-end'}, 'End');
  const screen = h('div', {class: 'sess-screen' + (handsfree ? ' hf' : '')},
    h('div', {class: 'ss-top'}, stepNo, h('div', {class: 'ss-plan'}, (PLAN_OF(planId) || {}).name + (handsfree ? ' · Hands-free' : ''))),
    name, h('div', {class: 'ss-stage'}, arc, animBox), left, phase, next, h('div', {class: 'row ss-controls'}, pause, skip, end), detail);
  v.append(screen);

  let lastId = null, wake = null;
  const draw = s => {
    const st = s.step; if (!st) return;
    if (st.id !== lastId) { lastId = st.id;
      name.textContent = st.c.cue; animBox.replaceChildren(animEl(st.c.anim, st.ex));
      if (!handsfree) detail.replaceChildren(
        h('p', {class: 'ss-intro'}, st.c.intro), h('ol', {class: 'ht-steps'}, st.c.steps.map(x => h('li', {}, x))),
        st.ex ? h('button', {class: 'linkbtn', on: {click: () => go('warm', st.id)}}, 'How to do this, with recordings') : BRMAP[st.id] ? h('button', {class: 'linkbtn', on: {click: () => go('warm', 'breath')}}, 'Breath work on its own') : null); }
    stepNo.textContent = `${s.i + 1} of ${s.steps.length}`;
    next.textContent = s.next ? `Next: ${s.next.c.cue}` : 'Last one';
    pause.textContent = s.paused ? 'Resume' : 'Pause';
    tick(s);
  };
  const tick = s => { const st = s.step; if (!st) return;
    left.textContent = s.speaking ? '…' : fmtSec(Math.max(0, s.left));
    $('.ss-arc', arc).setAttribute('stroke-dashoffset', String(C * (1 - Math.max(0, s.left) / st.secs)));
    const br = BRMAP[st.id];
    if (br) { const p = breathPhase(br, st.secs - s.left); phase.textContent = `${p.name} · ${p.left}`; screen.classList.toggle('inhale', p.k === 0); }
    else { phase.textContent = ''; screen.classList.remove('inhale'); } };
  const done = s => {
    releaseWake();
    const n = streakCount(sungDays(), today());
    screen.replaceChildren(h('div', {class: 'ss-done'}, h('h2', {class: 'ss-name'}, 'Done'), h('p', {}, `That is day ${n}. Drink some water, and keep your talking easy for a while.`),
      h('button', {class: 'btn acc', on: {click: () => go('today')}}, 'Back to Today')));
    if (handsfree) Speak.say(`That is the session. Day ${n}.`);
  };
  const S = window.__sess = makeSession(planId, {voice: handsfree, onChange: draw, onTick: tick, onDone: done,
    onStep: (k, root, st) => { const fig = $('.anim[data-anim=melody]', animBox); if (fig && st.ex && k >= 0) fig.innerHTML = patternSVG(st.ex, {lit: k}); }});

  pause.addEventListener('click', () => S.paused ? S.resume() : S.pause());
  skip.addEventListener('click', () => S.skip());
  let armed = 0;   // End takes two taps: a pocket press must not throw the session away
  end.addEventListener('click', () => {
    if (!armed) { end.textContent = 'Tap End again to stop'; end.classList.add('armed'); armed = setTimeout(() => { armed = 0; end.textContent = 'End'; end.classList.remove('armed'); }, 3000); return; }
    clearTimeout(armed); S.end(); go('today'); });

  // Hands-free: the screen stays awake; a hidden page pauses (and asks for the screen again when it comes back)
  async function askWake() { try { if (navigator.wakeLock && navigator.wakeLock.request) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
  function releaseWake() { try { wake && wake.release && wake.release(); } catch (e) {} wake = null; }
  const onVis = () => { if (document.visibilityState === 'hidden') S.pause(); else if (handsfree && S.running) askWake(); };
  document.addEventListener('visibilitychange', onVis);
  onLeave(() => { S.end(); releaseWake(); clearTimeout(armed); document.removeEventListener('visibilitychange', onVis); document.body.classList.remove('hf-on'); });
  const startNow = () => { if (handsfree) { document.body.classList.add('hf-on'); askWake(); } S.start(); };
  // opened from the address (a reload, a restored tab): sound and speech need a tap first, so one large Begin waits for it
  if (wait) { const controls = $('.ss-controls', screen); controls.hidden = true;
    const begin = h('button', {class: 'btn acc ss-begin', id: 'ss-begin', on: {click: () => { audio(); begin.remove(); controls.hidden = false; startNow(); }}}, 'Begin');
    controls.after(begin); if (S.step) draw(S); }
  else startNow();
  return S;
}

/* ---- p_today.js ---- */
/* ================================================================ Today: home
   The breathing ring is the button that starts today's session; Hands-free runs it with the phone in a pocket. Underneath,
   the session's five stages tick as you go, your range sits beside them, and the other places are a tap away. */
const TODAY_GROUPS = [
  ['Body & breath', ['farinelli', 'hiss', 'pulse', 'neck', 'jaw', 'stretch', 'wince', 'vvv']],
  ['Trills & sirens', ['hum', 'trill5', 'tongue', 'straw', 'siren', 'ng']],
  ['Onsets', ['five', 'gee', 'mum', 'stacc', 'desc5', 'hey', 'vowel5']],
  ['Across the break', ['triad', 'arp8', 'nine', 'leaps', 'minor', 'penta', 'messa']],
  ['Cool down', ['yawn', 'cooldown']],
];
ICON.headphones = svgI('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>');

page('today', {name: 'Today', short: 'Today', icon: 'today', draw(v, arg) {
  if (typeof arg === 'string' && arg.startsWith('session:')) { sessionScreen(v, arg.slice(8), {wait: fromAddress}); return; }
  if (arg === 'handsfree') { sessionScreen(v, 'daily', {handsfree: true, wait: fromAddress}); return; }
  const R = savedRange(), daily = PLAN_OF('daily'), done = doneToday();

  // the ring: tap to begin
  const ring = breathRing(); ring.el.classList.add('idle'); ring.count.textContent = ''; ring.label.textContent = '';
  const begin = h('button', {class: 'today-begin', id: 'today-begin', on: {click: () => go('today', 'session:daily')}},
    ring.el, h('span', {class: 'tb-word'}, 'Breathe in, begin'), h('span', {class: 'tb-sub'}, `${daily.name} · ${Math.floor(daily.total / 60)} minutes`));
  const hf = h('button', {class: 'btn ghost today-hf', id: 'today-hf', on: {click: () => go('today', 'handsfree')}}, h('span', {html: ICON.headphones}), 'Hands-free');
  const others = h('div', {class: 'row today-plans'}, D.sessions.filter(p => p.id !== 'daily').map(p =>
    h('button', {class: 'chip', on: {click: () => go('today', 'session:' + p.id)}}, `${p.name} · ${Math.floor(p.total / 60)} min`)));

  // the five stages of the daily session, ticked when all their steps are done today
  const ids = daily.steps.map(s => s.id);
  const ladder = h('ol', {class: 'ladder5'}, TODAY_GROUPS.map(([label, group]) => { const mine = ids.filter(id => group.includes(id)), ok = mine.length && mine.every(id => done[id]);
    return h('li', {class: ok ? 'done' : ''}, h('b', {}, label), h('span', {}, mine.map(id => (D.coach[id] || {}).cue || id).join(' · '))); }));

  // your range, and where today's exercises sit in it
  const rangeCard = h('div', {class: 'card today-range'});
  if (R) { const a = warmStart(EXMAP.arp8, R);
    rangeCard.append(h('div', {class: 'k'}, 'Your range'), h('div', {class: 'tr-col', html: rangeColumn({range: R, brk: myBreak(), zone: [a.start, a.start + a.climb + 12], lo: R[0] - 4, hi: R[1] + 4})}),
      h('p', {}, `${midiName(R[0])} to ${midiName(R[1])}. The shaded band is today’s work.`)); }
  else rangeCard.append(h('div', {class: 'k'}, 'Your range'), h('p', {}, 'Find your range once and every exercise starts in the right place. Until then the book uses a middle range.'),
    h('button', {class: 'btn acc', id: 'today-findrange', on: {click: () => go('ear', 'range')}}, 'Find your range'));

  // the other places, and your last recording
  const last = h('div', {class: 'card today-card'}, h('div', {class: 'k'}, 'Last recording'), h('p', {class: 'muted'}, 'None yet. Record a take on any exercise card.'));
  Takes.list().then(l => { const t = l[0]; if (!t || !document.contains(last)) return; const au = new Audio(Takes.url(t));
    last.replaceChildren(h('div', {class: 'k'}, 'Last recording'), h('p', {}, `${t.label} · ${t.secs.toFixed(1)} s`), h('button', {class: 'btn ghost', on: {click: () => { au.currentTime = 0; au.play().catch(() => {}); }}}, 'Play it'));
    onLeave(() => au.pause()); });
  const cards = h('div', {class: 'today-cards'},
    h('button', {class: 'card today-card', on: {click: () => go('warm')}}, h('div', {class: 'k'}, 'Warm Up'), h('p', {}, 'Learn an exercise: hear it, read how, try it.')),
    h('button', {class: 'card today-card', on: {click: () => go('ear')}}, h('div', {class: 'k'}, 'Ear & Pitch'), h('p', {}, 'Match a note, sing an interval, the solfège ladder.')),
    h('button', {class: 'card today-card', on: {click: () => go('together')}}, h('div', {class: 'k'}, 'Sing Together'), h('p', {}, 'Sing a harmony while the book sings the tune.')),
    last);

  v.append(h('div', {class: 'today'},
    h('div', {class: 'today-hero'}, begin, hf, others),
    h('div', {class: 'card today-ladder'}, h('div', {class: 'k'}, 'Today’s session'), ladder),
    rangeCard, cards));
}});

start();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
