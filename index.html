    pick('Rungs', LADDER_SETS.map(s => [s[0], s[1]]), st.set, x => { st.set = x; sv(); go('ear', 'ladder'); })));
  // on Free, what the detectors hear, in numbers: the thresholds are first estimates, tuned by singing at this
  const techEl = st.mode === 'free' ? h('p', {class: 'ro-tech', id: 'ear-tech'}, '') : null;
  if (techEl) side.append(techEl);
  side.append(h('p', {class: 'guide'}, EAR_GUIDE[st.mode]));
  v.append(h('div', {class: 'ear' + (st.mode === 'ladder' ? ' with-ladder' : '')}, stage, side));

  // the lane goes in once the stage is in the page, so it can measure itself
  if (st.mode !== 'ladder') {
    const tg = target(), both = st.mode === 'interval' ? [root(), tg] : [tg];
    const win = st.mode === 'range' ? [40, 84] : st.mode === 'free' ? (R ? [R[0] - 3, R[1] + 3] : [45, 77]) : [Math.min(...both) - 6, Math.max(...both) + 6];
    L = lane(stage, {lo: win[0], hi: win[1], brk}); onLeave(() => L.destroy());
    if (tg != null) L.setTargets([{m: tg, at: -1e4, dur: 1e9}]);
  }

  // listening
  let last = performance.now();
  const onFrame = fr => {
    const now = performance.now(), dt = Math.min(.2, (now - last) / 1000); last = now;
    if (L) L.push(fr.midi);
    if (techEl) techEl.textContent = `hears: ${fr.tech} · high/low ${fr.hf != null ? fr.hf.toFixed(2) : '–'} · flutter ${fr.mod && fr.mod.hz ? fr.mod.hz.toFixed(1) + ' Hz, ' + fr.mod.depth.toFixed(2) : '–'}`;
    if (fr.midi == null) { finder.feed(null); judge.feed(null, target(), dt); rungBtns.forEach(b => b && b.classList.remove('lit')); return; }
    const m = fr.midi, tg = target(); noteEl.textContent = midiName(Math.round(m));
    if (tg != null) { const r = judge.feed(m, tg, dt); centsEl.textContent = centsWords(m, tg);
      if (r.done) heldEl.textContent = 'Matched. Held two seconds.';
      else if (!/^Matched/.test(heldEl.textContent)) heldEl.textContent = r.near ? `On ${midiName(tg)} · ${r.held.toFixed(1)} s` : ''; }
    else if (st.mode === 'range') { const g = finder.feed(m); if (g) drawRange(g.lo, g.hi); centsEl.textContent = ''; }
    else if (st.mode === 'ladder') { const i = ladderHit(m, rungs); rungBtns.forEach((b, j) => b && b.classList.toggle('lit', j === i)); centsEl.textContent = i >= 0 ? SOL[i % 7] : ''; }
    else centsEl.textContent = `${Math.round((m - Math.round(m)) * 100)} cents`;
  };
  listen.addEventListener('click', async () => {
    if (Mic.ok) { Mic.stop(); listen.textContent = 'Listen'; return; }
    msg.textContent = ''; const ok = await Mic.open();
    if (!ok) { msg.textContent = micMessage(Mic.state); return; }
    listen.textContent = 'Stop'; last = performance.now(); Mic.onFrame(onFrame);
  });
  if (Mic.ok) { listen.textContent = 'Stop'; Mic.onFrame(onFrame); }   // a choice redrew the place while the mic stayed open
}});

/* ---- p_warm.js ---- */
/* ================================================================ Warm Up: the vocalises by goal, breath work, the guided sessions, the Mirror
   Every vocalise opens on its How-to card beside the pitch lane, starting from the saved range. The grit set (Distortion)
   lives on the Course's Advanced shelf, not here. */
const WARM_TABS = [['vocalises', 'Vocalises'], ['breath', 'Breath'], ['sessions', 'Sessions'], ['mirror', 'The Mirror']];
const WARM_CATS = ['Warm-up', 'Tone', 'Range', 'Agility', 'Ear', 'Cool-down'];
const MID_RANGE = [52, 72];

// where an exercise starts and how far it climbs in your range: from just above your lowest notes, its top note
// two half steps under your highest (a narrow range gives up the climb before it gives up the bottom)
function warmStart(ex, range) {
  const [lo, hi] = range || MID_RANGE, span = Math.max(...ex.semis), roof = hi - 2;
  let start = Math.max(lo, Math.min(lo + 3, roof - span));
  if (start + span > hi) start = Math.max(lo, hi - span);
  const climb = Math.max(0, Math.min(ex.climb, roof - span - start));
  return {start, climb};
}

/* ---------------------------------------------------------------- the breathing ring (Today and Hands-free use it too) */
function breathRing() {
  const count = h('div', {class: 'bring-n', id: 'br-count'}, '–'), label = h('div', {class: 'bring-l', id: 'br-label'}, '');
  const el = h('div', {class: 'bring'}, h('div', {class: 'bring-c'}), h('div', {class: 'bring-t'}, count, label));
  return {el, count, label};
}
// runs a breath exercise's phases on a ring: the first phase fills it, a hold keeps it, the rest let it go
function runBreath(br, ring, onDone = () => {}) {
  let round = 0, pi = 0, left = br.phases[0][1], timer = 0, stopped = false;
  const shape = () => { const [name, secs] = br.phases[pi], hold = /hold/i.test(name), grow = pi === 0;
    ring.el.style.setProperty('--dur', secs + 's'); if (!hold) ring.el.classList.toggle('full', grow);
    ring.label.textContent = `${name} · round ${round + 1} of ${br.rounds}`; };
  const tick = () => {
    if (stopped) return;
    if (left <= 0) { pi++; if (pi >= br.phases.length) { pi = 0; round++; }
      if (round >= br.rounds) { stop(); ring.count.textContent = '✓'; ring.label.textContent = 'Done. Breathe normally.'; onDone(); return; }
      left = br.phases[pi][1]; shape(); try { click(A.ctx.currentTime + .01, true); } catch (e) {} }
    ring.count.textContent = String(left); left--;
  };
  function stop() { stopped = true; clearInterval(timer); ring.el.classList.remove('run', 'full'); }
  audio(); ring.el.classList.add('run'); shape(); tick(); timer = setInterval(tick, 1000);
  return stop;
}

/* ---- songedit.js ---- */
/* ================================================================ your own songs: tap a melody in, the book suggests the chords and writes the harmony
   A song of yours is kept on the device (IndexedDB vm2-songs) as notes (scale degrees in its key, lengths in beats), each with an id
   that stays with it, so a harmony note you changed (a pin) follows its melody note when notes are added or taken away. Chords are the
   book's suggestion bar by bar unless you chose one. songPiece() turns a song into a piece like the shelf's, for the duet and the writer. */

const MySongs = (() => {
  let dbp = null;                                   // one connection for the session; a failure lets the next call try again
  const db = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open('vm2-songs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('songs', {keyPath: 'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }).catch(e => { dbp = null; throw e; }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('songs', mode), out = fn(t.objectStore('songs'));
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); }); };
  return {
    async list() { try { return ((await tx('readonly', s => s.getAll())) || []).sort((a, b) => (a.made || 0) - (b.made || 0)); } catch (e) { return []; } },
    async get(id) { try { return (await tx('readonly', s => s.get(id))) || null; } catch (e) { return null; } },
    async save(song) { try { await tx('readwrite', s => s.put(JSON.parse(JSON.stringify(song)))); return true; } catch (e) { return false; } },
    async remove(id) { try { await tx('readwrite', s => s.delete(id)); } catch (e) {} },
  };
})();
// the shelf's copy, so drawing a page never waits on the database
let mySongs = [], mySongsLoaded = false;
MySongs.list().then(list => { mySongs = list; mySongsLoaded = true; if (typeof current !== 'undefined' && (current === 'together' || current === 'songs')) redraw(); });
const keepMySong = s => { const i = mySongs.findIndex(x => x.id === s.id); if (i < 0) mySongs.push(s); else mySongs[i] = s;
  return MySongs.save(s).then(ok => { if (!ok) toast('Your song could not be saved on this device. It stays open until you leave.'); return ok; }); };

const newId = p => p + Math.random().toString(36).slice(2, 9);
const newSong = () => ({id: newId('mine-'), kind: 'mine', title: 'My song', key: 'C', mode: 'major', meter: [4, 4], bpm: 84,
  notes: [], noteIds: [], pins: {}, barChords: {}, words: '', made: Date.now(), checked: false});

// editing the melody: every change keeps notes and noteIds side by side; a deleted note takes its pin with it
function seAdd(s, deg, beats) { s.notes.push([deg, beats]); s.noteIds.push(newId('n')); }
function seInsert(s, i, deg, beats) { s.notes.splice(i, 0, [deg, beats]); s.noteIds.splice(i, 0, newId('n')); }
function seDelete(s, i) { const id = s.noteIds[i]; s.notes.splice(i, 1); s.noteIds.splice(i, 1); delete s.pins[id]; }
// move note i's harmony a scale step up (1) or down (-1) from what it is now, and keep it there
function sePin(s, i, step) { const cur = harmonize(songPiece(s), 'auto')[i]; if (!cur) return; s.pins[s.noteIds[i]] = [cur[0] + step, 0]; }

// words over the notes: split on spaces and hyphens; notes past the last syllable hold it ('_')
function spreadWords(text, n) {
  const syl = String(text || '').split(/[\s-]+/).filter(Boolean);
  return Array.from({length: n}, (_, i) => i < syl.length ? syl[i] : '_');
}

// the chords per bar: the menu chord holding the most strong-beat melody notes (ties: I, V, IV, vi, then the menu's order);
// a bar whose strong notes no one chord holds splits in half when each half wants a different chord. -> [[roman, beats, pcs], ...] per bar
function barChords(piece) {
  const notes = piece.notes || [], n = (piece.meter || [4, 4])[0];
  if (!notes.some(x => x[0] != null)) return [];
  const M = metric({...piece, chords: []}), menu = D.chordMenu[piece.mode] || D.chordMenu.major;
  const pref = piece.mode === 'minor' ? ['i', 'V', 'iv', 'VI'] : ['I', 'V', 'IV', 'vi'];
  const rank = c => { const k = pref.indexOf(c.roman); return k < 0 ? pref.length + menu.indexOf(c) : k; };
  const best = pcs => menu.map(c => ({c, hit: pcs.filter(p => c.pcs.includes(p)).length})).sort((a, b) => b.hit - a.hit || rank(a.c) - rank(b.c))[0];
  const pcOf = i => pc12(degSemis(piece.mode, notes[i][0], notes[i][3] || 0));
  const total = M[M.length - 1].start + notes[notes.length - 1][1], bars = Math.ceil(total / n - 1e-9);
  const out = []; let last = menu.find(c => c.roman === pref[0]) || menu[0];
  for (let b = 0; b < bars; b++) {
    const strong = M.map((m, i) => i).filter(i => M[i].bar === b && notes[i][0] != null && M[i].strong);
    if (!strong.length) { out.push([[last.roman, n, last.pcs]]); continue; }   // a bar of rests keeps the chord before it
    const all = best(strong.map(pcOf));
    if (n % 2 === 0 && all.hit < strong.length) {
      const A = strong.filter(i => M[i].pos < n / 2), B = strong.filter(i => M[i].pos >= n / 2);
      if (A.length && B.length) { const a = best(A.map(pcOf)).c, z = best(B.map(pcOf)).c;
        if (a !== z) { out.push([[a.roman, n / 2, a.pcs], [z.roman, n / 2, z.pcs]]); last = z; continue; } }
    }
    out.push([[all.c.roman, n, all.c.pcs]]); last = all.c;
  }
  return out;
}
const suggestChords = piece => barChords(piece).flat();

// a song of yours as a piece: words spread over the sung notes, pins by note index, chords (yours where you chose, the book's elsewhere), phrases of two bars
function songPiece(s) {
  const sung = s.notes.filter(n => n[0] != null).length, syl = s.words && s.words.trim() ? spreadWords(s.words, sung) : null;
  let k = 0;
  const notes = s.notes.map(n => n[0] == null ? [null, n[1]] : (syl || n[3]) ? [n[0], n[1], syl ? syl[k++] : '', n[3] || 0] : [n[0], n[1]]);
  const base = {...s, pickup: 0, notes, phrases: [0]};
  const pins = {}; s.noteIds.forEach((id, i) => { if (s.pins && s.pins[id]) pins[i] = s.pins[id]; });
  const menu = D.chordMenu[s.mode] || D.chordMenu.major, n = s.meter[0];
  const chords = barChords(base).flatMap((segs, b) => { const r = s.barChords && s.barChords[b], c = r && menu.find(x => x.roman === r);
    return c ? [[c.roman, n, c.pcs]] : segs; });
  const M = metric(base), per = n === 3 || n === 2 ? 4 : 2, phrases = [];
  M.forEach((m, i) => { if (!phrases.length || m.bar >= M[phrases[phrases.length - 1]].bar + per) phrases.push(i); });
  return {...base, pins, chords, phrases: phrases.length ? phrases : [0]};
}

// a sung line as notes: frames [{t (s from beat 1), midi}] -> [[degree | null, beats, '', alter]].
// A note is a run of frames near one pitch held 0.15 s or more (shorter runs are blips and go); a breath shorter than that between two runs
// of the same note joins them. The pitch snaps to the key's nearest scale note (a half step away from both: the sharp or flat between),
// the starts and ends to the nearest eighth at the tempo; a gap of an eighth or more is a rest. The line is moved by octaves to sit near do.
function transcribe(frames, {key, mode, bpm, meter}) {
  const S = D.modeSemis[mode] || D.modeSemis.major, T = tonicMidi(key), eighth = (meter && meter[1] === 8 ? 60 : 30) / bpm, MIN = .15, eb = meter && meter[1] === 8 ? 1 : .5;
  const med = a => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
  const runs = []; let cur = null;
  for (const f of frames) {
    if (f.midi == null || (cur && Math.abs(f.midi - med(cur.ms)) >= .7)) { if (cur) runs.push(cur); cur = null; }
    if (f.midi != null) { if (!cur) cur = {t0: f.t, ms: []}; cur.ms.push(f.midi); cur.t1 = f.t + 1 / 60; }
  }
  if (cur) runs.push(cur);
  const snap = m => { const x = m - T; let best = null;
    for (let o = -3; o <= 3; o++) S.forEach((st, d) => { const dist = Math.abs(x - (st + 12 * o)); if (!best || dist < best.dist) best = {deg: d + 7 * o, dist, semis: st + 12 * o}; });
    if (best.dist < .5) return [best.deg, 0];
    return [best.deg, Math.round(x) - best.semis]; };   // between two scale notes: the nearer one, sharpened or flattened
  const same = (a, b) => a && b && a.p[0] === b.p[0] && a.p[1] === b.p[1], short = r => r.t1 - r.t0 < MIN;
  const snapped = runs.map(r => ({...r, p: snap(med(r.ms))}));
  // a blip is a short run unlike the runs either side of it; a short scrap of the note before or after it stays, to be joined back
  // (shortest first, so a scrap split off by a blip sees its other half once the blip is gone)
  const kept = snapped.slice();
  for (;;) { let k = -1;
    kept.forEach((r, i) => { if (short(r) && !same(r, kept[i - 1]) && !same(r, kept[i + 1]) && (k < 0 || r.t1 - r.t0 < kept[k].t1 - kept[k].t0)) k = i; });
    if (k < 0) break; kept.splice(k, 1); }
  const notes = [];
  for (const r of kept) { const last = notes[notes.length - 1];
    if (same(last, r) && r.t0 - last.t1 < MIN) { last.t1 = r.t1; continue; }
    notes.push({...r}); }
  for (let i = notes.length - 1; i >= 0; i--) if (short(notes[i])) notes.splice(i, 1);
  if (!notes.length) return [];
  const mean = notes.reduce((a, n) => a + n.p[0], 0) / notes.length, shift = 7 * Math.round((3 - mean) / 7);
  const out = []; let at = 0;
  for (const n of notes) {
    let a = Math.max(0, Math.round(n.t0 / eighth)), b = Math.round(n.t1 / eighth);
    if (a < at) a = at;
    if (a > at) out.push([null, (a - at) * eb, '', 0]);
    b = Math.max(b, a + 1); out.push([n.p[0] + shift, (b - a) * eb, '', n.p[1]]); at = b;
  }
  return out;
}

/* ---------------------------------------------------------------- the editor: #together/edit:<id> */
const SE_LENGTHS = [[.5, 'Eighth'], [1, 'Quarter'], [1.5, 'Dotted quarter'], [2, 'Half'], [3, 'Dotted half'], [4, 'Whole']];   // in quarter notes
const SE_METERS = [['4,4', '4/4'], ['3,4', '3/4'], ['6,8', '6/8'], ['2,4', '2/4']];
const eighthOf = s => (s.meter[1] === 8 ? 60 : 30) / s.bpm;   // the tempo counts the meter's beat (an eighth in 6/8), as Sing Together plays it
const SE_LADDER = [9, 8, 7, 6, 5, 4, 3, 2, 1, 0, -1, -2, -3];      // scale degrees, high to low: mi above to sol below
let seEdit = null, seLen = 1, seSel = null, seHSel = null, seSure = false, seRec = null;

function drawSongEditor(v, id) {

  }

  const changed = (draw = true) => { if (s.notes.length || mySongs.some(x => x.id === s.id)) keepMySong(JSON.parse(JSON.stringify(s))); if (draw) redraw(); };

      h('button', {class: 'btn ghost small', id: 'se-rest', on: {click: () => { if (seSel != null && s.notes[seSel]) s.notes[seSel] = [null, seLen * unit]; else seAdd(s, null, seLen * unit); changed(); }}}, seSel != null ? 'Make it a rest' : 'Add a rest'),

  const BX = 48, ROW = 24, lo = Math.min(-3, ...s.notes.filter(n => n[0] != null).map(n => n[0])), hi = Math.max(9, ...s.notes.filter(n => n[0] != null).map(n => n[0]));
  const total = M.length ? M[M.length - 1].start + P.notes[P.notes.length - 1][1] : 0, bars = Math.max(1, Math.ceil(total / s.meter[0] - 1e-9));

        on: {click: () => { seHSel = seHSel === i ? null : i; seSel = null; redraw(); }}}, degName(s.key, s.mode, hx[0], hx[1]))); }
  });
  inner.append(h('span', {class: 'se-roll-k', style: `top:${melH + 4}px`}, 'Harmony'));
  roll.append(inner);
  const hTools = seHSel != null && H[seHSel] ? h('div', {class: 'row se-htools'},
    h('span', {class: 'muted'}, 'This harmony note:'),
    h('button', {class: 'btn ghost small', id: 'se-hup', on: {click: () => { sePin(s, seHSel, 1); changed(); }}}, 'A step higher'),
    h('button', {class: 'btn ghost small', id: 'se-hdown', on: {click: () => { sePin(s, seHSel, -1); changed(); }}}, 'A step lower'),
    s.pins[s.noteIds[seHSel]] ? h('button', {class: 'btn ghost small', id: 'se-hfree', on: {click: () => { delete s.pins[s.noteIds[seHSel]]; changed(); }}}, 'Let the book choose') : null,
    s.pins[s.noteIds[seHSel]] && M[seHSel].strong && !chordAt(seHSel).includes(pc12(degSemis(s.mode, H[seHSel][0], H[seHSel][1])))

  v.append(h('div', {class: 'card se-melody'}, h('div', {class: 'se-grid'}, ladder, h('div', {class: 'se-right'}, tools, roll, hTools))));

  // words
  const sung = s.notes.filter(n => n[0] != null).length;
  const wordsLine = () => { const nSyl = String(s.words || '').split(/[\s-]+/).filter(Boolean).length;
    return !nSyl ? 'Optional. The words show under the notes in Sing Together.'
      : nSyl > sung ? `${nSyl - sung} syllable${nSyl - sung > 1 ? 's have' : ' has'} no note yet.` : `${nSyl} syllables on ${sung} notes; the last syllable holds over the rest.`; };
  const wordsSay = h('p', {class: 'muted'}, wordsLine());
  v.append(h('section', {class: 'card se-words-card'}, h('h2', {}, 'Words'),
    h('input', {id: 'se-words', class: 'se-input se-words', value: s.words || '', placeholder: 'Type the words; a hyphen splits a word over two notes (ma-zing)',
      on: {input: e => { s.words = e.target.value; wordsSay.textContent = wordsLine(); changed(false); }}}),
    wordsSay));

  // done, duplicate, delete
  v.append(h('div', {class: 'row se-end'},
    h('button', {class: 'btn acc', id: 'se-done', on: {click: async () => { await keepMySong(JSON.parse(JSON.stringify(s)));

      await keepMySong(c); seEdit = null; go('together', 'edit:' + c.id); }}}, 'Duplicate'),
    h('button', {class: 'btn ghost' + (seSure ? ' warn' : ''), id: 'se-delete-song', on: {click: async () => {
      if (!seSure) { seSure = true; redraw(); return; }
      mySongs = mySongs.filter(x => x.id !== s.id); await MySongs.remove(s.id); seEdit = null; seSure = false;
      const st = state('together', {}); if (st.piece === s.id) keep('together', {...st, piece: 'line-demo'}); go('together'); }}}, seSure ? 'Tap again to delete it' : 'Delete this song')));

  // play: the melody, the harmony and the chords, once
  offer({label: `${s.title} · melody and harmony`, play: (bpm, onStop) => {
    if (!P.notes.some(n => n[0] != null)) { onStop(); return; }

/* ================================================================ Sing Together: you sing one part, the book sings the other
   A piece from the shelf (D.pieces: practice lines and songs) with the harmony writer's second part (harm.js), both on the lane:
   your part in rose and graded, the other part faint. The key is picked so your part sits inside your range. Underneath, the old
   Harmony page's teaching as cards: the harmonised scale, the four motions, three voices, safe notes, the method, blend. */
const TG_KINDS = [['auto', 'Auto'], ['above3', 'A third above'], ['below3', 'A third below'], ['above6', 'A sixth above']];
const TG_OFF = {above3: 2, below3: -2, above6: 5};           // the harmonised-scale rows as diatonic steps from the melody
const HALF_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const pieceById = id => { const mine = typeof mySongs !== 'undefined' && mySongs.find(s => s.id === id);   // your own songs read as pieces
  return mine ? songPiece(mine) : D.pieces.find(p => p.id === id) || D.pieces.find(p => p.id === 'line-demo'); };
const hasWords = piece => piece.notes.some(n => n[0] != null && n[2] && n[2] !== '_');
// the words under the notes: verse 1 is the notes' own syllables; a later verse puts its syllables on the sung notes in order
function wordsOf(piece, verse) {
  if (!hasWords(piece)) return null;
  const V = verse > 0 && piece.verses && piece.verses[verse - 1]; let k = 0;
  return piece.notes.map(n => n[0] == null ? '' : V ? (V[k++] || '') : (n[2] || ''));
}
// a choice of verse, when a song has more than one
const tgVerse = (piece, st, set) => piece.verses && piece.verses.length
  ? h('div', {class: 'toolbar', id: 'tg-verse'}, seg('Verse', [0, ...piece.verses.map((_, i) => i + 1)].map(i => [i, String(i + 1)]), st.verse || 0, x => set('verse', +x))) : null;

// in one key, the octave that leaves these notes (semitones above the tonic) the most room inside the range (room < 0: they do not fit)
function fitShift(semis, key, range) {
  const [lo, hi] = range || MID_RANGE;
  return [-24, -12, 0, 12].map(shift => { const ms = semis.map(s => tonicMidi(key) + s + shift);
    return {key, shift, room: Math.min(Math.min(...ms) - lo, hi - Math.max(...ms))}; }).reduce((a, b) => b.room > a.room ? b : a);
}
// the key (and octave) with the most room at the tighter end; ties go to the earlier key
function fitKey(semis, range, mode = 'major') {
  const best = keyNames(mode).map(k => fitShift(semis, k, range)).reduce((a, b) => b.room > a.room ? b : a);
  return {key: best.key, shift: best.shift};
}
// one part of a piece as semitones above the tonic, rests dropped: 'mel' or 'harm' (the harmony writer's, of this kind)
function partSemis(piece, kind, you) {
  const src = you === 'mel' ? piece.notes.map(n => n[0] == null ? null : [n[0], n[3] || 0]) : harmonize(piece, kind);
  return src.filter(x => x && x[0] != null).map(x => degSemis(piece.mode, x[0], x[1]));
}
// both parts as midi (null on a rest), and each note's length
function partsOf(piece, kind, key, shift) {
  const H = harmonize(piece, kind), at = x => x == null || x[0] == null ? null : tonicMidi(key) + degSemis(piece.mode, x[0], x[1] || 0) + shift;
  return {mel: piece.notes.map(n => at(n[0] == null ? null : [n[0], n[3] || 0])), harm: H.map(at), beats: piece.notes.map(n => n[1]), H};
}

page('together', {name: 'Sing Together', short: 'Together', icon: 'together', draw(v, arg) {
  if (arg && String(arg).startsWith('edit:')) return drawSongEditor(v, String(arg).slice(5));

  if (!TG_KINDS.some(k => k[0] === st.kind)) st.kind = 'auto';
  const set = (k, x) => { st[k] = x; if (k === 'piece') { st.key = 'auto'; st.phrase = 0; st.verse = 0; setBpm(pieceById(x).bpm); } keep('together', st); go('together'); };   // a new piece starts at its own tempo
  const piece = pieceById(st.piece), mode = piece.mode, R = savedRange();

    v.append(h('h1', {class: 'ph'}, 'Sing Together'), h('div', {class: 'toolbar tg-parts'}, pick('Sing', tgShelf(), piece.id, x => set('piece', x), 'tg-piece')),

    return; }

  const P = partsOf(piece, st.kind, key, shift), mine = st.you === 'mel' ? P.mel : P.harm, other = st.you === 'mel' ? P.harm : P.mel;
  const kindName = TG_KINDS.find(k => k[0] === st.kind)[1].toLowerCase();
  const partName = st.you === 'mel' ? 'the melody' : st.kind === 'auto' ? 'the harmony' : kindName;
  const where = `${key} ${mode}`;

  v.append(h('h1', {class: 'ph'}, 'Sing Together'),

  v.append(tgMine(piece)); { const vs = tgVerse(piece, st, set); if (vs) v.append(vs); }

  // the lane, sized to both parts, and the mic
  const all = [...P.mel, ...P.harm].filter(m => m != null), laneBox = h('div', {class: 'card tg-lane'});
  const fits = fitShift(mySemis, key, R).room >= 0;
  const msg = h('p', {class: 'tg-says'}, !R ? `In ${where}, set for a middle range. Find yours in Ear & Pitch and the key follows it.`
    : fits ? `In ${where}, set so your part sits in your range.` : `In ${where}. Your part runs past your range here: sing the notes outside it an octave nearer, or try another key.`);
  let unsub = null;
  const listen = h('button', {class: 'btn acc', id: 'tg-listen', on: {click: async () => {
    if (unsub) { unsub(); unsub = null; if (!Mic.recording) Mic.stop(); listen.textContent = 'Listen'; return; }   // a take in progress keeps the mic
    if (!(Mic.ok || await Mic.open())) { msg.textContent = micMessage(Mic.state); return; }
    unsub = Mic.onFrame(fr => L && L.push(fr.midi)); listen.textContent = 'Stop listening'; msg.textContent = 'Listening. Your line shows on the lane: sage on your note, amber off it.'; }}}, 'Listen');
  if (Mic.ok) { unsub = Mic.onFrame(fr => L && L.push(fr.midi)); listen.textContent = 'Stop listening'; }   // a choice inside the place keeps listening
  const rec = h('button', {class: 'btn', id: 'tg-rec', on: {click: async () => {

/* ---------------------------------------------------------------- Duet: two singers at one screen, the book as the guide (no mic, no grading) */

const tgShelf = () => [{group: 'Practice lines', items: D.pieces.filter(p => p.kind === 'line').map(p => [p.id, p.title])},

function drawDuet(v, st, piece, set) {
  if (Mic.ok) Mic.stop();

  const parts = [{steps: partSemis(piece, st.kind, 'mel'), range: melS.range}, {steps: partSemis(piece, st.kind, 'harm'), range: harmS.range}];

  const kindName = st.kind === 'auto' ? 'harmony' : TG_KINDS.find(k => k[0] === st.kind)[1].toLowerCase();
  const nPh = (piece.phrases || [0]).length, k = Math.max(0, Math.min(nPh - 1, st.phrase || 0));

  v.append(h('h1', {class: 'ph'}, 'Sing Together'),
    h('p', {class: 'lede'}, 'Two of you, one screen. The book plays the parts and lights the note you are on; each of you follows your own row.'),

  v.append(tgMine(piece)); { const vs = tgVerse(piece, st, set); if (vs) v.append(vs); }

  // who sings what, and the key in words

  const roomOf = (steps, sh, r) => { if (!steps.length) return 99; const ms = steps.map(x => tonicMidi(key) + x + sh), [lo, hi] = r || MID_RANGE; return Math.min(Math.min(...ms) - lo, hi - Math.max(...ms)); };
  const past = [[melS, parts[0].steps, shifts[0]], [harmS, parts[1].steps, shifts[1]]].filter(([who, steps, sh]) => roomOf(steps, sh, who.range) < 0).map(x => x[0]);

    h('div', {class: 'tg-who'}, h('b', {style: `color:${harmS.col}`}, harmS.name), ` · ${kindName}`),

  // what the book plays, the phrase, the loop

      h('button', {class: 'btn acc small', id: 'tg-full', on: {click: () => openFull()}}, 'Full screen')),

  const names = list => list.map(x => x && x[0] != null ? degName(key, mode, x[0], x[1] || 0) : '');
  const rows = [{name: melS.name, col: melS.col, midi: mel.mel, names: names(piece.notes.map(n => [n[0], n[3] || 0]))},

  const stage = duetStage(stageBox, {piece, rows, beats: mel.beats, words}); stage.phrase(k);
  let active = stage, curK = k;                                    // the stage being lit (the page's, or the full screen's) and the phrase to start from
  onLeave(() => stage.destroy());

  const moveTo = kk => { const was = dockPlaying; if (was) dockStop(); curK = Math.max(0, Math.min(nPh - 1, kk)); active.phrase(curK); st.phrase = curK; keep('together', st);
    if (was) { const b = $('#dock .dock-play'); if (b) b.click(); setTimeout(playLabel, 0); } };
  function openFull() {

    document.body.append(full); document.body.classList.add('hf-on'); askWake();

  // the book: a bar of clicks (a pickup comes in on its own beat), then the parts and the chords, from the chosen phrase
  const M2 = metric(piece), ph = piece.phrases || [0];
  const lineOf = {s1: melS === A ? rows[0].midi : rows[1].midi, s2: melS === B ? rows[0].midi : rows[1].midi};

  let tonic = tonicMidi(key) + Math.min(...shifts) - 12; while (tonic < 45) tonic += 12;   // never below A2, where a chord turns to mud

  const playName = playOpts.find(o => o[0] === play)[1].toLowerCase();

    const b = 60 / bpm, n = piece.meter[0], first = M2[from], lead = first.pos > 0 ? first.barLen - first.pos : 0;
    let runs = 0, restarting = false;
    const build = count => { const ev = [], t0 = (count ? n - lead : 1) * b, base = first.start; let chords = 0;
      if (count) for (let i = 0; i < n; i++) ev.push({at: i * b, fn: t => click(t, i === 0)});
      let lastChord = null;
      for (let i = from; i < to; i++) { const at = t0 + (M2[i].start - base) * b, d = piece.notes[i][1] * b, idx = i, ch = M2[i].chord;

          ui: () => { window.__tgLit = idx; active.lit(idx); }}); }

    window.__tgLines = lines.length;

  v.append(h('div', {class: 'tg-cards'}, tgCardsFor(piece, key)));

/* ================================================================ the Sketchpad (Songs & Keys): the Song Compass for a singer
   Your song on the left (sections of chord bars), the compass on the right with the microphone under it.
   Sing a line: the page hears the notes, names the key they fit, and finds the chords under the line.
   The thinking lives in pwa/src/compass/ (PitchEngine, KeyFinder, Suggest: copies of the guitar book's,
   whose Node tests cover them; spliced in after this file by build_book.py). The song is the guitar

const BOOK = {qualIv: D.qualIv, progs: D.progs, strums: [], finger: [], gallery: []};   // the slice of the data Suggest reads
const SECCOL = {Verse: 'var(--navy)', Chorus: 'var(--gold)', Bridge: 'var(--rust)'};

// the quality each degree carries in each mode: when the mode flips the song keeps its degrees and the qualities follow

function convert(t, fromMinor, toMinor) {
  const [d, acc, q] = t, from = DIATONIC[fromMinor ? 'minor' : 'major'], to = DIATONIC[toMinor ? 'minor' : 'major'];
  return acc === 0 && q === from[d] ? [d, 0, to[d]] : t;
}
// a fresh progression for a section, from the library, in the song's mode
function roll(minor) { const pool = D.progs.filter(p => p.minor === minor && p.toks.length <= 8); const p = pool[Math.floor(Math.random() * pool.length)]; return p.toks.map(t => t.slice()); }

const CP = {S: null, sel: -1, engine: null, heard: null, heardAt: 0, needle: 0, playing: null, takeBars: 4, take: null};
const cpSong = () => CP.S || (CP.S = store.get('song', null) || defaultSong());
const cpSave = () => store.set('song', CP.S);

const cpBars = () => cpSong().sections[cpSong().active] || (cpSong().sections[cpSong().active] = []);
const cpSame = (a, b) => a && b && a.root === b.root && a.quality === b.quality;
const cpChord = t => Suggest.chordOf(cpKey(), t);
const cpName = c => Suggest.describe(cpKey(), c).name;

// only speaks when it has something to say: the chords fit another key better than the one that's set

  if (all.length < 3) return null;

  all.forEach(c => { const iv = D.qualIv[c.quality] || D.qualIv['']; iv.forEach(x => kf.add({pitchClass: (c.root + x) % 12, midi: 48, durationMs: 1000 / iv.length})); });
  const r = kf.result();

    h('button', {class: 'btn small', on: {click: () => { cpSetKey(r.best.tonic, r.best.mode === 'minor', true); toast(`Now in ${r.best.label}: the same chords, read from a new home`); }}}, `Re-read in ${r.best.label}`));

// loop the section, or play the whole song in its form: a sung pad under a soft click, a bar a chord
function cpLoop(which) {
  if (CP.playing) { const was = CP.playing; Seq.stop(); if (was === which) return; }
  const S = cpSong(), order = which === 'song' ? S.form : [S.active], flat = [], where = [];
  order.forEach(sc => (S.sections[sc] || []).forEach((t, i) => { flat.push(cpChord(t)); where.push([sc, i]); }));
  if (!flat.length) { toast('Add some chords first'); return; }

  flat.forEach((c, i) => { const ms = cpChordMidi(c);
    ev.push({at: i * bar, fn: t => { ms.forEach(m => sing(m, t, bar * .96, {gain: .12, vib: false})); for (let b = 0; b < S.beats; b++) click(t + b * beat, b === 0); },
      ui: () => { const [sc, bi] = where[i]; if (sc !== S.active) { S.active = sc; cpRenderSong(); }
        document.querySelectorAll('.cp-bar[data-i]').forEach(el => el.classList.toggle('now', +el.dataset.i === bi)); }}); });

/* ---------------- the compass

      const home = chord.root === k.tonic && (k.mode === 'minor') === (ring === 'inn'), [tx, ty] = cpPolar((r0 + r1) / 2, i * 30);

        + `<text x="${tx}" y="${ty + 2}" text-anchor="middle" font-size="${ring === 'out' ? (d.name.length > 2 ? 17 : 20) : (d.name.length > 3 ? 13 : 15)}" fill="${inKey || isCur ? 'var(--ink)' : 'var(--mute)'}"${home ? ' text-decoration="underline"' : ''} style="font-family:var(--display)">${d.name}</text>`

    `<text x="220" y="206" text-anchor="middle" font-size="34" fill="var(--ink)" style="font-family:var(--display)">${cd ? cd.name : k.name}</text>`,
    `<text x="220" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink2)">${cd ? `${cd.roman} in ${k.name} ${k.mode}` : k.mode}</text>`,
    `<text x="220" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--mute)">also in the key: ${dim.name}</text>`);

/* ---------------- listening: a tuner-like readout of the note you're singing, and takes */
function cpRenderLive() {
  const heard = cpEl('cp-heard'); if (!heard) return;
  const on = CP.engine && CP.engine.state === 'listening';
  const lb = cpEl('cp-listen'); lb.classList.toggle('on', on); lb.textContent = on ? 'Stop' : 'Listen';
  if (!on) { heard.textContent = '–'; heard.classList.add('dim'); cpEl('cp-heardsub').textContent = 'not listening'; }
  else if (heard.textContent === '–') cpEl('cp-heardsub').textContent = 'listening';

// the live meter: loudness on a log scale (0.001 RMS at the left, 0.3 at the right), the gate as a mark,

function cpMeter(v) {

  const lv = r => Math.max(0, Math.min(1, (Math.log10(Math.max(r || 0, 1e-4)) + 3) / 2.5));
  cpEl('cp-lvl').style.width = `${lv(v.rms) * 100}%`;
  cpEl('cp-gate').style.left = v.gate ? `${lv(v.gate) * 100}%` : '0';
  m.classList.toggle('hot', !!v.gate && v.rms >= v.gate);
  const c = cpEl('cp-cents'), t = CP.take, k = cpKey();
  if (v.calibrating) { c.textContent = 'listening to the room…'; c.classList.remove('ok'); return; }
  const bar = t && t.bars ? (t.startAt ? `bar ${Math.min(t.bars, Math.floor((performance.now() - t.startAt) / t.barMs) + 1)} of ${t.bars} · ` : `sing to start the ${t.bars} bars · `) : '';
  if (v.note) {
    const cents = Math.round(v.note.cents); c.textContent = `${bar}${v.note.name}${v.note.octave} · ${cents === 0 ? 'right on' : Math.abs(cents) + ' cents ' + (cents > 0 ? 'sharp' : 'flat')}`; c.classList.toggle('ok', Math.abs(cents) <= 8);
    const hb = cpEl('cp-heard'); hb.textContent = v.note.name + v.note.octave; hb.classList.remove('dim');
    const sol = cpSolfege(v.note.pitchClass, k); cpEl('cp-heardsub').textContent = sol ? `${sol} · ${k.name} ${k.mode}` : `outside ${k.name} ${k.mode}`;

function cpMsg(html) { const m = cpEl('cp-msg'); if (m) m.innerHTML = html; cpChipsShown(true); }
/* a take: listen for a set number of bars (or until Stop) from the first note sung, keep the notes with their

function cpTakeTick(v) {
  const t = CP.take; if (!t) return; const now = performance.now();
  if (!t.startAt) { if (!v.calibrating && v.gate != null && v.rms >= v.gate) t.startAt = now; return; }   // the clock starts at the first sound
  if (t.bars && now - t.startAt >= t.bars * t.barMs) setTimeout(cpStopListen, 0);
}
function cpTakeAdd(e) { const t = CP.take; if (t && e.durationMs >= 120) t.notes.push({midi: e.midi, pc: e.pitchClass, at: e.startedAt, ms: e.durationMs}); }
// the chord under each bar: the key's triads scored by how much of the bar's singing they hold (the note on the

// win ties, the first bar leans home, the last bar home or the V, and a chord that stays is a little likelier

  const cands = Suggest.safe(k).slice(0, 7).filter(c => c.quality !== '°'), out = [];
  for (let b = 0; b < nb; b++) {

    const inBar = notes.map(n => ({pc: n.pc, w: Math.max(0, Math.min(hi, n.at + n.ms) - Math.max(lo, n.at)) / barMs, down: n.at < lo + barMs * .2 && n.at + n.ms > lo})).filter(n => n.w > .02);

  const r = kf.result(), found = r.state === 'listening' ? null : r.best;
  const S = cpSong(), k = found ? Suggest.keyOf(found.tonic, found.mode) : cpKey();

  const verdict = !found ? h('span', {}, 'Not enough to tell the key yet: sing a longer line.')
    : same ? h('span', {}, 'In ', h('b', {}, found.label), ', the key you\'re in.')
    : h('span', {}, r.state === 'confident' ? 'It fits ' : 'It leans to ', h('b', {}, found.label), other ? ` (or ${other.label}).` : '.');
  cpChipsShown(false);
  m.replaceChildren(h('div', {class: 'cp-take'},
    h('div', {class: 'heard'}, h('span', {class: 'lbl'}, `heard ${line.length} notes`), h('span', {class: 'line'}, line.map(n => KeyFinder.spell(n.pc, k)).join(' ')),
      h('button', {class: 'x', 'aria-label': 'dismiss', title: 'dismiss', on: {click: () => cpMsg('')}}, '×')),
    h('div', {class: 'key'}, verdict,
      found && !same ? h('button', {class: 'chip acc', on: {click: () => { cpSetKey(found.tonic, found.mode === 'minor', true); toast(`Now in ${found.label}`); }}}, `Use ${found.label}`) : ''),
    h('div', {class: 'under'}, h('span', {class: 'lbl'}, nb === 1 ? 'under it' : 'under it, a bar each'), ...chords.map(c => h('b', {}, Suggest.describe(k, c).name)),

// write the take's chords into the section, after the selected bar or at the end; 8 bars a section.

function cpTakeWrite(chords, newKey) {
  if (newKey) cpSetKey(newKey.tonic, newKey.mode === 'minor', true);
  const b = cpBars(), k = cpKey(); let at = CP.sel >= 0 ? CP.sel + 1 : b.length, n = 0;
  for (const c of chords) {
    const tok = Suggest.tokenOf(k, c);
    if (at < b.length && b.length >= 8) b[at] = tok; else if (b.length < 8) b.splice(at, 0, tok); else break;

/* ---- compass/key-finder.js ---- */
/* Song Compass — key finder (Phase 2).
   Pure music logic: no audio, no DOM. It reads the note events PitchEngine produces and answers
   "what key is this in, and how sure are we?". One global, KeyFinder, like PitchEngine.

   The method is Krumhansl–Schmuckler key finding:
     1. Add up how long each of the 12 pitch classes sounded (C, C♯ ... B, octave ignored).
        That 12-number list is the song's "pitch profile".
     2. Every key has a typical profile too: in C major, C, G and E sound most, the other white keys
        less, the black keys hardly at all. These "key profiles" come from listening experiments
        and from counting notes in thousands of real pieces.
     3. Compare the song's profile with all 24 key profiles (12 major + 12 minor) using correlation:
        +1 means "rises and falls in exactly the same places", 0 means unrelated. The best match wins.
   The gap between the winner and the runner-up says how sure we are. */
const KeyFinder = (() => {
  'use strict';

  /* Key profiles, index 0 = the tonic, then up a semitone at a time.
     Several published sets exist; test-keys.js scores them all and the default is the winner. */
  const PROFILES = {
    // Krumhansl & Kessler (1982): listeners rated how well each note "fit" after a key was set up
    krumhansl: {major: [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],
                minor: [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17]},
    // Temperley (2007): note counts from the Kostka–Payne harmony textbook excerpts
    temperley: {major: [0.748, 0.060, 0.488, 0.082, 0.670, 0.460, 0.096, 0.715, 0.104, 0.366, 0.057, 0.400],
                minor: [0.712, 0.084, 0.474, 0.618, 0.049, 0.460, 0.105, 0.747, 0.404, 0.067, 0.133, 0.330]},
    // Aarden (2003): note counts from the Essen folk-song collection (melodies, like ours)
    aarden: {major: [17.7661, 0.145624, 14.9265, 0.160186, 19.8049, 11.3587, 0.291248, 22.062, 0.145624, 8.15494, 0.232998, 4.95122],
             minor: [18.2648, 0.737619, 14.0499, 16.8599, 0.702494, 14.4362, 0.702494, 18.6161, 4.56621, 1.93186, 7.37619, 1.75623]},
    // Albrecht & Shanahan (2013): note durations in a corpus of common-practice pieces
    albrecht: {major: [0.238, 0.006, 0.111, 0.006, 0.137, 0.094, 0.016, 0.214, 0.009, 0.080, 0.008, 0.081],
               minor: [0.220, 0.006, 0.104, 0.123, 0.019, 0.103, 0.012, 0.214, 0.062, 0.022, 0.061, 0.052]},
  };

  // Key names spelled the way the book spells them (pwa/app_data.json majKeys / minKeys;
  // test-keys.js asserts these match the book's data).
  const MAJ_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const MIN_NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'B♭', 'B'];
  const MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11], MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];   // natural minor
  const LETTERS = 'CDEFGAB', LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  const ACC = {'-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪'};

  /* The key's seven notes, spelled with one letter each (C D E F G A B in some order), which is
     what makes "E♭ major" contain A♭ and never G♯. Computed: start on the tonic's letter, take the
     next letter for each step, then add whatever sharp/flat makes that letter land on the right pitch. */
  function scaleOf(key) {
    const tonicLetter = LETTERS.indexOf(key.name[0]);
    const steps = key.mode === 'major' ? MAJOR_STEPS : MINOR_STEPS;
    return steps.map((st, i) => {
      const li = (tonicLetter + i) % 7, pc = (key.tonic + st) % 12;
      let acc = ((pc - LETTER_PC[li]) % 12 + 12) % 12; if (acc > 6) acc -= 12;   // -2..+2
      return {pc, name: LETTERS[li] + ACC[acc], acc, degree: i + 1};
    });
  }

  const KEYS = [];
  for (let t = 0; t < 12; t++) KEYS.push({tonic: t, mode: 'major', name: MAJ_NAMES[t]});
  for (let t = 0; t < 12; t++) KEYS.push({tonic: t, mode: 'minor', name: MIN_NAMES[t]});
  KEYS.forEach(k => {
    k.label = `${k.name} ${k.mode}`;
    k.scale = scaleOf(k);
    // a key "leans sharp" if its spelled scale uses sharps (or is C / A minor): decides how to name
    // the notes that fall outside it
    k.sharpish = !k.scale.some(n => n.acc < 0);
  });

  /* Name a pitch class inside a key: its scale spelling if it's in the key, otherwise the nearest
     sensible chromatic name (sharps in sharp keys, flats in flat keys). */
  function spell(pc, key) {
    const inKey = key.scale.find(n => n.pc === pc);
    if (inKey) return inKey.name;
    const SH = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
    const FL = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
    return (key.sharpish ? SH : FL)[pc];
  }
  const relativeOf = k => KEYS.find(o => o.mode !== k.mode && o.tonic === (k.mode === 'major' ? (k.tonic + 9) % 12 : (k.tonic + 3) % 12));

  /* Pearson correlation between two 12-number lists: how closely their ups and downs line up.
     (Subtract each list's average, then compare the leftovers; divide by their sizes so loudness
     or song length doesn't matter, only the shape.) */
  function correlate(a, b) {
    const ma = a.reduce((s, v) => s + v, 0) / 12, mb = b.reduce((s, v) => s + v, 0) / 12;
    let num = 0, da = 0, db = 0;
    for (let i = 0; i < 12; i++) { const x = a[i] - ma, y = b[i] - mb; num += x * y; da += x * x; db += y * y; }
    return da && db ? num / Math.sqrt(da * db) : 0;
  }

  /* Rank all 24 keys for a 12-number pitch profile. The key profile is rotated so its tonic sits
     on the key's pitch class: for D major, profile[0] lines up with D. */
  function rank(weights, profile = DEFAULTS.profile) {
    const P = PROFILES[profile];
    return KEYS.map(k => {
      const prof = k.mode === 'major' ? P.major : P.minor;
      const rotated = Array.from({length: 12}, (_, pc) => prof[(pc - k.tonic + 12) % 12]);
      return {key: k, r: correlate(weights, rotated)};
    }).sort((x, y) => y.r - x.r);
  }

  const DEFAULTS = {
    profile: 'albrecht',     // chosen by test-keys.js (see NOTES.md for the scores)
    capMs: 1500,             // a note held longer than this counts as this long (one drone can't rule)
    bassBoost: 0,            // extra weight for low notes (tried 0.5 and 1: both scored worse)
    halfLifeNotes: 64,       // older notes fade: 64 notes ago counts half, so a key change gets followed
    minNotes: 6,             // fewer notes than this: still listening
    minPitches: 4,           // fewer distinct pitch classes than this: still listening
    sureMargin: 0.2,         // winning scale family beats the next family by this much: "confident" (~98% right)
    homeMargin: 0.25,        // the key beats its own relative by this much: home is "clear" (~94% right)
    switchMargin: 0.02,      // a new key must beat the one on screen by this much to replace it
    sureHold: 0.7,           // once confident, stay so down to 70% of sureMargin
  };

  /* How much one note event adds to its pitch class. */
  function weightOf(ev, o) {
    const secs = Math.min(ev.durationMs, o.capMs) / 1000;
    const bass = ev.midi < 60 ? 1 + o.bassBoost * Math.min(1, (60 - ev.midi) / 20) : 1;   // E2 gets the full boost
    return secs * bass;
  }

  /* One-shot: the key of a list of note events (oldest first). */
  function analyse(events, opts = {}) {
    const f = create(opts); events.forEach(e => f.add(e)); return f.result();
  }

  /* A running key finder: add() each finished note, ask result() any time.

     What it reports, and how sure it is, comes in two layers (decided by testing, see NOTES.md):
       the SCALE FAMILY  e.g. "C major / A minor": the seven notes you're using. Reliable: right
                         ~93% of the time on chord arpeggios, 100% on tunes. It's also all Phase 3
                         needs, since a key and its relative share the same safe chords.
       the HOME note     C (major) or A (minor)? The note counts alone can't always tell, because the
                         two use the very same notes. Tunes: always right. Chord loops: ~72%. So it
                         is reported as a lean when the two are close, never as a fact. */
  function create(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const fade = Math.pow(0.5, 1 / o.halfLifeNotes);     // per-note multiplier that halves every halfLifeNotes
    let weights = new Array(12).fill(0), notes = 0, seconds = 0;
    let shown = null, wasSure = false;                    // last answer given, for stickiness
    const seen = new Set();

    function add(ev) {
      if (!ev || !(ev.durationMs > 0)) return;
      for (let i = 0; i < 12; i++) weights[i] *= fade;
      weights[ev.pitchClass] += weightOf(ev, o);
      notes++; seconds += ev.durationMs / 1000; seen.add(ev.pitchClass);
    }

    /* live: an optional note still ringing, counted provisionally so the answer moves while you hold it */
    function result(live) {
      let w = weights;
      if (live && live.durationMs > 0) { w = weights.slice(); w[live.pitchClass] += weightOf(live, o); }
      const n = notes + (live ? 1 : 0), pcs = new Set(seen); if (live) pcs.add(live.pitchClass);
      const ranked = rank(w, o.profile);
      // Stickiness: keep the key we showed last time unless a new one beats it clearly. Without
      // this the answer flickers between near-equal keys note by note.
      if (shown && ranked[0].key !== shown) {
        const i = ranked.findIndex(x => x.key === shown);
        if (ranked[0].r - ranked[i].r < o.switchMargin) ranked.unshift(...ranked.splice(i, 1));
      }
      const first = ranked[0], rel = relativeOf(first.key);
      const relEntry = ranked.find(x => x.key === rel);
      // the best key from a DIFFERENT family: how far ahead the winning family is
      const rival = ranked.find(x => x.key !== first.key && x.key !== rel);
      const familyMargin = first.r - rival.r, homeMargin = first.r - relEntry.r;
      const enough = n >= o.minNotes && pcs.size >= o.minPitches;
      const major = first.key.mode === 'major' ? first.key : rel, minor = first.key.mode === 'minor' ? first.key : rel;
      // once "confident", stay so until the lead falls well under the line (not a hair under it)
      const sure = familyMargin >= (wasSure ? o.sureMargin * o.sureHold : o.sureMargin);
      const state = !enough ? 'listening' : sure ? 'confident' : 'leaning';
      if (!live) { shown = enough ? first.key : null; wasSure = state === 'confident'; }   // a ringing note is provisional
      return {
        state,
        best: first.key, r: first.r,
        family: {major, minor, margin: familyMargin, label: `${major.label} / ${minor.label}`},
        home: {key: first.key, other: rel, margin: homeMargin, clear: homeMargin >= o.homeMargin},
        // 0..1 for a meter: how far the winning family is clear of the rest (sureMargin = 60%)
        confidence: enough ? Math.max(0, Math.min(1, familyMargin / (o.sureMargin / 0.6))) : 0,
        ranked: ranked.map(x => ({label: x.key.label, name: x.key.name, mode: x.key.mode, tonic: x.key.tonic, r: x.r})),
        weights: w.slice(), notes: n, pitches: pcs.size, seconds,
      };
    }

    return {add, result, reset() { weights = new Array(12).fill(0); notes = 0; seconds = 0; seen.clear(); shown = null; wasSure = false; }};
  }

  return {create, analyse, rank, correlate, scaleOf, spell, relativeOf, KEYS, PROFILES, DEFAULTS, MAJ_NAMES, MIN_NAMES};
})();
if (typeof module !== 'undefined') module.exports = KeyFinder;

/* ---- compass/pitch-engine.js ---- */
/* Song Compass — pitch engine (Phase 1).
   Audio and pitch logic only: no DOM, no drawing. The page (compass-ui.js) listens to it.
   Written as a classic script that defines one global, PitchEngine, so Phase 5 can paste it
   straight into pwa/book.template.html the same way build_book.py splices in the app's core.

   Pieces, from the bottom up:
     yin(buf, sampleRate)      one block of samples -> {freq, clarity} or null
     noteOf(freq)              a frequency -> note name, octave, MIDI number, cents off
     createTracker()           frame-by-frame detections -> steady notes + a history of note events
     create()                  wires the microphone to all of the above
   The first three are pure (no browser needed), so they can be tested with fake signals in Node. */
const PitchEngine = (() => {
  'use strict';

  // Spelled the way the book spells them (app.template.html, SH). Phase 2 will re-spell by key.
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

  const DEFAULTS = {
    minFreq: 70,          // a little under low E (82.4 Hz), so drop-D (73.4 Hz) still reads
    maxFreq: 1400,        // a little over the 24th fret of the high E (1319 Hz)
    threshold: 0.15,      // YIN's dip threshold: lower = stricter, fewer octave mistakes, more misses
    octaveRatio: 0.3,     // double the period wins if it matches about 3x better (see step 3b)
    octaveFloor: 0.004,   // ...unless the first match was already near-perfect. Both tuned on 83 real recordings
    octaveEnergy: 0.0025, // ...and only if the lower note's odd harmonics are really there (power ratio)
    subharmonics: [2, 3], // periods to second-guess: double (octave errors) and triple (twelfth errors)
    twelfthEnergy: 20,    // a triple period needs this many times more in-between energy than an octave (swept
                          // 5–300: 20 fixes a low A read as E4 at almost no cost; 5 adds false notes)
    minClarity: 0.8,      // below this we say "not sure" rather than show a wrong note
    holdFrames: 3,        // a new note must repeat this many frames (~50 ms) before it's shown
    releaseMs: 140,       // silence/uncertainty this long ends the current note
    minNoteMs: 60,        // a note event shorter than this is dropped as a blip
    historySize: 16,
    bufferSize: 4096,     // samples copied from the (filtered) mic each frame, for pitch
    rawSize: 0,           // >0: also tap the UNfiltered mic (8192 for chords) and emit it as 'raw'
    absGate: 0.0015,      // the gate never drops below this loudness (RMS), whatever the room. Was 0.006: a
                          // quiet player lost over half their notes (GuitarSet at 1/4 volume: 41% → 76% found)
    gateRatio: 2,         // ...and otherwise sits this many times above the room's own background
    adaptTuning: false,   // name notes relative to the guitar's own tuning (see createAnalyzer); a tuner
                          // must leave this off, the Song Compass turns it on
    highpass: 180,        // the mic chain's filters (Hz); the tests apply the same ones (test-samples.js).
                          // 180, not 60: body boom and ringing low strings muddy the pitch (GuitarSet
                          // solos 78.6% → 82.1%); low E still reads, from its overtones
    lowpass: 2200,
    context: null,        // optional () => AudioContext, to share the host page's (the book's audio())
    windowSize: 1536,     // samples YIN looks at (the newest ones): low E still fits; swept 1536/2048/3072
    onsetRatio: 2.5,      // a pluck = the newest ~16 ms is this many times louder than just before
    onsetHoldMs: 90,      // a pluck counts for this long (the pitch takes a few frames to come clear)
    minRepeatMs: 90,      // a re-pluck of the same note sooner than this is the same pluck
    a4: 440,
  };

  /* ------------------------------------------------------------------ YIN
     YIN (de Cheveigné & Kawahara, 2002) finds the period of a wave: the time until it repeats.

     Step 1, the difference function. For each candidate lag `tau` (a shift in samples), slide the
     wave against itself and add up the squared gaps:  d(tau) = Σ (x[j] - x[j+tau])².
     If the wave repeats every `tau` samples, the copy lands on top of the original and d(tau) ≈ 0.

     Step 2, normalise. Plain d(tau) also dips at 2×, 3×... the true period (the wave repeats there
     too) and is always 0 at tau = 0. YIN divides each d(tau) by the running average of all the
     d values before it:  d'(tau) = d(tau) · tau / Σ_{k=1..tau} d(k).  Now d' starts at 1, and a
     dip only counts if it is deep compared with everything before it.

     Step 3, the absolute threshold. Take the FIRST lag where d' drops under the threshold (then
     slide to the bottom of that dip). Taking the first, not the deepest, is what stops "octave
     errors": the true period is the earliest good match; 2× the period is a later, equally good one.

     Step 4, parabolic interpolation. The real period rarely falls on a whole sample. Fit a parabola
     through the dip and its two neighbours and take its lowest point: sub-sample accuracy, which is
     what makes the cents reading trustworthy.

     Clarity = 1 - d'(tau): 1 is a perfect repeat, 0 is noise. That is our confidence. */
  function yin(buf, sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tauMin = Math.max(2, Math.floor(sampleRate / o.maxFreq));
    // the comparison window must hold at least one full period of the lowest note, plus the shift
    const tauMax = Math.min(Math.ceil(sampleRate / o.minFreq), Math.floor(buf.length / 2));
    const W = buf.length - tauMax;                       // how many samples each comparison sums over
    if (tauMax <= tauMin + 2 || W < tauMax) return null;

    // Step 1 + 2 together: difference function, then cumulative-mean normalisation
    const dp = new Float32Array(tauMax + 1);
    dp[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let sum = 0;
      for (let j = 0; j < W; j++) { const g = buf[j] - buf[j + tau]; sum += g * g; }
      running += sum;
      dp[tau] = running > 0 ? sum * tau / running : 1;
    }

    // Step 3: first dip under the threshold (inside the guitar's range), walked to its bottom
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (dp[t] < o.threshold) {
        while (t + 1 < tauMax && dp[t + 1] < dp[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      // nothing cleared the bar: fall back to the deepest dip, and let its low clarity say "unsure"
      let best = tauMin;
      for (let t = tauMin + 1; t < tauMax; t++) if (dp[t] < dp[best]) best = t;
      tau = best;
    }
    if (tau <= tauMin || tau >= tauMax) return null;    // a dip at the edge of the range isn't a real pitch

    // Step 3b, the octave check (added after testing real recordings). As a plucked string rings,
    // its fundamental fades faster than its 2nd harmonic, so the wave comes to ALMOST repeat every
    // half period and step 3 lands an octave too high. A true period shows an even better match
    // at double the lag; a real note's double lag is only ever about as good, never much better.
    // Dips are compared at their parabola-refined bottoms (step 4's trick): at high notes a period of
    // 33.4 samples looks worse at 33 than its double does at 67, just from where the samples fall.
    const refine = t => {
      const a = dp[t - 1], b = dp[t], c = dp[t + 1], den = a - 2 * b + c;
      if (!(den > 0)) return {at: t, depth: b};
      const s = Math.max(-0.5, Math.min(0.5, (a - c) / (2 * den)));
      return {at: t + s, depth: Math.max(0, b - (a - c) * s / 4)};
    };
    // The same test for a period three times as long (the "twelfth" error: a low A whose fundamental
    // and 2nd harmonic are faint reads as the E above, its 3rd harmonic). For k = 3 the lower note's
    // tell-tale harmonics sit at 1/3, 2/3, 4/3 and 5/3 of the higher reading.
    for (let guard = 0; guard < 3; guard++) {
      let moved = false;
      for (const k of o.subharmonics) {
        const tk = tau * k;
        if (tk + 2 >= tauMax) continue;
        let bk = tk;
        for (let t = tk - 2; t <= tk + 2; t++) if (dp[t] < dp[bk]) bk = t;   // the dip may sit a sample off
        const one = refine(tau), lower = refine(bk);
        // only second-guess a so-so match: when the first dip is already near-perfect (clean high
        // notes), both numbers are tiny and their ratio is just noise
        if (!(one.depth > o.octaveFloor && lower.depth < one.depth * o.octaveRatio)) continue;
        // Last word goes to the spectrum: if the note really is lower, there must be actual sound at its
        // harmonics that aren't also harmonics of the higher reading (for an octave: ½, 1½, 2½ of it).
        // If there's next to nothing there, the lower note is a phantom of the maths. (Measured on the
        // recordings: every wrong halving had under 0.3% of such energy; nearly all right ones had more.)
        const fh = sampleRate / one.at;
        let odd = 0;
        for (let j = 1; j < 3 * k; j++) if (j % k) odd += power(buf, sampleRate, fh * j / k);
        const even = power(buf, sampleRate, fh) + power(buf, sampleRate, fh * 2);
        if (odd > even * o.octaveEnergy * (k === 2 ? 1 : o.twelfthEnergy)) { tau = bk; moved = true; break; }
      }
      if (!moved) break;
    }

    // Step 4: parabola through (tau-1, tau, tau+1); its vertex is the refined period
    const a = dp[tau - 1], b = dp[tau], c = dp[tau + 1], den = a - 2 * b + c;
    const shift = den > 0 ? (a - c) / (2 * den) : 0;    // always within ±0.5 of a sample
    const period = tau + Math.max(-0.5, Math.min(0.5, shift));
    const freq = sampleRate / period;
    if (freq < o.minFreq || freq > o.maxFreq) return null;
    return {freq, clarity: Math.max(0, Math.min(1, 1 - b))};
  }

  /* The Goertzel algorithm: how much of ONE frequency is in a block of sound. It's a single bin of a
     Fourier transform (FFT), so it's far cheaper than a whole FFT when you only need to ask about a
     few frequencies. The Hann window fades the block's edges so the cut-off ends don't smear energy. */
  function power(buf, sampleRate, f) {
    const N = buf.length, c = 2 * Math.cos(2 * Math.PI * f / sampleRate);
    let s1 = 0, s2 = 0;
    for (let i = 0; i < N; i++) {
      const s = buf[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1))) + c * s1 - s2;
      s2 = s1; s1 = s;
    }
    return s1 * s1 + s2 * s2 - c * s1 * s2;
  }

  /* ------------------------------------------------------------------ frequency -> note
     MIDI numbers count semitones (frets): A4 = 440 Hz = 69, and each semitone up multiplies the
     frequency by 2^(1/12). So the semitone count is 12 · log2(f / 440) above 69. Rounding gives the
     nearest note; what's left over, times 100, is the cents (a semitone = 100 cents). */
  function noteOf(freq, a4 = DEFAULTS.a4) {
    const exact = 69 + 12 * Math.log2(freq / a4);
    const midi = Math.round(exact);
    const pitchClass = ((midi % 12) + 12) % 12;          // 0 = C ... 11 = B, octave thrown away
    return {
      midi, pitchClass, name: NAMES[pitchClass],
      octave: Math.floor(midi / 12) - 1,                 // MIDI 60 = C4 (middle C), so octave = midi/12 - 1
      cents: (exact - midi) * 100,                       // -50 .. +50
      freq,
    };
  }

  /* RMS (root mean square): square every sample, average, square-root. A fair "how loud" that
     doesn't cancel out just because a wave swings both above and below zero. */
  function rmsOf(buf) {
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  const median = xs => { const s = [...xs].sort((p, q) => p - q), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  /* ------------------------------------------------------------------ the tracker
     Turns a jittery stream of per-frame guesses into (a) one steady "current note" for the display
     and (b) a clean history of note EVENTS for Phase 2's key finder.
     It never touches the mic, so tests can feed it fake frames with fake timestamps.

     A history event looks like:
       { id, midi, pitchClass, name, octave, freq, cents, confidence, startedAt, durationMs, ended }
     durationMs matters: the Krumhansl key method weighs each pitch by how long it sounded. */
  function createTracker(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    let candidate = null, candidateCount = 0;    // the note we're auditioning before showing it
    let current = null;                          // the note being shown (null = nothing confident)
    let lastGood = 0;                            // time of the last confident frame for `current`
    let recent = [];                             // the last few frequencies of `current`, for a median
    let event = null;                            // the history event being held right now
    let nextId = 1, lastOnset = -1e9, onsetUsed = -1e9, repluck = null;   // repluck: a same-pitch pluck being confirmed
    let votes = {};                              // frames heard per octave of the current note
    const history = [];
    const listeners = {note: [], noteend: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));

    function closeEvent(now) {
      if (!event) return;
      event.durationMs = Math.max(0, now - event.startedAt);   // `now` is the last frame that really heard it
      event.ended = true;
      const ev = event; event = null;
      if (ev.durationMs < o.minNoteMs) {         // a blip: forget it was ever logged
        const i = history.indexOf(ev); if (i >= 0) history.splice(i, 1);
        return;
      }
      emit('noteend', ev);
    }
    function openEvent(n, now, confidence) {
      closeEvent(now);
      event = {id: nextId++, midi: n.midi, pitchClass: n.pitchClass, name: n.name, octave: n.octave,
        freq: n.freq, cents: n.cents, confidence, startedAt: now, durationMs: 0, ended: false};
      history.push(event);
      while (history.length > o.historySize) history.shift();
      emit('note', event);
    }

    /* Feed one analysis frame.  det = yin()'s result or null; rms = loudness; gated = too quiet;
       onset = the onset detector heard a fresh pluck this frame. Returns what to show right now. */
    function push(det, rms, now, gated, onset = false) {
      const ok = !gated && det && det.clarity >= o.minClarity;
      const n = ok ? noteOf(det.freq, o.a4) : null;
      // a pluck heard recently (the pitch can take a frame or two to come clear after it)
      if (onset) lastOnset = now;
      const attack = now - lastOnset < o.onsetHoldMs;

      if (n) {
        // A string can't leap a whole octave on its own. An exact octave (or two) away from the
        // ringing note, with no fresh pluck, is the detector slipping on a harmonic: same note.
        // Which octave it IS gets decided by majority over the note's life, not by its first few
        // frames (the pick's attack is the noisiest moment, and it once locked F♯4 in as F♯3).
        if (current && n.midi !== current.midi && (n.midi - current.midi) % 12 === 0 && !attack) {
          lastGood = now; candidate = null; candidateCount = 0;
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          if (votes[n.midi] > (votes[current.midi] || 0)) {        // the other octave has won: relabel
            current = n; recent = [det.freq];
            if (event) Object.assign(event, {midi: n.midi, name: n.name, octave: n.octave, freq: n.freq, cents: n.cents});
          } else {
            if (event) event.durationMs = now - event.startedAt;
            return {note: noteOf(median(recent), o.a4), confidence: det.clarity};
          }
        }
        if (current && n.midi === current.midi) {
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          lastGood = now; candidate = null; candidateCount = 0;
          recent.push(det.freq); if (recent.length > 7) recent.shift();
          // Re-plucking the same note: same pitch, but a fresh onset starts a new event (A, A = two
          // notes). Only once the pitch has STAYED the same for holdFrames after the pluck, though: when
          // you move to a new note, the window still holds the old one for a frame or two.
          if (attack && lastOnset > onsetUsed && event && lastOnset - event.startedAt > o.minRepeatMs) {
            if (!repluck || repluck.at !== lastOnset) repluck = {at: lastOnset, count: 0};
            if (++repluck.count >= o.holdFrames) { onsetUsed = lastOnset; repluck = null; openEvent(current, lastOnset, det.clarity); }
          }
        } else {
          // a different note: it has to show up `holdFrames` times in a row before we switch to it
          repluck = null;
          if (candidate && candidate.midi === n.midi) candidateCount++;
          else { candidate = n; candidateCount = 1; }
          if (candidateCount >= o.holdFrames) {
            current = n; recent = [det.freq]; lastGood = now; candidate = null; candidateCount = 0;
            votes = {[n.midi]: o.holdFrames}; repluck = null;
            if (attack) onsetUsed = lastOnset;               // this pluck is spent on this note
            openEvent(n, now, det.clarity);
          }
        }
      }
      // nothing confident for long enough: the note has ended
      if (current && now - lastGood > o.releaseMs) {
        closeEvent(lastGood);
        current = null; recent = [];
      }

      if (!current) return {note: null, confidence: ok ? det.clarity : (det ? det.clarity : 0)};
      // the display uses the median of recent frames: one bad frame can't yank the needle
      const shown = noteOf(median(recent), o.a4);
      // only frames that actually hear the note lengthen it: the release wait isn't playing time
      if (event && ok && n.midi === event.midi) {
        event.durationMs = now - event.startedAt;
        event.freq = shown.freq; event.cents = shown.cents;     // a running best estimate of its pitch
        event.confidence = Math.max(event.confidence, det.clarity);
      }
      return {note: shown, confidence: ok ? det.clarity : 0};
    }

    return {
      push,
      setA4(a4) { o.a4 = a4; },                 // the reference pitch notes are named against (see adaptTuning)
      flush(now) { closeEvent(now); current = null; candidate = null; recent = []; },
      on(k, f) { listeners[k].push(f); return () => { listeners[k] = listeners[k].filter(g => g !== f); }; },
      get history() { return history.map(e => ({...e})); },   // copies, so nobody edits ours by accident
      clear() { history.length = 0; event = null; },
    };
  }

  /* ------------------------------------------------------------------ one frame at a time
     createAnalyzer does everything that happens to one block of samples: noise gate, onset detector,
     YIN, tracker. The live mic loop and the tests both feed it, so the tests measure the live code.
     process(buf, now): buf = the newest samples (the AnalyserNode's 4096), now = time in ms. */
  function createAnalyzer(sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tracker = createTracker(o);
    const tail = Math.round(sampleRate * 0.016);       // ~16 ms: about one frame's worth of new sound
    let startedAt = null, noiseFloor = Infinity, tails = [];

    /* Noise gate. For the first ~0.6 s we measure the room: the QUIETEST moment, not the average, so
       pressing Start mid-strum doesn't teach it that the guitar is background noise (capped too).
       Then the gate is 3x that level, never below an absolute floor, and keeps re-learning slowly
       while it's quiet so a noisier room doesn't make it fire on the fridge. */
    const CALIBRATE_MS = 600, MAX_FLOOR = 0.01;
    function gateFor(rms, now) {
      if (startedAt == null) startedAt = now;
      if (now - startedAt < CALIBRATE_MS) { noiseFloor = Math.min(noiseFloor, rms, MAX_FLOOR); return Infinity; }
      if (!isFinite(noiseFloor)) noiseFloor = 0;
      const gate = Math.max(o.absGate, noiseFloor * o.gateRatio);
      if (rms < gate) noiseFloor = Math.min(MAX_FLOOR, noiseFloor * 0.995 + rms * 0.005);
      return gate;
    }

    /* Onset detector. A pick or finger hitting a string is a sudden burst of energy. Each frame we
       measure only the newest ~16 ms (the rest of the buffer is old news) and flag an onset when it's
       onsetRatio times louder than the quietest of the last few frames, and still rising. This catches
       a re-plucked note, which pitch alone can't (A then A has no pitch change). */
    function onsetIn(buf, gate) {
      let e = 0; for (let i = buf.length - tail; i < buf.length; i++) e += buf[i] * buf[i];
      e /= tail;
      const before = tails.length >= 3 ? Math.min(...tails.slice(-3)) : Infinity, prev = tails[tails.length - 1];
      tails.push(e); if (tails.length > 6) tails.shift();
      return isFinite(gate) && Math.sqrt(e) > gate && e > before * o.onsetRatio && e > prev * 1.2;
    }

    /* The guitar's own tuning. Amateur guitars are often a little sharp or flat all over, and a note 25
       cents flat sits halfway to the next one down, so vibrato tips it into the wrong name (GuitarSet
       detuned 25 cents: notes found fell from 79% to 42%). So we keep a running average of how far
       steady, confident notes sit from A = 440, and name notes against that. Cents wrap round (+49 and
       −49 are neighbours), so the average is circular: each offset is a point on a circle, and the
       direction of their mean is the offset. Applied once there's enough evidence and it's more than
       10 cents off. The offset is reported, so a page can say "your guitar is about 25 cents flat". */
    let tx = 0, ty = 0, tN = 0, tuning = 0;
    function learnTuning(det) {
      const c = 1200 * Math.log2(det.freq / 440), a = 2 * Math.PI * c / 100;
      tx = tx * 0.98 + Math.cos(a) * 0.02; ty = ty * 0.98 + Math.sin(a) * 0.02; tN++;
      const r = Math.hypot(tx, ty) / (1 - Math.pow(0.98, tN)), off = Math.atan2(ty, tx) * 100 / (2 * Math.PI);
      tuning = tN >= 40 && r > 0.6 && Math.abs(off) >= 10 ? off : (Math.abs(off) < 6 ? 0 : tuning);
      tracker.setA4(440 * Math.pow(2, tuning / 1200));
    }

    function process(buf, now) {
      const win = buf.length > o.windowSize ? buf.subarray(buf.length - o.windowSize) : buf;
      const rms = rmsOf(win), gate = gateFor(rms, now), gated = rms < gate;
      const onset = onsetIn(buf, gate);
      const det = gated ? null : yin(win, sampleRate, o);         // skip the maths when it's quiet
      if (o.adaptTuning && det && det.clarity >= 0.9) learnTuning(det);
      const view = tracker.push(det, rms, now, gated, onset);
      return {...view, rms, onset, gate: isFinite(gate) ? gate : null, calibrating: !isFinite(gate), raw: det, sampleRate,
        tuning, a4: 440 * Math.pow(2, tuning / 1200)};
    }
    return {process, tracker, flush: now => tracker.flush(now)};
  }

  /* ------------------------------------------------------------------ the microphone
     Signal path:  mic -> high-pass 60 Hz -> low-pass 2.2 kHz -> AnalyserNode
     The high-pass removes rumble (desk bumps, AC hum's lowest part) below the guitar's range; the
     low-pass trims the bright upper harmonics that make the wave messier without changing its pitch.
     The AnalyserNode is a tap: every animation frame (~60 a second) we copy out its newest 4096
     samples and hand them to createAnalyzer (which uses the newest 2048 for pitch). */
  function create(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const listeners = {frame: [], state: [], note: [], noteend: [], raw: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));
    let ctx = null, stream = null, nodes = [], raf = 0, buf = null, analyser = null, an = null, rawAnalyser = null, rawBuf = null;
    let state = 'idle', kept = [];                      // kept: finished notes, carried across Stop/Start

    const setState = (s, detail) => { state = s; emit('state', {state: s, detail}); };

    function loop() {
      analyser.getFloatTimeDomainData(buf);
      const view = an.process(buf, performance.now());
      emit('frame', view);
      // the raw samples, for other listeners (the chord finder needs the full 8192)
      // the full, unfiltered sound for chords (the filters that help pitch would cut the bass notes)
      if (rawAnalyser && listeners.raw.length) { rawAnalyser.getFloatTimeDomainData(rawBuf); emit('raw', {buf: rawBuf, sampleRate: ctx.sampleRate, view}); }
      raf = requestAnimationFrame(loop);
    }

    async function start() {
      if (state === 'listening' || state === 'starting') return;
      // Browsers only expose the mic on https:// or http://localhost. Elsewhere this is undefined.
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setState('insecure'); return; }
      setState('starting');
      try {
        // Make (or wake) the AudioContext inside the button tap: Safari refuses audio otherwise.
        const AC = window.AudioContext || window.webkitAudioContext;
        // a host page (the book) can lend its own AudioContext; otherwise make one
        ctx = ctx || (o.context ? o.context() : new AC());
        // iOS: while listening, the audio session must allow recording as well as playing
        try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
        const resumed = ctx.resume();                   // don't await yet: iOS wants this in the same tap
        // Voice-call clean-up (echo cancelling, noise suppression, auto volume) mangles an
        // instrument, so ask for the raw signal.
        stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
        await resumed;
        const src = ctx.createMediaStreamSource(stream);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = o.highpass; hp.Q.value = 0.707;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lowpass; lp.Q.value = 0.707;
        analyser = ctx.createAnalyser(); analyser.fftSize = o.bufferSize; analyser.smoothingTimeConstant = 0;
        src.connect(hp); hp.connect(lp); lp.connect(analyser);   // not connected to the speakers: no feedback
        nodes = [src, hp, lp, analyser];
        buf = new Float32Array(analyser.fftSize);
        if (o.rawSize) {                                // a second tap, before the filters (for chords)
          rawAnalyser = ctx.createAnalyser(); rawAnalyser.fftSize = o.rawSize; rawAnalyser.smoothingTimeConstant = 0;
          src.connect(rawAnalyser); nodes.push(rawAnalyser); rawBuf = new Float32Array(o.rawSize);
        }
        an = createAnalyzer(ctx.sampleRate, o);          // fresh gate calibration each Start
        an.tracker.on('note', e => emit('note', e));
        an.tracker.on('noteend', e => { kept.push(e); while (kept.length > o.historySize) kept.shift(); emit('noteend', e); });
        setState('listening');
        loop();
      } catch (e) {
        teardown();
        const name = e && e.name;
        setState(name === 'NotAllowedError' || name === 'SecurityError' ? 'denied' : name === 'NotFoundError' || name === 'OverconstrainedError' ? 'nomic' : 'error', e && e.message);
      }
    }

    function teardown() {
      cancelAnimationFrame(raf); raf = 0;
      nodes.forEach(n => { try { n.disconnect(); } catch (e) {} }); nodes = [];
      if (stream) stream.getTracks().forEach(t => t.stop());   // turns the browser's mic light off
      stream = null; analyser = null; rawAnalyser = null;
    }
    function stop() {
      teardown();
      if (an) an.flush(performance.now());
      // never pause a borrowed context: the host's own sounds run on it
      if (ctx && ctx.state === 'running' && !o.context) ctx.suspend();
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      setState('idle');
    }

    // iOS suspends audio when the tab goes to the background; wake it when we come back.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state === 'listening' && ctx && ctx.state !== 'running') ctx.resume();
    });

    return {
      start, stop,
      get state() { return state; },
      // finished notes (from every Start/Stop) plus the one ringing now, oldest first
      get history() {
        const live = an ? an.tracker.history.filter(e => !e.ended) : [];
        return [...kept.map(e => ({...e})), ...live].slice(-o.historySize);
      },
      clearHistory: () => { kept = []; if (an) an.tracker.clear(); },
      on(k, f) { listeners[k].push(f); return () => { listeners[k] = listeners[k].filter(g => g !== f); }; },
    };
  }

  if (!(st.who === 'both' && two) && !all.some(s => s.id === st.who)) st.who = activeSinger().id;
  const who = st.who === 'both' ? all.slice(0, 2) : [all.find(s => s.id === st.who)];
  const ranges = who.map(s => s.range), yours = who.length === 1;
  const rangeOf = (s, i) => yours ? 'your range' : `${skYour(s)} range`;

  v.append(h('p', {class: 'lede'}, 'Give the book a song’s lowest and highest notes. It finds the key that puts them inside your range.'));
  const tools = h('div', {class: 'toolbar sk-tools'});
