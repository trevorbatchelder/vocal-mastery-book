  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

.icon.on{background:var(--ink);color:var(--bg)}
.icon.tap{font-size:11px;font-weight:900;letter-spacing:.08em;border-color:var(--rule)}
.cta{display:flex;align-items:center;gap:12px;min-width:0}
.cta .go{background:var(--acc);color:var(--onacc);border:0;border-radius:999px;height:50px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;flex:none}
.what{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.what>span:first-child{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:800}
.what>span:last-child{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
.cta.none .what>span:last-child{color:var(--mute);font-weight:600}
.clock2{display:flex;align-items:center;gap:9px}
.clock2 .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px}
.clock2 .lbl{font-size:10px}
.station{display:flex;align-items:center;gap:8px;flex:none}
.station .dots{display:flex;gap:4px;margin-left:2px}
/* contextual "Numbers to beat" on the Practice page */
.goals-ctx{display:flex;flex-direction:column;gap:8px}
.goal-tiers{display:flex;gap:6px}
.goalchip{border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:0;line-height:1.1}
.goalchip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.goalchip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.goalchip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.goalchip.on span{color:var(--onacc)}
.youline{font-size:13px;font-weight:700}
.pgnum{font-family:var(--display);letter-spacing:.1em;color:var(--mute);font-size:13px;white-space:nowrap;text-transform:uppercase;max-width:20ch;overflow:hidden;text-overflow:ellipsis}
.arrow{width:46px;height:46px;border:1.5px solid var(--ink);font-size:24px;font-weight:600;flex:none;color:var(--ink)}
@media (max-width:980px){ .run{display:none} .hrow h1{white-space:normal} .pgnum{display:none} }
@media (max-width:600px){ .cta .what{display:none} .cta.none .what{display:flex} .cta .go{padding:0 16px 0 14px;font-size:15px} .tempo2 .v{min-width:40px} }
/* phones, narrow (≤560px): a compact bottom bar and smaller everything so there's less to scroll */
@media (max-width:560px){
  .cta.none .what{display:none}                                  /* was the thing pushing the forward arrow off */
  .pbar .tap{display:none}                                       /* drop tap-tempo on phones; the −/+ remain */
  .pbar{gap:4px} .pbar .go.play{font-size:0;gap:0;padding:0 14px;min-width:42px}   /* play button → just the ▶ */
  .tempo2{height:40px;padding:0 2px} .tempo2 button{width:31px;height:31px;font-size:18px} .tempo2 .v{min-width:34px} .tempo2 .bpm{font-size:18px}
  .icon{width:40px;height:40px} .arrow{width:36px;height:36px}
  .pg{gap:9px;padding-block:9px 13px} .sec{gap:6px} .body{gap:9px 12px}
  .band{height:12px} .hd2 .band{height:8px;opacity:.5} .hd2{gap:4px}
  .hrow h1{font-size:clamp(24px,7.5vw,32px)} .brand-big{font-size:clamp(34px,10vw,48px)!important}
  .sec>h2{font-size:15px} .sec>h2 small{font-size:12px} .lede{font-size:13.5px}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))!important;gap:6px 8px} .cbox .nm{font-size:16px} .cbox .sub{font-size:11px}
  .big svg{max-height:300px} .toolbar{gap:7px 14px} select{min-height:40px;font-size:16px}
}
/* short screens (≤460px tall) = a phone held sideways: reclaim vertical space so content isn't buried */
@media (max-height:460px){
  .band{display:none} .hd2{gap:2px} .hrow h1{font-size:24px} .run{display:none}
  .meta,.hd2 .sub{font-size:12px} .pg{gap:6px;padding-block:5px 9px} .sec{gap:5px} .sec>h2{font-size:15px}
  .toolbar{gap:6px 14px;padding-bottom:0} select{min-height:36px} .seg button{min-height:32px;padding:4px 11px} .btn{min-height:34px}
  .pbar{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  .pbar .tap,.pbar .clock2,.cta .what,.cta.none .what{display:none}   /* just the essentials in the bar */
  .pbar .go.play{font-size:0;gap:0;padding:0 13px;min-width:40px}
  .tempo2{height:36px;padding:0 2px} .tempo2 button{width:29px;height:29px;font-size:17px} .tempo2 .v{min-width:32px} .tempo2 .bpm{font-size:16px}
  .icon{width:36px;height:36px} .arrow{width:34px;height:34px}
  .big svg{max-height:210px} .cgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))!important}
}
/* IX Writing: slim song-shape row under the bars, compact melody table */
.shape-row{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:2px}
.shape-row .label{color:var(--rust)}
.shape-row .tl{flex:1;min-width:200px}
.cells.mel-compact{border-spacing:2px;table-layout:auto}
.cells.mel-compact td,.cells.mel-compact th{padding:3px 8px 3px 0;font-size:14px}
.prog-list{display:flex;flex-direction:column}
.prog-item{all:unset;cursor:pointer;display:block;padding:6px 6px;border-bottom:1px solid var(--rule)}
.prog-item.on{background:var(--panel)}
.prog-item:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pl-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pl-top b{font-weight:900;font-size:15px}
.pl-top span{font-size:14px;color:var(--ink2);font-weight:700}
.pl-desc{font-size:12px;color:var(--mute);line-height:1.3;margin-top:1px}
/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */
.btn,.chip,.seg button,.icon,.arrow,.go,.thumb,.cbox,.goalchip,.rate button,.toc button,.rt li,.prog-item,.bar,.tempo2 button{transition:transform .12s cubic-bezier(.2,0,.2,1),background-color .16s ease-out,color .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out,opacity .12s ease-out}
:is(.btn,.chip,.seg button,.icon,.arrow,.thumb,.goalchip,.rate button,.toc button,.tempo2 button):active{transform:scale(.96)}
.go:active{transform:scale(.975)}
.cbox.on{transform:scale(1.03)}
.play::before{transition:border-width .14s ease-out,width .14s ease-out,height .14s ease-out}
.arrow svg{width:22px;height:22px} .tempo2 button svg{width:20px;height:20px}
.pbar .beats i{transition:transform .09s ease-out,background-color .09s ease-out}
.pbar .beats i.on{transform:scale(1.35)} .pbar .beats i.on.one{transform:scale(1.5)}
.sgrid .st{transition:background .08s ease-out,transform .08s ease-out}
.sgrid .st.now{transform:scale(1.04)}
@keyframes gm-right{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes gm-wrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.gm-right{animation:gm-right .3s ease-out} .gm-wrong{animation:gm-wrong .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes sageHop{0%{transform:translateY(0)}30%{transform:translateY(-12px)}55%{transform:translateY(0)}72%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Theory Lab: the facts feed and the circle-of-fifths wheel */
.facts{display:flex;flex-direction:column;gap:10px}
.fact{border-left:3px solid var(--navy);background:var(--panel);border-radius:0 10px 10px 0;padding:9px 14px}
.fact h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fact p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.term{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--rust);cursor:pointer;border-bottom:1.5px dotted currentColor;line-height:1.1}
.term:hover,.term:focus-visible{opacity:.72}
#cpop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;z-index:200;padding:22px}
.cpop-card{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:16px;max-width:430px;width:100%;padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.cpop-card h3{margin:0 0 10px;font-family:var(--title);font-size:25px;letter-spacing:.02em;color:var(--rust)}
.cpop-short{margin:0 0 10px;font-size:16px;line-height:1.5}
.cpop-more{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--ink2)}
.cpop-see{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-top:1px solid var(--rule);padding-top:12px}
.cpop-see>div{display:flex;flex-wrap:wrap;gap:6px 14px}
.cpop-go{margin-top:16px}
.cpop-x{position:absolute;top:10px;right:14px;appearance:none;border:0;background:none;font-size:26px;line-height:1;color:var(--mute);cursor:pointer}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:8px}
.gloss-row{text-align:left;appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}
.gloss-row:hover{border-color:var(--rust)}
.gloss-row b{font-size:15px;color:var(--rust)}
.gloss-row span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.btn.match{width:100%;text-align:left;min-height:46px}
.btn.match.sel{outline:2.5px solid var(--gold);outline-offset:1px}
.btn.match.matched{background:var(--sage);color:var(--onacc);border-color:var(--sage)}
.wheel{position:relative;width:300px;height:300px;margin:4px auto;max-width:100%}
.wheel .ring{position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--rule)}

/* ===== vocal book additions (everything else is the shared frame.css) ===== */
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px 26px}@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.note{font-family:var(--display);font-size:72px;line-height:1;text-align:center}
.note small{font-size:.42em;color:var(--mute)}
.needle{width:100%;max-width:460px;margin:0 auto;display:block}
/* the pitch trace: a canvas that scrolls the last few seconds of your voice */
.trace{width:100%;height:170px;border:1.5px solid var(--rule);border-radius:12px;display:block;background:var(--panel)}
/* a piano keyboard built from buttons: tap a key to hear it or choose a target */
.kb{position:relative;display:flex;height:96px;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:8px}
.kb .w{flex:none;width:34px;height:100%;border:1.5px solid var(--rule);border-radius:0 0 6px 6px;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10.5px;font-weight:800;color:var(--mute);box-sizing:border-box;margin-right:-1.5px}
.kb .b{position:absolute;top:0;width:21px;height:58%;background:var(--ink);border-radius:0 0 4px 4px;z-index:2;border:0;padding:0}
.kb .w.on{background:var(--gold);color:var(--onacc)} .kb .b.on{background:var(--gold)}
.kb .w.you{box-shadow:inset 0 -6px 0 var(--sage)} .kb .b.you{box-shadow:inset 0 -5px 0 var(--sage)}

/* harmony tables */
table.cells td.maj{color:var(--rust)} table.cells td.min{color:var(--navy)}
table.cells td small{display:block;font-size:10px;letter-spacing:.06em;opacity:.8;margin-top:-2px}

table.cells td.on{background:var(--gold)!important;color:var(--onacc)!important}
.stack{display:flex;flex-direction:column-reverse;gap:3px;align-items:stretch;min-width:72px}
.stack span{border-radius:5px;padding:6px 0;text-align:center;color:#fff;font-weight:800;font-size:14px}
.stack span.lead{outline:2.5px solid var(--gold);outline-offset:-2.5px}
/* exercise cards */
.excard{border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.excard h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.excard p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.phase{font-family:var(--display);font-size:54px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.ex-list{display:flex;flex-direction:column}
.ex-list button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--rule);border-radius:6px}
.ex-list button b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--rust)}

.ex-list button i{font-style:normal;font-size:12px;color:var(--mute);font-weight:700}
.ex-list button.done span::after{content:" ✓";color:var(--ok)}
.ex-list button[aria-selected="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--rust)}
.grid-svg svg{width:100%;height:auto;max-height:220px;display:block}
.cue{font-size:13px;color:var(--mute);font-weight:700}
.cue b{color:var(--ink2)}
/* V · the extended voice — the Mirror and its rooms */
.specwrap{position:relative;border:1.5px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--panel)}
.spec,.specov{display:block;width:100%;height:290px}
.specov{position:absolute;inset:0;pointer-events:none}
.mirror.compact .spec,.mirror.compact .specov{height:210px}
.mirror{display:flex;flex-direction:column;gap:8px}
ol.steps{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

.mirrorcue{border-left:3px solid var(--gold);padding-left:10px}
.safety{border:1.5px solid var(--rust);border-radius:10px;padding:9px 12px;background:color-mix(in srgb, var(--rust) 7%, var(--panel));font-size:13.5px;line-height:1.5}
.safety b{color:var(--rust)}
.harmrow{display:flex;gap:6px;flex-wrap:wrap}
.hbt{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:7px 6px;border:1.5px solid var(--rule);border-radius:10px;background:var(--panel)}
.hbt b{font-family:var(--display);font-size:20px;line-height:1;color:var(--plum)}
.hbt span{font-size:11px;font-weight:800}
.hbt i{font-style:normal;font-size:9.5px;color:var(--mute);font-weight:700}
.hbt.on{background:var(--plum);border-color:var(--plum)}
.hbt.on b,.hbt.on span,.hbt.on i{color:var(--onacc,#fff)}
.trylist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.trylist li{font-size:14px;line-height:1.5;color:var(--ink2)}
.trylist li::marker{color:var(--teal)}
/* the live detector kits under the Mirror */
.livekit{display:flex;flex-direction:column;gap:7px;border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;background:var(--panel)}
.livekit>b{color:var(--ink);min-height:1.3em}
.gmeter{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--sage) 0 30%,var(--gold) 30% 72%,var(--rust) 72% 100%);opacity:.92}
.gmnd{position:absolute;top:-4px;left:5%;width:4px;height:22px;border-radius:2px;background:var(--ink);transition:left .15s linear}
.gmlabels{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.holdbar{height:12px;border-radius:6px;border:1.5px solid var(--rule);overflow:hidden;background:var(--bg)}
.holdfill{display:block;height:100%;width:0;background:var(--ok);transition:width .12s linear}
.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
