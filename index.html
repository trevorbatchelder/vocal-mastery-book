  health: [
    Q('A warm-up should start with:', 'gentle, easy sounds in the middle of the range — lip trills, hums, sirens', ['the highest notes you can sing', 'a full-voice belt', 'a long speech'], 'Easy first.', 'Like any muscle, the folds need blood flow and gentle motion before work. Lip trills, hums and sirens do that with almost no strain.'),
    Q('Whispering is:', 'harder on the folds than normal speech', ['the safest way to rest the voice', 'good for warming up', 'the same as humming'], 'Surprising but true.', 'A whisper pushes air through folds held slightly apart and tense. When the voice is tired, speak softly instead — or say nothing.'),
    Q('Hoarseness that lasts more than two weeks:', 'is a question for a doctor', ['is normal for singers', 'is fixed by singing louder', 'means you need more vibrato'], 'Do not sing through it.', 'Short hoarseness after a heavy day is normal; weeks of it can mean swelling or a nodule. A laryngologist can look, and the earlier the better.'),
    Q('Which is the best drink for the voice before singing?', 'water, room temperature', ['hot tea with lemon and honey', 'milk', 'cold fizzy drinks'], 'Hydration is systemic.', 'Nothing you drink touches the folds, but a well-watered body keeps their surface lubricated. Dairy thickens mucus for many; iced drinks tighten muscles.'),
    Q('Why does a lip trill train support by itself?', 'the lips only buzz when the air is steady', ['it is loud', 'it uses the highest notes', 'it needs no air'], 'Stop the air, the buzz stops.', 'The trill is an air-flow meter: any surge or sag and the lips stop buzzing. Keep them going and you have kept the breath even.'),
    Q('After a heavy singing day the voice needs:', 'rest, water and sleep, and a gentle warm-down', ['more singing to stay strong', 'a long whisper', 'cold air'], 'Recover like an athlete.', 'The folds swell slightly with heavy use. Easy hums and a quiet evening let them settle; pushing on the next morning is how damage starts.'),
    Q('Shouting at a concert the night before a gig is:', 'a real risk to the folds and the next day’s voice', ['fine if you warm up after', 'good practice for belting', 'only a problem for sopranos'], 'The folds slam together.', 'Shouting makes the folds collide hard with little control. One loud night can leave you hoarse for days — exactly when you need the voice.'),
    Q('Straw phonation helps because:', 'the straw’s back-pressure lets the folds vibrate with less effort', ['it makes you sing louder', 'it dries the throat', 'it is a breathing exercise only'], 'A gentle massage for the folds.', 'Humming sirens through a thin straw builds a little pressure above the folds, which cushions them. It is the quickest fix for a tired voice.'),
  ],
  /* ---------------- Pitch & the Ear */
  notes: [
    Q('How many letter names does music use?', '7 — A B C D E F G', ['12', '8', '26'], 'Then they repeat.', 'The musical alphabet is A to G; after G comes A again, an octave higher.'),
    Q('After G, the musical alphabet:', 'starts over at A', ['continues to H', 'stops', 'goes to G♯ and ends'], 'Only seven letters.', 'A B C D E F G, then A again. There is no H in standard naming.'),
    Q('Two notes an octave apart:', 'share the same letter name — one vibrates exactly twice as fast', ['have different letter names', 'are a half step apart', 'always clash'], 'Same name, higher.', 'An octave is twelve half steps. The upper note vibrates twice as fast as the lower, which is why the ear hears them as the same note.'),
    () => { const m = 48 + rnd(36), n = midiName(m); return {q: `The note ${n}: which octave number does it belong to?`, a: String(Math.floor(m / 12) - 1), opts: shuffle([String(Math.floor(m / 12) - 1), ...sample(['1', '2', '3', '4', '5', '6'].filter(x => x !== String(Math.floor(m / 12) - 1)), 3)]), hint: 'The number after the letter.', why: `Octave numbers run from C to B: C4 is middle C, so ${n} sits in octave ${Math.floor(m / 12) - 1}. The number changes at every C, not at every A.`}; },
    Q('Middle C is written:', 'C4', ['C3', 'C5', 'C0'], 'Near the middle of a piano.', 'Middle C is C4 — the C nearest the centre of a piano keyboard. A4 is the 440 Hz tuning note just above it.'),
    Q('The tuning note A4 vibrates at:', '440 times a second', ['100 times a second', '1000 times a second', '440 times a minute'], 'Hertz = cycles per second.', 'A4 = 440 Hz is the standard reference. Each octave up doubles it: A5 is 880 Hz.'),
    Q('Which note sits a half step below C?', 'B', ['B♭', 'C♯', 'D'], 'There is no B♯ in normal naming.', 'B and C are only a half step apart — one of the two places in the alphabet with no note in between. E–F is the other.'),
    () => { const pc = rnd(12), a = SH[pc]; return {q: `Which note is this? Listen, then compare it with the C you hear first.`, a, opts: noteOpts(a), hint: `Count half steps up from C: this one is ${pc} away.`, why: `C and then ${pc} half step${pc === 1 ? '' : 's'} higher is ${a}. Counting half steps from a known note is how you name any pitch.`, play: () => hearPair(60, 60 + pc)}; },
  ],
  steps: [
    Q('A half step is:', 'the smallest distance between two notes — one piano key to the next', ['two piano keys', 'half a beat', 'the gap between two octaves'], 'Also called a semitone.', 'A half step (semitone) is the smallest step in Western music. C to C♯ and E to F are both half steps.'),
    Q('A whole step is:', 'two half steps', ['one half step', 'three half steps', 'half an octave'], 'Two of the smallest moves.', 'A whole step (tone) is two half steps — C to D, or F to G.'),
    Q('Between which pairs of natural notes is there no note in between?', 'E–F and B–C', ['C–D and F–G', 'A–B and D–E', 'G–A and E–F'], 'The two half steps in the white keys.', 'E to F and B to C are already a half step apart, so no sharp or flat sits between them. Everywhere else there is one.'),
    Q('A sharp (♯) raises a note by:', 'one half step', ['one whole step', 'an octave', 'nothing — it is a rhythm sign'], 'Sharp = up.', 'F♯ is one half step above F. A flat (♭) does the opposite: B♭ is one half step below B.'),
    Q('A flat (♭) lowers a note by:', 'one half step', ['one whole step', 'two half steps', 'a third'], 'Flat = down.', 'B♭ is one half step below B — the same key on a piano as A♯. Which name you use depends on the key you are in.'),
    Q('C♯ and D♭ are:', 'the same pitch with two names', ['a half step apart', 'a whole step apart', 'in different octaves'], 'One black key.', 'They are enharmonic: the same sound spelled two ways. The key decides the spelling — sharps in sharp keys, flats in flat keys.'),
    () => { const pc = rnd(12), up = 1 + rnd(2), a = SH[(pc + up) % 12]; return {q: `A ${up === 1 ? 'half' : 'whole'} step above ${SH[pc]} is:`, a, opts: noteOpts(a), hint: `${up === 1 ? 'One' : 'Two'} half step${up === 1 ? '' : 's'} up.`, why: `${SH[pc]} up ${up} half step${up === 1 ? '' : 's'} is ${a}. Remember E–F and B–C have nothing between them.`}; },
    () => { const pc = rnd(12), dn = 1 + rnd(2), a = SH[(pc - dn + 12) % 12]; return {q: `A ${dn === 1 ? 'half' : 'whole'} step below ${SH[pc]} is:`, a, opts: noteOpts(a), hint: 'Count down.', why: `${SH[pc]} down ${dn} half step${dn === 1 ? '' : 's'} is ${a}.`}; },
    Q('How many half steps make an octave?', '12', ['7', '8', '10'], 'Count the piano keys from C to C.', 'An octave contains twelve half steps — seven white keys and five black.'),
  ],
  matching: [
    () => { const r = rootMid(), d = [-7, -5, -3, -2, 0, 2, 3, 5, 7][rnd(9)], a = d > 0 ? 'Higher' : d < 0 ? 'Lower' : 'The same'; return {q: 'Listen. Is the second note higher, lower, or the same as the first?', a, opts: shuffle(['Higher', 'Lower', 'The same']), hint: 'Hum the first note, then the second.', why: `The second note was ${a.toLowerCase()}${d ? ` — ${Math.abs(d)} half step${Math.abs(d) === 1 ? '' : 's'} ${d > 0 ? 'up' : 'down'}` : ''}. Hearing direction is the first half of matching pitch.`, play: () => hearPair(r, r + d)}; },
    () => { const r = rootMid(), n = 1 + rnd(4); return {q: 'Listen. How many different notes do you hear?', a: String(n), opts: shuffle(['1', '2', '3', '4']), hint: 'Count each change of pitch.', why: `There were ${n} note${n === 1 ? '' : 's'}. Counting notes trains the ear to hear each pitch as its own event.`, play: () => { audio(); const t = A.ctx.currentTime + .03; for (let i = 0; i < n; i++) sing(r + [0, 4, 7, 12][i], t + i * .55, .5); }}; },
    () => { const r = rootMid(), same = Math.random() < .5, d = same ? 0 : [1, -1, 2, -2][rnd(4)]; return {q: 'Listen. Are these two notes exactly the same pitch?', a: same ? 'Yes, the same' : 'No, slightly different', opts: shuffle(['Yes, the same', 'No, slightly different']), hint: 'Listen for a beat or a shade of difference.', why: same ? 'They were identical. Matching a note exactly is unison — the hardest thing to do perfectly in tune.' : `They were ${Math.abs(d)} half step${Math.abs(d) === 1 ? '' : 's'} apart. Close is not the same; the ear hears even a quarter of that.`, play: () => hearPair(r, r + d)}; },
    Q('Before you sing a note you have heard, you should:', 'hear it inside your head first, then sing', ['sing immediately and adjust', 'sing it an octave down', 'hum a different note'], 'Audiation.', 'Imagining the pitch before you make it — audiation — is the skill under pitch matching, harmony and sight-singing. Hear it, then sing it.'),
    Q('When a teacher says you are “flat”, your note is:', 'a little too low', ['a little too high', 'too quiet', 'too breathy'], 'Flat = under.', 'Flat means under the pitch; sharp means over it. Most tired or under-supported singing goes flat.'),
    Q('The usual fix for singing flat is:', 'more energy in the breath and a lifted, brighter vowel', ['less air', 'singing quieter', 'closing the mouth'], 'Flat is usually under-powered.', 'Flat notes most often come from sagging air. More support and a brighter, more forward vowel lift the pitch without pushing.'),
    Q('Singing sharp usually comes from:', 'pushing too much air or tension in the throat', ['too little breath', 'a dark vowel', 'singing too low'], 'Sharp is usually over-pushed.', 'Forcing air raises the pitch. Ease the push, release the jaw and let the note sit rather than driving it.'),
    Q('The Pitch Lab shows cents. One cent is:', 'one hundredth of a half step', ['one beat', 'one half step', 'one hertz'], 'Hundred to the half step.', 'A half step is 100 cents. Within about ±10 cents the ear hears “in tune”; ±50 is halfway to the next note.'),
    () => { const r = rootMid(), d = 1 + rnd(11), a = SH[(r + d) % 12]; return {q: `You hear ${midiName(r)}, then a second note. The second note is:`, a, opts: noteOpts(a), hint: `It is ${d} half step${d === 1 ? '' : 's'} higher.`, why: `${midiName(r)} up ${d} half steps is ${a}. Naming a note from a known one is counting half steps.`, play: () => hearPair(r, r + d)}; },
  ],
  solfege: [
    Q('The solfège syllables for the major scale are:', 'do re mi fa sol la ti', ['do re mi fa so la si', 'A B C D E F G', 'one two three four five six seven'], 'The Sound of Music.', 'Do re mi fa sol la ti (then do again) name the seven degrees of any major key.'),
    Q('In movable-do solfège, “do” is always:', 'the tonic of whatever key you are in', ['the note C', 'the lowest note you can sing', 'the first note of the song'], 'It moves with the key.', 'Movable do makes every key feel the same: do is home. A tune learned as do-mi-sol in C is do-mi-sol in G too.'),
    () => { const i = rnd(7); return {q: `The ${ORD[i]} degree of a major scale is sung as:`, a: SOL[i], opts: solOpts(SOL[i]), hint: 'Count up from do.', why: `Degree ${i + 1} is ${SOL[i]}: do re mi fa sol la ti in order.`}; },
    () => { const i = rnd(7); return {q: `“${SOL[i]}” is which degree of the major scale?`, a: ORD[i], opts: shuffle([ORD[i], ...sample(ORD.filter(x => x !== ORD[i]), 3)]), hint: 'do re mi fa sol la ti.', why: `${SOL[i]} is the ${ORD[i]} degree.`}; },
    () => { const k = KEYS[rnd(12)], i = rnd(7), a = D.keyScales[k][i]; return {q: `In the key of ${k} major, “${SOL[i]}” is the note:`, a, opts: shuffle([a, ...sample(SH.filter(x => x !== a && pcof(x) !== pcof(a)), 3)]), hint: `do is ${k}; count up.`, why: `${k} major runs ${D.keyScales[k].join(' ')}, so ${SOL[i]} (degree ${i + 1}) is ${a}.`}; },
    Q('A lowered 3rd (the minor third) is sung as:', 'me', ['mi', 'ma', 'ri'], 'Flattened syllables take an “e” vowel.', 'Lowered notes change vowel: me (♭3), le (♭6), te (♭7), ra (♭2), se (♭5). Raised ones: di, ri, fi, si, li.'),
    Q('The raised 4th (fi) appears in which scale?', 'Lydian', ['Dorian', 'Natural minor', 'Major pentatonic'], 'The dreamy, floating mode.', 'Lydian is the major scale with a ♯4 — do re mi fi sol la ti. That one note is its whole character.'),
    () => { const S = _SC[1 + rnd(_SC.length - 1)]; return {q: `Which scale is sung “${S.solfege.join(' ')}”?`, a: S.name, opts: shuffle([S.name, ...sample(_SC.filter(x => x !== S).map(x => x.name), 3)]), hint: `Count the syllables and look for the lowered ones.`, why: `${S.name}: ${S.blurb}.`, play: () => { audio(); const t = A.ctx.currentTime + .03; S.steps.forEach((s, i) => sing(60 + s, t + i * .4, .36)); sing(72, t + S.steps.length * .4, .5); }}; },
    Q('Why do singers bother with solfège instead of letter names?', 'it names each note by its job in the key, which is what the ear actually hears', ['it is easier to spell', 'letter names are only for pianists', 'it is required for opera'], 'Function, not label.', 'The ear hears “the fifth of the key”, not “G”. Solfège matches that, so a part learned by syllable transfers to any key.'),
  ],
  intervalname: [
    () => { const x = _IV[1 + rnd(12)]; return {q: `How many half steps are in a ${x[1].toLowerCase()}?`, a: String(x[0]), opts: shuffle([String(x[0]), ...sample(_IV.filter(y => y !== x).map(y => String(y[0])), 3)]), hint: `The short name is ${x[2]}.`, why: `A ${x[1].toLowerCase()} spans ${x[0]} half steps — ${x[5]}.`}; },
    () => { const x = _IV[1 + rnd(12)]; return {q: `${x[0]} half steps up is which interval?`, a: x[1], opts: ivOpts(x[1]), hint: x[5] + '.', why: `${x[0]} half steps is a ${x[1].toLowerCase()} (${x[2]}).`}; },
    Q('An interval is:', 'the distance between two notes', ['a type of chord', 'a rest between phrases', 'a scale'], 'Distance.', 'An interval is the gap between two pitches, counted in letters (a third, a fifth) and measured in half steps.'),
    Q('A third is called a third because:', 'it spans three letter names, counting both ends — C D E', ['it has three half steps', 'it is the third note of the song', 'it takes three beats'], 'Count the letters.', 'Intervals are named by letters: C to E covers C, D, E — three letters, a third. Whether it is major or minor depends on the half steps inside.'),
    Q('A major third and a minor third differ by:', 'one half step — 4 versus 3', ['one whole step', 'an octave', 'nothing'], 'One half step changes the mood.', 'Major third = 4 half steps (bright); minor third = 3 (soft, sad). That single half step is the whole difference between a major and a minor chord.'),
    Q('The interval C up to G is:', 'a perfect fifth', ['a perfect fourth', 'a major sixth', 'an octave'], 'C D E F G — five letters.', 'C to G is a perfect fifth: five letters, seven half steps — the “Twinkle, Twinkle” leap.'),
    () => { const pc = rnd(12), x = _IV[[3, 4, 5, 7, 9, 12][rnd(6)]], a = SH[(pc + x[0]) % 12]; return {q: `A ${x[1].toLowerCase()} above ${SH[pc]} is:`, a, opts: noteOpts(a), hint: `${x[0]} half steps up.`, why: `${SH[pc]} up ${x[0]} half steps is ${a}. Count the keys, including the black ones.`}; },
    Q('Which interval is exactly half an octave?', 'the tritone (6 half steps)', ['the perfect fifth', 'the major third', 'the minor sixth'], 'Six and six.', 'Six half steps sit exactly in the middle of the twelve. The tritone sounds unstable and wants to resolve.'),
    Q('Which of these intervals sound settled (consonant)?', 'octaves, fifths, thirds and sixths', ['seconds and sevenths', 'the tritone', 'none of them'], 'The harmony intervals.', 'Consonant intervals rest; dissonant ones (seconds, sevenths, the tritone) pull. Vocal harmony is mostly thirds and sixths for that reason.'),
  ],
  intervalear: [
    () => { const r = rootMid(), x = _IV[1 + rnd(12)]; return {q: 'Listen: a note, then a higher note. Which interval is it?', a: x[1], opts: ivOpts(x[1]), hint: `Cue: ${x[3]}.`, why: `That was a ${x[1].toLowerCase()} — ${x[0]} half steps, ${x[5]}. Cue song going up: ${x[3]}.`, play: () => hearPair(r, r + x[0])}; },
    () => { const r = rootMid() + 10, x = _IV[[2, 3, 4, 5, 7, 8, 9, 12][rnd(8)]]; return {q: 'Listen: a note, then a lower note. Which interval is it?', a: x[1], opts: ivOpts(x[1]), hint: `Cue going down: ${x[4]}.`, why: `A ${x[1].toLowerCase()} downward — ${x[0]} half steps. Cue: ${x[4]}.`, play: () => hearPair(r, r - x[0])}; },
    () => { const r = rootMid(), maj = Math.random() < .5; return {q: 'Listen: two notes. Is the gap a major third (bright) or a minor third (sad)?', a: maj ? 'Major third' : 'Minor third', opts: shuffle(['Major third', 'Minor third']), hint: 'Major = “When the Saints”; minor = “Greensleeves”.', why: `${maj ? 'Major: four half steps, bright.' : 'Minor: three half steps, soft and dark.'} One half step is the whole mood.`, play: () => hearPair(r, r + (maj ? 4 : 3))}; },
    () => { const r = rootMid(), maj = Math.random() < .5; return {q: 'Listen: a chord. Major or minor?', a: maj ? 'Major' : 'Minor', opts: shuffle(['Major', 'Minor']), hint: 'Bright or sad?', why: `${maj ? 'Major — the third is four half steps above the root.' : 'Minor — the third is three half steps above the root.'}`, play: () => hearChord([r, r + (maj ? 4 : 3), r + 7])}; },
    () => { const x = _IV[[3, 4, 5, 7, 9, 12][rnd(6)]]; return {q: `Which interval does “${x[3].split(' (')[0]}” start with, going up?`, a: x[1], opts: ivOpts(x[1]), hint: 'Sing the first two notes.', why: `${x[3]} opens with a rising ${x[1].toLowerCase()}. Cue songs are how singers find intervals on stage.`}; },
    () => { const r = rootMid(), fifth = Math.random() < .5; return {q: 'Listen: is this an octave or a perfect fifth?', a: fifth ? 'Perfect fifth' : 'Octave', opts: shuffle(['Perfect fifth', 'Octave']), hint: 'An octave sounds like the same note; a fifth is hollow and open.', why: fifth ? 'A perfect fifth: seven half steps, “Twinkle, Twinkle”.' : 'An octave: twelve half steps, “Somewhere Over the Rainbow”.', play: () => hearPair(r, r + (fifth ? 7 : 12))}; },
    () => { const r = rootMid(), up = Math.random() < .5, d = 2 + rnd(6); return {q: 'Listen: did the second note go up or down?', a: up ? 'Up' : 'Down', opts: shuffle(['Up', 'Down']), hint: 'Hum both.', why: `It went ${up ? 'up' : 'down'} ${d} half steps.`, play: () => hearPair(r, r + (up ? d : -d))}; },
    Q('The best way to learn to hear intervals is:', 'tie each one to the opening of a song you already know', ['memorise the half-step numbers only', 'listen to them once', 'avoid singing them'], 'Cue songs.', 'The ear remembers tunes better than numbers. Link each interval to a familiar opening, then sing the opening to find the interval.'),
  ],
  /* ---------------- Tone & Words */
  vowels: [
    Q('The five pure Italian vowels are:', 'i e a o u (ee, eh, ah, oh, oo)', ['a e i o u y', 'ah, oh, oo only', 'the vowels of the word “education”'], 'The singer’s toolkit.', 'Italian vowels are pure — one shape, no glide — which is why singers train on them. English vowels are mixtures and glides of these five.'),
    Q('Why does the vowel matter more than the consonant?', 'the vowel carries the pitch, the tone and the time; consonants are brief', ['consonants cannot be sung', 'vowels are louder', 'the audience only hears vowels'], 'What lasts?', 'A sung syllable is almost all vowel. Get the vowel pure and steady and the note is pure and steady; the consonants just bracket it.'),
    Q('The word “say” sung long is a problem because:', 'it glides from “eh” to “ee” — hold the first vowel, add the glide at the end', ['it has no vowel', 'it is too short', 'it is a consonant'], 'Diphthong.', 'English “ay” is two vowels. Sing the open “e” for the length of the note and close to “ee” only at the last moment.'),
    Q('The darkest vowel, easiest for high notes, is:', '“oo” [u]', ['“ee” [i]', '“ah” [a]', '“eh” [ɛ]'], 'Lips rounded, small.', '“oo” keeps the larynx low and the space tall, which is why exercises take the top notes on it before opening to “ah”.'),
    Q('Modifying a vowel on a high note means:', 'shading it toward a nearby, easier vowel so the note stays free', ['singing the wrong word', 'making it louder', 'adding vibrato'], 'A touch of “uh” or “oh”.', 'On top notes a pure “ee” or “ah” tightens; shading toward “ih” or “uh” keeps the space open. The audience hears the word; you feel the ease.'),
    () => { const w = D.vowels[rnd(7)]; return {q: `Which word has the vowel [${w.ipa}]?`, a: w.word, opts: shuffle([w.word, ...sample(D.vowels.filter(x => x !== w).map(x => x.word), 3)]), hint: w.tip, why: `[${w.ipa}] is the vowel of “${w.word}” — ${w.tip}.`}; },
    Q('The schwa [ə] is:', 'the neutral “uh” of unstressed syllables', ['a bright “ee”', 'a consonant', 'an Italian vowel'], 'The most common English vowel.', 'Every unstressed English syllable tends to the schwa (the “a” in “about”). Sing it as a relaxed “uh”, never a pinched “ih”.'),
    Q('Keeping the same vowel on every note of a scale trains:', 'a steady tone while the pitch moves', ['diction', 'vibrato', 'breath control only'], 'One shape, many notes.', 'If the mouth keeps changing as the pitch rises, the tone changes with it. The five-note scale on “mah” is about holding one shape.'),
  ],
  resonance: [
    Q('“Forward placement” means the sound seems to sit:', 'in the mask of the face, behind the nose and cheeks', ['deep in the throat', 'in the chest only', 'on the tip of the tongue'], 'A sensation, not a location.', 'A forward sound rings in the face and carries without volume. The “nay” and “ng” exercises find it.'),
    Q('A sound that sits in the throat is:', 'swallowed and does not carry, however loud', ['the richest tone', 'good for high notes', 'ideal for choirs'], 'Push does not help.', 'Throaty tone is trapped; it tires the singer and still sounds small in the room. Bring it forward instead of louder.'),
    Q('Humming on “ng” (as in “sing”) is useful because:', 'it puts the buzz in the face so you can feel the placement', ['it is loud', 'it closes the throat', 'it is a breathing exercise'], 'Feel the nose and lips tingle.', '“ng” sends all the sound through the nose, so the face buzzes. Open to a vowel keeping that buzz and the tone stays forward.'),
    Q('The resonators of the voice are:', 'the throat, mouth and nasal spaces', ['the lungs and diaphragm', 'the vocal folds', 'the chest bones'], 'Above the folds.', 'The spaces above the folds amplify and colour the buzz. Their shape — jaw, tongue, soft palate — is most of what we call tone.'),
    Q('A lifted soft palate gives:', 'a taller, more open tone that stays out of the nose', ['a nasal tone', 'a quieter tone', 'a lower pitch'], 'The beginning of a yawn.', 'Lifting the velum opens the space and shuts the nasal port, so the tone is round and ringing rather than honky.'),
    Q('The “nay” exercise sounds bratty on purpose because:', 'the bright, nasal edge is the forward placement you then carry into clean singing', ['teachers enjoy it', 'it is a joke', 'it protects the folds'], 'Ugly now, clean later.', 'Exaggerating the forward buzz makes it easy to feel. Afterwards you keep the ring and drop the brattiness.'),
    Q('Opening the mouth wider always makes the tone:', 'not necessarily better — space inside matters more than the jaw', ['louder and better', 'higher', 'darker'], 'Inside, not outside.', 'A dropped jaw helps only if the inside space is open and the tongue free. A huge mouth with a tight throat is still a tight sound.'),
    Q('Where should the tongue tip rest on an open vowel?', 'gently against the lower front teeth', ['pulled back into the throat', 'curled upward', 'pressed to the roof of the mouth'], 'Relaxed and forward.', 'A tongue pulled back blocks the throat and darkens everything. Resting the tip behind the lower teeth keeps the space open.'),
  ],
  diction: [
    Q('Consonants in singing should be:', 'quick, clear and placed, so they do not steal time from the vowel', ['as long as the vowel', 'left out for a smooth line', 'whispered'], 'Brief brackets.', 'A consonant is a moment; the vowel is the note. Clear consonants make the words land; long ones chop the line.'),
    Q('Two singers sound “sloppy” to an audience mostly because:', 'their consonants start and end at different times', ['they breathe at the same time', 'they sing the same vowel', 'they are too quiet'], 'Ragged t and s.', 'Ears are sharp for consonants. One late “t” or a hissing “s” that trails off is what listeners hear as untidy.'),
    Q('A final “s” on a held word should be:', 'placed together, short, at the very end', ['sustained with the note', 'dropped', 'turned into “z”'], 'Agree where it goes.', 'The sibilant goes on the last fraction of the note, together. Any earlier and it hisses over the harmony.'),
    Q('The letter “r” in classical and most sung English is:', 'softened or flipped, never a hard growled “rrr”', ['sung as loudly as possible', 'left as in speech', 'always rolled'], 'A hard r closes the throat.', 'The American hard “r” pulls the tongue back and darkens the vowel before it. Soften it, or flip it lightly, and sing the vowel.'),

    Q('A “tenuto” mark over a note means:', 'hold it its full length, lean on it slightly', ['sing it short', 'skip it', 'sing it an octave up'], 'Leaned, not clipped.', 'Tenuto asks for the note’s whole value with a little weight. Staccato (a dot) asks for the opposite: short and separated.'),

  vibrato: [
    Q('Healthy vibrato is:', 'a gentle, regular wobble of pitch that happens on its own in a free voice', ['a wobble you make with the jaw', 'a trill between two notes', 'a sign of a tired voice'], 'About six times a second.', 'Vibrato appears when the folds and the breath are free and balanced. It should happen, not be made.'),
    Q('A healthy vibrato wobbles roughly:', '5 to 7 times a second', ['once a second', '20 times a second', 'as fast as possible'], 'Count it on a held note.', 'Slower than about 5 is a wobble; faster than 7 is a bleat. Both usually mean tension somewhere.'),

  transpose: [

    Q('A song sits too high for you. The right fix is:', 'ask for it in a lower key', ['strain for the notes', 'sing every high phrase an octave down', 'skip those lines'], 'It is not a flaw in you.', 'Too high or too low is the wrong key, not a weak singer. A step or two down and the same song fits.'),

  /* ---------------- Singing with Others */

    Q('A third below the melody sounds:', 'darker, and it stays out of the melody’s way', ['identical to a third above', 'brighter than above', 'like an octave'], 'Under the tune.', 'The third below sits under the lead, so the melody stays on top where the ear wants it. It is the usual choice for a lower voice.'),
    Q('When you are learning a harmony part you should sing it:', 'alone, all the way through, without the melody in your ear', ['only together with the melody', 'an octave up', 'only on the chorus'], 'Leaning is not learning.', 'If you cannot sing the part alone, you are leaning on the melody and will slide onto it live. Learn it alone, then test it against the tune.'),

    Q('Singing the melody an octave higher or lower is:', 'not a harmony — a thickening (doubling)', ['the richest harmony', 'a sixth', 'wrong'], 'Same note, different height.', 'Octaves add weight and shimmer but no new note. Great for a big chorus; it is doubling, not harmony.'),
    Q('A drone (pedal) harmony is:', 'one note held while the chords move under it', ['a fast run', 'the melody an octave down', 'a third above'], 'The easiest part to sing.', 'Hold a note the melody is not on and stay as long as the chords contain it. Drone first, move later.'),
    Q('The shortcut harmony that usually works is:', 'hold one note while the melody moves, starting on a note the melody is not on', ['copy the melody a half step up', 'sing the bass line', 'hum the whole time'], 'Drone first.', 'A held chord tone sounds like harmony with none of the risk of parallel thirds. Move only when the chord no longer holds your note.'),
    Q('If the third above runs off the top of your range:', 'flip to the sixth above or the third below for that phrase', ['strain for it', 'drop out', 'sing it an octave down and keep going there'], 'A part sung easily beats the part you planned.', 'Switch sides of the melody for the phrase, or drop the part an octave. Do not strain — the ear hears strain before it hears a wrong note.'),

    Q('A harmony note sounds sour on one word. The usual reason is:', 'the chord changed underneath and the note did not', ['the singer is flat', 'the vowel is wrong', 'the note is too high'], 'The note is not wrong; the chord moved.', 'Every scale note is a chord tone of some chord, which is why a line is perfect in one bar and sour in the next. Check that bar against the chord.'),
    Q('Non-chord tones are fine when:', 'they pass through between beats and keep moving', ['never', 'they are held on the beat', 'they are sung loudly'], 'The ear forgives motion.', 'The ear only judges what it is left holding. Passing notes between beats are how parts move smoothly from chord tone to chord tone.'),

    Q('How many chords in a major key contain any given scale note?', 'three', ['one', 'seven', 'none'], 'As root, as third, as fifth.', 'Each scale note is the root of one chord, the third of another and the fifth of a third. That is why a held note can last through several changes.'),
    Q('When moving between chords, a harmony singer should:', 'move the smallest distance, and stay put if the next chord holds the same note', ['always jump to the new root', 'copy the melody', 'go up a third every time'], 'Smallest move wins.', 'Voice leading: if your note is in the next chord, keep it; if not, step to the nearest chord tone. Big leaps sound like a second melody.'),

  motions: [
    Q('Parallel motion is:', 'both voices move the same way, the same distance', ['one voice holds while the other moves', 'the voices move in opposite directions', 'both voices sing the same note'], 'Easy and thin.', 'Parallel thirds all the way is the beginner harmony: easy to sing, but thin — it sounds like one voice with a shadow.'),
    Q('Contrary motion is:', 'the voices move in opposite directions', ['both go up', 'one holds', 'both sing the melody'], 'The strongest.', 'Contrary motion sounds like two people, not a shadow. A single contrary step at the end of a phrase makes a harmony come alive.'),

    Q('Similar motion is:', 'both voices move the same direction but by different distances', ['both move the same distance', 'opposite directions', 'one voice holds'], 'Same way, changing gap.', 'Similar motion keeps the direction but changes the interval — a third becomes a fourth, say. More interesting than parallel, easier than contrary.'),
    () => { const mo = D.motions[rnd(4)]; return {q: `Listen to two voices. Which motion is this?`, a: mo.name, opts: shuffle(D.motions.map(m => m.name)), hint: mo.blurb + '.', why: `${mo.name}: ${mo.blurb}.`, play: () => { audio(); const t = A.ctx.currentTime + .03; mo.m.forEach((s, i) => { sing(stepMidi('C', s), t + i * .55, .5, {gain: .22}); sing(stepMidi('C', mo.h[i]), t + i * .55, .5, {gain: .22}); }); }}; },
    Q('A harmony that is “thin” usually needs:', 'a held note or a contrary step somewhere instead of parallel thirds throughout', ['more volume', 'more vibrato', 'a higher key'], 'Break the parallel.', 'Parallel thirds the whole way blur into one thick voice. One held note or one opposite move and two people appear.'),
    Q('The harmony “crossing” above the melody is a problem because:', 'the ear follows the top voice, so it loses the tune', ['it is out of the key', 'it is too quiet', 'it is illegal in choirs'], 'Pick a side.', 'Listeners hear the highest voice as the melody. If the harmony crosses over it, the tune seems to change. Stay on one side.'),

  stacks: [
    Q('In a three-voice stack, the three singers sing:', 'the three notes of the triad — nobody doubles the melody', ['the melody in three octaves', 'the melody plus two drones', 'thirds above and below the melody, always'], 'Three parts, three notes.', 'Three singers can sing a whole chord: root, third and fifth. Doubling the melody wastes a voice.'),

    Q('A “close” voicing means:', 'the parts sit within an octave of each other', ['the singers stand close', 'the parts are an octave apart', 'the chord has no third'], 'Tight stack.', 'Close harmony packs the three notes inside one octave — the barbershop and Everly Brothers sound. Open voicing spreads them wider.'),
    Q('Where should the melody usually sit in a three-part stack?', 'wherever its range puts it — top is clearest, middle is warmest', ['always on the top', 'always on the bottom', 'it should not be in the stack'], 'Three choices.', 'Lead on top is clearest; lead in the middle, flanked by a third below and above, is the warmest classic trio sound.'),
    Q('The highest voice in a stack is heard as:', 'the melody, whatever part it really is', ['the harmony', 'the bass', 'background'], 'Top wins.', 'Ears follow the top line. If a harmony sits above the tune, the audience hears it as the tune; plan the stack with that in mind.'),

    Q('Three voices in unison are:', 'one note, three times — strong, but not a chord', ['a triad', 'a sixth', 'a drone'], 'Unison is not harmony.', 'Unison thickens and powers a line (a chorus hook), but there is no chord until the voices take different notes.'),

  blend: [
    Q('Two good singers sound bad together most often because:', 'their vowels do not match', ['one is louder', 'they are in different keys', 'they breathe differently'], '“Luv” against “lahv”.', 'The same word needs the same vowel shape in both mouths. Mismatched vowels never blend, however good the tuning.'),

    Q('From highest to lowest, the six common voice types are:', 'soprano, mezzo, alto, tenor, baritone, bass', ['bass, baritone, tenor, alto, mezzo, soprano', 'soprano, alto, tenor, bass, mezzo, baritone', 'tenor, soprano, alto, bass'], 'SATB plus two in between.', 'Soprano · mezzo-soprano · alto · tenor · baritone · bass. Mezzo and baritone are the common middles.'),
    Q('Most trained voices span about:', 'two octaves', ['one octave', 'four octaves', 'half an octave'], 'Not the extremes.', 'Two octaves of usable notes is typical; the famous five-octave claims count whistle tones and vocal fry.'),

    Q('The Pitch Lab’s “find your range” records:', 'only the notes you held steadily', ['every sound you make', 'your speaking voice', 'the notes you play on the keys'], 'Steady notes only.', 'It waits for a note to settle before counting it, so a squeak at the top does not become “your range”.'),

  arrange: [

    Q('The spaces of the treble staff, bottom to top, spell:', 'F A C E', ['E G B D', 'A B C D', 'G A B C'], 'A word.', 'F A C E — the four spaces. Lines and spaces together run E F G A B C D E F up the staff.'),
    Q('Middle C in the treble clef sits:', 'on a short ledger line just below the staff', ['on the bottom line', 'in the first space', 'on the top line'], 'Below.', 'C4 is one ledger line under the treble staff. D4 sits just below the bottom line, E4 on it.'),
    () => { const tgt = [0, 2, 4, 6, 8][rnd(5)], n = _SN.find(x => x.step === tgt); return {q: `Which note sits on the ${ORD[n.step / 2]} line of the treble staff (counting from the bottom)?`, a: n.name[0], opts: shuffle([n.name[0], ...sample('CDEFGAB'.split('').filter(l => l !== n.name[0]), 3)]), hint: 'E G B D F.', why: `Line ${n.step / 2 + 1} is ${n.name[0]} (${n.name}).`, svg: staffSVG([{step: n.step}])}; },
    () => { const tgt = [1, 3, 5, 7][rnd(4)], n = _SN.find(x => x.step === tgt); return {q: `Which note sits in the ${ORD[(n.step - 1) / 2]} space of the treble staff?`, a: n.name[0], opts: shuffle([n.name[0], ...sample('CDEFGAB'.split('').filter(l => l !== n.name[0]), 3)]), hint: 'F A C E.', why: `Space ${(n.step + 1) / 2} is ${n.name[0]} (${n.name}).`, svg: staffSVG([{step: n.step}])}; },
    Q('Moving a note from a line to the space just above it:', 'raises it one letter name', ['raises it an octave', 'does nothing', 'raises it two letters'], 'Line, space, line, space.', 'Each step from line to space (or space to line) is the next letter of the alphabet.'),
  ],
  staffnotes: [
    () => { const n = _SN[rnd(_SN.length)]; return {q: 'Name this note.', a: n.name, opts: shuffle([n.name, ...sample(_SN.filter(x => x !== n).map(x => x.name), 3)]), hint: n.step % 2 ? 'A space: F A C E.' : 'A line: E G B D F.', why: `${n.name}: ${n.step < 0 ? 'on the ledger line below the staff' : n.step > 8 ? 'above the staff' : (n.step % 2 ? `space ${(n.step + 1) / 2}` : `line ${n.step / 2 + 1}`)}.`, svg: staffSVG([{step: n.step}]), play: () => hearNote(n.midi)}; },
    () => { const n = _SN[rnd(_SN.length)]; return {q: 'Name this note (letter only).', a: n.name[0], opts: shuffle([n.name[0], ...sample('CDEFGAB'.split('').filter(l => l !== n.name[0]), 3)]), hint: 'Lines E G B D F, spaces F A C E.', why: `This is ${n.name}.`, svg: staffSVG([{step: n.step}])}; },
    () => { const n = _SN[1 + rnd(_SN.length - 1)]; return {q: `Which picture shows ${n.name}?`, a: 'the highlighted note', opts: ['the highlighted note', 'none of these'], hint: 'Count up from E on the bottom line.', why: `${n.name} is ${n.step % 2 ? `space ${(n.step + 1) / 2}` : n.step < 0 ? 'the ledger line below' : n.step > 8 ? 'above the staff' : `line ${n.step / 2 + 1}`}.`, svg: staffSVG([{step: n.step, label: n.name}], {lit: 0})}; },
    () => { const a = _SN[rnd(6)], b = _SN[6 + rnd(_SN.length - 6)]; return {q: 'Two notes: is the second higher or lower than the first?', a: 'Higher', opts: shuffle(['Higher', 'Lower']), hint: 'Higher on the staff is higher in pitch.', why: `${b.name} sits above ${a.name} on the staff, so it is higher.`, svg: staffSVG([{step: a.step}, {step: b.step}]), play: () => hearPair(a.midi, b.midi)}; },
    () => { const a = _SN[rnd(_SN.length - 2)], b = _SN[_SN.indexOf(a) + 1 + rnd(2)], d = _SN.indexOf(b) - _SN.indexOf(a); return {q: 'How far apart are these two notes?', a: d === 1 ? 'a step (next letter)' : 'a skip (a third)', opts: shuffle(['a step (next letter)', 'a skip (a third)']), hint: 'Line to the next space is a step; line to line is a skip.', why: `${a.name} to ${b.name} is ${d === 1 ? 'a step — adjacent letters' : 'a third — two letters apart, line to line or space to space'}.`, svg: staffSVG([{step: a.step}, {step: b.step}]), play: () => hearPair(a.midi, b.midi)}; },
    Q('A ledger line is:', 'a short extra line for notes above or below the staff', ['a bar line', 'a rest', 'the line the clef sits on'], 'Middle C uses one.', 'When a note runs off the staff, a short line is drawn through or near it so you can still count its position.'),
    Q('Notes on the lines and in the spaces run:', 'up the alphabet, one letter per step', ['in thirds', 'in half steps', 'randomly'], 'E F G A B C D E F.', 'Every move from a line to the next space is the next letter. Counting up from E (bottom line) names anything.'),
  ],
  rhythm: [
    Q('In 4/4, a quarter note lasts:', '1 beat', ['2 beats', 'half a beat', '4 beats'], 'The counting unit.', 'In 4/4 the quarter note gets the beat; four of them fill a bar.'),
    Q('A whole note in 4/4 lasts:', '4 beats — the full bar', ['2 beats', '1 beat', '8 beats'], 'The name says it.', 'A whole note fills the whole bar of 4/4.'),
    Q('A half note lasts:', '2 beats', ['1 beat', '4 beats', 'half a beat'], 'Half of a whole.', 'Half note = 2 beats; two of them fill a 4/4 bar.'),
    Q('Two eighth notes together equal:', 'one quarter note', ['one half note', 'one whole note', 'one sixteenth'], 'Two halves of a beat.', 'Each eighth is half a beat, counted “1 &”. Beamed in pairs they fill one beat.'),
    Q('A dot after a note:', 'adds half the note’s own length', ['doubles it', 'makes it staccato', 'repeats it'], 'Half again.', 'A dotted half = 2 + 1 = 3 beats; a dotted quarter = 1 + ½ = 1½ beats.'),
    Q('A dotted half note lasts:', '3 beats', ['2½ beats', '4 beats', '2 beats'], '2 plus half of 2.', 'Half note (2) plus its half (1) = 3 beats — a full bar of 3/4.'),
    Q('A tie joining two notes of the same pitch means:', 'hold them as one unbroken note', ['sing them twice', 'slide between them', 'sing the second louder'], 'One attack.', 'A tie adds the lengths together into one held sound; a slur (over different pitches) means sing them smoothly.'),
    Q('A rest is:', 'measured silence — the same lengths as the notes', ['a breath mark', 'a pause of any length', 'the end of the song'], 'Silence has a value.', 'Whole, half, quarter and eighth rests last as long as the notes of the same name. Count them; do not just wait.'),
    Q('The best way to learn a rhythm is to:', 'clap or speak it on the count before adding the pitch', ['sing it at full speed immediately', 'ignore it until the pitches are right', 'listen once'], 'Rhythm first.', 'Separate the two jobs: get the rhythm in the body by clapping and counting, then put the notes on top.'),
  ],
  time: [
    Q('The top number of a time signature tells you:', 'how many beats are in each bar', ['which note gets the beat', 'the tempo', 'the key'], 'Beats per bar.', 'The top number counts beats per bar; the bottom says which note value is one beat.'),
    Q('The bottom number of a time signature tells you:', 'which note value gets one beat', ['how many bars there are', 'the speed', 'how many singers'], '4 = quarter note.', 'A 4 on the bottom means the quarter note is the beat; an 8 means the eighth note is.'),
    Q('4/4 is:', 'four quarter-note beats per bar — most songs', ['four bars of four', 'a waltz', 'two beats per bar'], 'Common time.', '4/4 (common time, C) is far and away the most used: ONE two three four.'),
    Q('3/4 is the time of:', 'a waltz — ONE two three', ['a march', 'most pop songs', 'a jig'], 'Oom-pah-pah.', '3/4 has three quarter-note beats per bar, with the weight on one.'),
    Q('6/8 is usually felt as:', 'two big beats of three eighths each', ['six equal heavy beats', 'four beats', 'three slow beats'], 'ONE-two-three FOUR-five-six.', '6/8 is compound time: six eighths grouped in threes, felt as two swinging beats — jigs, lullabies, “House of the Rising Sun”.'),
    Q('A tempo of 120 BPM means:', '120 beats per minute — two every second', ['120 notes in the song', '120 bars', 'as fast as possible'], 'Set the metronome to it.', 'BPM counts beats per minute. At 60 each beat is a second; at 120 two a second.'),
    Q('The strongest beat of a bar is usually:', 'the first', ['the last', 'the second', 'they are all equal'], 'The downbeat.', 'Beat one carries the weight; in 4/4 beat three is the secondary accent. Singers lean into the downbeat and lighten the rest.'),
    Q('A pickup (anacrusis) is:', 'a note or two before the first full bar — “Hap-py” in Happy Birthday', ['the last bar', 'a rest at the start', 'a tempo change'], 'Starts before one.', 'Many tunes begin on the beat before the downbeat. Count in so the pickup lands and the downbeat arrives on the bar line.'),
  ],
  keysigs: [
    () => { const k = KEYS[1 + rnd(11)]; return {q: 'This key signature is:', a: k + ' major', opts: shuffle([k + ' major', ...sample(KEYS.filter(x => x !== k), 3).map(x => x + ' major')]), hint: _SIG[k].acc === '♯' ? 'The last sharp is a half step below the key.' : 'The second-to-last flat names the key (one flat alone is F).', why: `${_SIG[k].n} ${_SIG[k].acc === '♯' ? 'sharp' : 'flat'}${_SIG[k].n === 1 ? '' : 's'} (${_SIG[k].notes.join(' ')}) is ${k} major — or its relative, ${_SIG[k].rel} minor.`, svg: staffSVG([], {key: k})}; },
    () => { const k = KEYS[1 + rnd(11)]; return {q: `How many sharps or flats are in this signature?`, a: `${_SIG[k].n} ${_SIG[k].acc === '♯' ? 'sharp' : 'flat'}${_SIG[k].n === 1 ? '' : 's'}`, opts: shuffle([`${_SIG[k].n} ${_SIG[k].acc === '♯' ? 'sharp' : 'flat'}${_SIG[k].n === 1 ? '' : 's'}`, ...sample(KEYS.filter(x => x !== k && _SIG[x].n && `${_SIG[x].n}${_SIG[x].acc}` !== `${_SIG[k].n}${_SIG[k].acc}`), 3).map(x => `${_SIG[x].n} ${_SIG[x].acc === '♯' ? 'sharp' : 'flat'}${_SIG[x].n === 1 ? '' : 's'}`)]), hint: 'Count the symbols after the clef.', why: `${_SIG[k].notes.join(' ')}: ${k} major.`, svg: staffSVG([], {key: k})}; },
    Q('In sharp keys, the key is:', 'a half step above the last sharp', ['the last sharp', 'the first sharp', 'a half step below the last sharp'], 'F♯ → G.', 'One sharp (F♯) is G major; three sharps (last G♯) is A major. Go up a half step from the final sharp.'),
    Q('In flat keys, the key is:', 'the second-to-last flat', ['the last flat', 'the first flat', 'a half step above the last flat'], 'B♭ E♭ → B♭.', 'Two flats (B♭ E♭) is B♭ major; three (B♭ E♭ A♭) is E♭ major. One flat alone is F — the exception to learn.'),
    () => { const k = KEYS[1 + rnd(11)]; return {q: `This signature could also be which minor key?`, a: _SIG[k].rel + ' minor', opts: shuffle([_SIG[k].rel + ' minor', ...sample(KEYS.filter(x => x !== k).map(x => _SIG[x].rel + ' minor'), 3)]), hint: 'The relative minor — three half steps below the major.', why: `${k} major and ${_SIG[k].rel} minor share this signature.`, svg: staffSVG([], {key: k})}; },
    Q('A key signature applies:', 'to every note of that name, in every octave, for the whole piece', ['only to the first bar', 'only to the line it is written on', 'only to the melody'], 'Written once.', 'A sharp in the signature sharpens every F, high or low, until a natural sign or a new signature says otherwise.'),
    Q('An accidental written in the middle of a bar lasts:', 'to the end of that bar', ['for the whole piece', 'for one note only', 'until the next page'], 'Bar lines cancel.', 'A mid-bar sharp, flat or natural applies to that note for the rest of the bar; the bar line resets it.'),
  ],
  sightsing: [
    () => { const steps = [0, 0, 0].map(() => rnd(8)), names = steps.map(s => stepName('C', s)), sol = steps.map(s => SOL[s % 7]); return {q: 'Read these three notes in C major as solfège:', a: sol.join(' '), opts: shuffle([sol.join(' '), ...Array.from({length: 3}, () => [0, 0, 0].map(() => SOL[rnd(7)]).join(' ')).filter(x => x !== sol.join(' ')).slice(0, 3)]).filter((x, i, arr) => arr.indexOf(x) === i), hint: 'do is C, on the ledger line below the staff.', why: `${names.join(' ')} = ${sol.join(' ')}.`, svg: staffSVG(steps.map(s => ({step: staffNote(stepName('C', s) + (s >= 7 ? 5 : 4)).step}))), play: () => { audio(); const t = A.ctx.currentTime + .03; steps.forEach((s, i) => sing(stepMidi('C', s), t + i * .6, .55)); }}; },
    () => { const s = rnd(8), n = staffNote(stepName('C', s) + (s >= 7 ? 5 : 4)); return {q: 'In C major, this note is sung as:', a: SOL[s % 7], opts: solOpts(SOL[s % 7]), hint: 'Count up from do on middle C.', why: `${n.name} is degree ${s % 7 + 1} of C major: ${SOL[s % 7]}.`, svg: staffSVG([{step: n.step}]), play: () => hearNote(n.midi)}; },
    () => { const k = ['G', 'F', 'D'][rnd(3)], s = rnd(7), nm = D.keyScales[k][s], mid = stepMidi(k, s) + (stepMidi(k, 0) < 60 ? 12 : 0), oct = Math.floor(mid / 12) - 1, n = staffNote(nm[0] + oct); return {q: `In ${k} major, this note is sung as:`, a: SOL[s], opts: solOpts(SOL[s]), hint: `do is ${k}.`, why: `${nm} is degree ${s + 1} of ${k} major: ${SOL[s]}.`, svg: staffSVG([{step: n.step}], {key: k}), play: () => hearNote(mid)}; },
    Q('Before sight-singing a piece you should:', 'find do from the key signature and sing the scale once', ['start singing immediately', 'read the words first', 'count the bars'], 'Orient first.', 'Find the key, sing do-re-mi up and down, then every note on the page is a syllable you already know.'),
    Q('When you miss a note while sight-singing:', 'keep going in time; fix it next pass', ['stop and start over', 'go back to the note', 'sing the rest quietly'], 'Rhythm wins.', 'A choir rehearsal does not wait. Stay in time, keep reading, and correct the note the next time through.'),
    Q('Reading a leap, the fastest method is:', 'name both notes as solfège and hear the interval between them', ['count ledger lines', 'guess from the shape', 'hum the first note louder'], 'Syllable to syllable.', 'do up to sol is a fifth you already know. Solfège turns a leap on the page into a familiar interval.'),
    () => { const up = Math.random() < .5, a = up ? [0, 2, 4] : [4, 2, 0]; return {q: 'Which way does this line go?', a: up ? 'Up, in skips (do mi sol)' : 'Down, in skips (sol mi do)', opts: shuffle(['Up, in skips (do mi sol)', 'Down, in skips (sol mi do)']), hint: 'Line to line is a skip.', why: `${a.map(s => stepName('C', s)).join(' ')}: ${up ? 'do mi sol, climbing the C chord' : 'sol mi do, falling down the C chord'}.`, svg: staffSVG(a.map(s => ({step: staffNote(stepName('C', s) + 4).step}))), play: () => { audio(); const t = A.ctx.currentTime + .03; a.forEach((s, i) => sing(stepMidi('C', s), t + i * .55, .5)); }}; },
    Q('Rhythm first, pitch second, means:', 'speak the rhythm on the count before singing the pitches', ['pitches do not matter', 'sing fast and fix later', 'ignore rests'], 'Two jobs, one at a time.', 'Clap and count the line; then add the syllables; then the pitches. Each layer sits on one already secure.'),
  ],
};

/* ---------------- Grit & Screaming Safely — in the spirit of The Zen of Screaming */
QBANK.scream = [
  Q('The roughness in a safe scream or growl comes from:', 'the false cords or vocal fry riding on a clean, supported airflow', ['squeezing the true vocal folds together', 'shouting as loud as possible', 'holding the breath and pushing'], 'Added on top, not forced from inside.', 'Grit sits on top of a clean note: the false cords rattle, or the fry crackles, on steady air. Squeezing the true folds is shouting, and it costs tomorrow’s voice.'),
  Q('Before any scream practice you should:', 'warm up fully with clean exercises first', ['scream quietly for five minutes to loosen up', 'drink something cold', 'skip the warm-up — screaming is its own warm-up'], 'Clean first, always.', 'A scream-ready session is a complete clean warm-up (breath, trills, sirens, syllables), then placement and support, and only then fry and false cords.'),
  Q('Vocal fry is:', 'the creaky, rattling lowest register — the folds vibrating slowly and loosely on almost no air', ['a type of belt', 'singing through the nose', 'a breathing exercise'], 'The creaky-door sound.', 'Fry is harmless in itself and is the source of the fry scream: add a little air and open the throat slightly and the crackle becomes a resonant scream.'),
  Q('The false cords are:', 'folds above the true vocal folds that can rattle on the air without the true folds colliding', ['another name for the diaphragm', 'the true folds when tired', 'the lips'], 'Above, not instead.', 'The false (ventricular) cords do not make pitch; the true folds do. The false cords add the growl over a sung note, so the true folds never slam.'),
  Q('Volume in a scream should come from:', 'resonance and airflow, with the larynx low', ['force in the throat', 'a raised larynx', 'clenching the stomach'], 'The room does the loud.', 'Learn every distorted sound quiet and easy first; resonance and a free, supported airflow make it big. Force makes it small and painful.'),
  Q('If a scream makes you cough or hurts:', 'stop — the engagement is wrong; rest, then find it another way', ['push through, it gets easier', 'drink water and keep going', 'do it louder to clear the throat'], 'Never cough.', 'Coughing or pain means the true folds are taking the hit. Stop, rest, and come back through fry or the gargle at a lower volume.'),
  Q('During distortion the larynx should:', 'stay low and relaxed, as at the start of a yawn', ['rise as high as possible', 'be pressed down with the tongue', 'move with the pitch'], 'Think yawn.', 'A low, relaxed larynx keeps the space open above the folds, which is where the false-cord rattle lives. A rising larynx turns grit into strain.'),
  Q('The first exercise for a fry scream is:', 'a soft, effortless fry on a slow exhale', ['a loud shout', 'the highest note you can sing', 'a long hiss'], 'Lazy “uhhh”.', 'Find the crackle first — bored, quiet, steady. Then add a touch of air and open the throat slightly; the fry becomes the scream without ever being pushed.'),
  Q('After a session of grit you should:', 'cool down with descending slides and keep the talking light', ['scream once more to finish', 'whisper for the rest of the day', 'nothing — it is only screaming'], 'Come back down.', 'Two or three minutes of easy downward slides settle the folds. Heavy use without a cool-down is how hoarseness turns into damage.'),
  Q('The order of a scream-ready session is:', 'breath → clean warm-up → placement and support → fry and false cords → cool-down', ['fry → scream → sing → stretch', 'scream → warm-up → cool-down', 'any order, as long as you drink water'], 'Grit comes late.', 'Grit is added to a warmed, placed, supported voice and taken off again with a cool-down. The Scream-ready plan on the Warm-ups page runs it in that order.'),
  Q('The “hey!” pulses exercise trains:', 'support — the belly kick that powers a scream from the body, not the throat', ['vibrato', 'the false cords', 'diction'], 'Call, don’t shout.', 'Each “hey” flicks the belly in on open air. A scream needs that engine under it; without support, the throat tries to do the work.'),
];

/* ---------------------------------------------------------------- the Index */
PAGES.push({id: 'index', no: 'VI', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--navy)', draw(v) {
  pageScroll = true;
  v.append(header('VI', 'The <em>Index</em>', 'every term the book uses and the ideas behind each lesson', 'browse by topic, or A to Z · tap anything to open it', 'var(--navy)'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));
  }
  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));
}});


// the book's reading order: the course up front, then the practice rooms, then the Index
const PAGE_ORDER = ['cover', 'learn', 'warmups', 'pitch', 'harmony', 'extended', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
