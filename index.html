dy, so the voice is carried rather than pushed.","more":"The belly and lower ribs widen on the in-breath and give way slowly on the out-breath; the throat does none of the work.","see":["diaphragm","posture","messa-di-voce"]},{"id":"diaphragm","term":"Diaphragm","short":"The dome of muscle under the lungs that drops to draw air in.","more":"You cannot feel it directly; you feel the belly and ribs it moves. “Sing from the diaphragm” means breathe low and release slowly.","see":["breath-support"]},{"id":"larynx","term":"Larynx","short":"The voice box: the cartilage housing in the throat that holds the vocal folds.","more":"It should sit comfortably, neither pushed down nor hitched up. A rising larynx on high notes is the usual cause of strain.","see":["vocal-folds","placement"]},{"id":"vocal-folds","term":"Vocal folds","short":"Two small bands of tissue in the larynx that vibrate as air passes — the source of every note.","more":"Faster vibration is higher pitch. They are thick and short in chest voice, thin and stretched in head voice.","see":["larynx","register","pitch"]},{"id":"resonance","term":"Resonance","short":"The amplifying of the folds’ buzz in the throat, mouth and nose — where tone and loudness come from.","more":"Changing the shape of those spaces (vowel, jaw, soft palate) changes the colour of the sound more than the folds do.","see":["placement","vowel"]},{"id":"posture","term":"Posture","short":"A tall, released body: feet grounded, ribs open, head floating, so the breath has room.","more":"","see":["breath-support"]},{"id":"register","term":"Register","short":"A range of notes made with one way of vibrating — chest voice, head voice, falsetto.","more":"The goal is to blend them so no listener hears the seam.","see":["chest-voice","head-voice","mixed-voice","passaggio"]},{"id":"chest-voice","term":"Chest voice","short":"The speaking-range register: thick folds, a full, buzzy sound you feel in the chest.","more":"","see":["register","head-voice","belt"]},{"id":"head-voice","term":"Head voice","short":"The upper register: thin, stretched folds, a lighter ringing sound felt in the head.","more":"Not the same as falsetto — head voice keeps the folds fully closed, so it can be strong.","see":["register","falsetto","mixed-voice"]},{"id":"mixed-voice","term":"Mixed voice","short":"A blend of chest and head: the strength of one with the ease of the other, through the middle of the range.","more":"It is the sound most pop and musical-theatre singing lives in.","see":["chest-voice","head-voice","passaggio"]},{"id":"falsetto","term":"Falsetto","short":"A breathy, light upper register where the folds do not fully close.","more":"Useful as a colour; not a substitute for head voice.","see":["head-voice","register"]},{"id":"passaggio","term":"Passaggio","short":"The break: the few notes where the voice wants to flip from chest to head.","more":"Sirens and lip trills smooth it; narrowing the vowel slightly as you cross it helps.","see":["register","mixed-voice","siren"]},{"id":"vibrato","term":"Vibrato","short":"A gentle, regular wobble of pitch (about 5–7 per second) in a free, supported voice.","more":"It should happen, not be made. A harmony singer uses less of it than the lead.","see":["breath-support","blend"]},{"id":"belt","term":"Belt","short":"Carrying chest-voice power higher than speech, with a bright vowel and strong support.","more":"Safe belting is loud without being tight; if it hurts or you lose the next day’s voice, it was a shout.","see":["chest-voice","mixed-voice"]},{"id":"vowel","term":"Vowel","short":"The open sound of a syllable — the part you actually sing on. Five pure Italian vowels are the singer’s toolkit.","more":"Consonants are short; the vowel carries the pitch, the tone and the time.","see":["diction","resonance","blend"]},{"id":"diction","term":"Diction","short":"Clear, placed consonants that start and end together without stealing time from the vowel.","more":"","see":["vowel","blend"]},{"id":"placement","term":"Placement","short":"Where the sound seems to sit — forward in the mask of the face, or back in the throat. Forward carries.","more":"A sensation, not a physical location: the “nay” and “ng” exercises find it.","see":["resonance","larynx"]},{"id":"tessitura","term":"Tessitura","short":"Where a song mostly sits in your range — the notes you live on, not the extremes.","more":"A song can be in your range and still the wrong tessitura: too many notes near the top tires you.","see":["range","transpose"]},{"id":"range","term":"Range","short":"The lowest to the highest note you can sing well. Most trained voices span about two octaves.","more":"","see":["tessitura","voice-type","octave"]},{"id":"voice-type","term":"Voice type","short":"Soprano, mezzo, alto, tenor, baritone, bass: labels for where a voice sits and how it sounds.","more":"Edges overlap; the label describes the comfortable middle, not the limits.","see":["range","tessitura"]},{"id":"warm-up","term":"Warm-up","short":"Easy, gentle exercises that bring blood, breath and focus to the voice before real singing.","more":"Ten minutes of trills, sirens and five-note scales; never start a song cold.","see":["lip-trill","siren"]},{"id":"lip-trill","term":"Lip trill","short":"A loose “brrr” of the lips on a pitch — the safest warm-up there is.","more":"The lips only buzz when the air is steady, so it trains support by itself.","see":["warm-up","breath-support"]},{"id":"siren","term":"Siren","short":"A smooth slide from low to high and back on one sound, like a fire siren.","more":"It joins the registers and finds the break without fear.","see":["passaggio","warm-up"]},{"id":"messa-di-voce","term":"Messa di voce","short":"One held note that swells from soft to full and fades back, pitch unmoved.","more":"The classic test of control over breath, folds and resonance together.","see":["breath-support","dynamics"]},{"id":"pitch","term":"Pitch","short":"How high or low a note is — how fast the folds vibrate.","more":"Doubling the speed raises the pitch an octave.","see":["note","octave","pitch-matching"]},{"id":"pitch-matching","term":"Pitch matching","short":"Hearing a note and singing exactly that note.","more":"Hear it inside first, then sing; the Pitch Lab shows you how close you are.","see":["pitch","interval"]},{"id":"solfege","term":"Solfège","short":"The syllables do re mi fa sol la ti for the scale degrees, so any key is sung the same way.","more":"Movable do: do is always the tonic. Lowered notes take me, le, te; raised ones di, fi, si.","see":["movable-do","scale","tonic"]},{"id":"movable-do","term":"Movable do","short":"Solfège where do is the tonic of whatever key you are in.","more":"It trains the ear to hear every note by its job in the key, which is exactly what a harmony singer needs.","see":["solfege","key"]},{"id":"melody","term":"Melody","short":"The tune — the line of single notes a listener would hum back.","more":"","see":["harmony","phrase"]},{"id":"harmony","term":"Harmony","short":"Notes sung at the same time as the melody that agree with it — usually a third or sixth away.","more":"Every harmony note is a chord tone of the chord underneath; that is why one interval cannot be held all the way.","see":["third","sixth","chord-tone","blend"]},{"id":"third","term":"Third","short":"The interval two letters up: C to E. Major (4 half steps) is bright, minor (3) is soft.","more":"The default harmony: sing the melody, then step up two notes of the key.","see":["interval","harmony","major-chord","minor-chord"]},{"id":"sixth","term":"Sixth","short":"The interval five letters up: C to A. A third below, lifted an octave.","more":"The sixth above is the sweetest harmony when the third above runs out of range.","see":["interval","third","harmony"]},{"id":"chord-tone","term":"Chord tone","short":"A note that belongs to the chord being played — root, third or fifth. The safe notes for a harmony.","more":"Land on chord tones on the beats; pass through the others between them.","see":["chord","harmony","root"]},{"id":"blend","term":"Blend","short":"Two voices sounding like one: matched vowels, consonants together, less vibrato, the harmony under the lead.","more":"","see":["vowel","vibrato","harmony"]},{"id":"unison","term":"Unison","short":"Two voices on the same note. Not harmony, but the hardest thing to do perfectly in tune.","more":"","see":["interval","octave"]},{"id":"descant","term":"Descant","short":"A high line floating above the melody, usually on the last chorus.","more":"","see":["harmony","countermelody"]},{"id":"countermelody","term":"Countermelody","short":"A second tune of its own, not a shadow of the first.","more":"","see":["melody","descant"]},{"id":"pedal","term":"Pedal (drone)","short":"One note held while the chords move under it — the easiest harmony part to sing.","more":"Start on a note the melody is not on; move only when the chord no longer contains it.","see":["harmony","chord-tone"]},{"id":"suspension","term":"Suspension","short":"Holding a note through a chord change so it clashes, then stepping down to resolve.","more":"","see":["harmony","chord-tone"]},{"id":"parallel-motion","term":"Parallel motion","short":"Both voices move the same way, the same distance — easy and thin.","more":"","see":["contrary-motion","harmony"]},{"id":"contrary-motion","term":"Contrary motion","short":"The voices move in opposite directions — the strongest sound of two people.","more":"","see":["parallel-motion","harmony"]},{"id":"phrase","term":"Phrase","short":"A musical sentence: the notes sung on one breath, with a shape and an end.","more":"Breathe where the phrases end, not where you run out.","see":["breath-support","dynamics"]},{"id":"dynamics","term":"Dynamics","short":"How loud or soft: p (piano, soft) to f (forte, loud), with crescendo growing and decrescendo fading.","more":"","see":["phrase","messa-di-voce"]},{"id":"legato","term":"Legato","short":"Smooth and joined: each note flows into the next with no gap.","more":"","see":["staccato","phrase"]},{"id":"staccato","term":"Staccato","short":"Short and detached: each note separated, a little push of breath each.","more":"","see":["legato","breath-support"]},{"id":"vocal-fry","term":"Vocal fry","short":"The creaky, rattling lowest register: the folds vibrating slowly and loosely on almost no air.","more":"Harmless in itself and the safe source of the fry scream — add air and a slightly opened throat and the rattle becomes a resonant scream.","see":["false-cords","distortion","register"]},{"id":"false-cords","term":"False cords","short":"Two folds of tissue above the true vocal folds. They do not make pitch, but they can rattle on the airflow.","more":"That rattle, over a sung note from the true folds, is the growl and the false-cord scream. The true folds never collide harder than in clean singing.","see":["vocal-fry","distortion","larynx"]},{"id":"distortion","term":"Distortion (grit)","short":"Roughness added on top of a clean, supported tone: rasp, growl, scream.","more":"It comes from the false cords or from fry riding on steady air, with the larynx low. Squeezing the true folds together is shouting, and it costs you the next day’s voice.","see":["vocal-fry","false-cords","breath-support","cool-down"]},{"id":"cool-down","term":"Cool-down","short":"Two or three minutes of easy descending slides after singing, within a few minutes of the last song.","more":"It walks the voice back to speaking range and leaves the folds settled. After grit or a long set it is not optional.","see":["warm-up","siren"]},{"id":"note","term":"Note","short":"A single pitch — one sound at one height, named with the letters A to G.","more":"","see":["pitch","octave"]},{"id":"octave","term":"Octave","short":"The same note higher or lower — twelve half steps apart, vibrating exactly twice as fast.","more":"","see":["note","interval"]},{"id":"half-step","term":"Half step","short":"The smallest move in Western music — one piano key to the next. Also called a semitone.","more":"E to F and B to C are half steps; everywhere else a sharp or flat sits between the letters.","see":["whole-step","interval"]},{"id":"whole-step","term":"Whole step","short":"Two half steps. C to D is a whole step.","more":"The major scale is whole steps with two half steps in it.","see":["half-step","major-scale"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher. F♯ sits between F and G.","more":"Sharps are added in the order F C G D A E B as you go clockwise round the circle of fifths.","see":["flat","accidental","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower. B♭ sits between A and B.","more":"Flats are added in the order B E A D G C F.","see":["sharp","accidental","key-signature"]},{"id":"natural","term":"Natural","short":"A plain letter note with no sharp or flat.","more":"","see":["sharp","flat"]},{"id":"accidental","term":"Accidental","short":"A sharp, flat or natural written beside a note that changes it.","more":"In a key signature they apply all piece long; written mid-bar they last to the end of that bar.","see":["sharp","flat","key-signature"]},{"id":"interval","term":"Interval","short":"The distance between two notes, counted in letters (a third, a fifth) and measured in half steps.","more":"Name the distance and you can hear it coming — and sing it on purpose.","see":["third","fifth","sixth","octave"]},{"id":"fifth","term":"Perfect fifth","short":"Seven half steps — the open, powerful interval of “Twinkle, Twinkle”.","more":"","see":["interval","triad"]},{"id":"tritone","term":"Tritone","short":"Six half steps, exactly half the octave. Unstable; it wants to resolve.","more":"That pull is what gives a dominant 7th chord its drive home.","see":["interval","seventh-chord"]},{"id":"scale","term":"Scale","short":"A set of notes in order that a piece draws from: a home note and its family.","more":"","see":["major-scale","minor-scale","solfege","key"]},{"id":"major-scale","term":"Major scale","short":"Whole-whole-half-whole-whole-whole-half: the bright do-re-mi sound.","more":"Start that pattern on any note and it is major; the pattern makes it, not the starting note.","see":["scale","whole-step","key"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin: a flat 3rd, 6th and 7th. Natural minor is the major scale sung from its 6th note.","more":"","see":["scale","relative-minor"]},{"id":"pentatonic","term":"Pentatonic","short":"A five-note scale with the two half-step tensions removed. Riffs, gospel runs, lullabies.","more":"","see":["scale","major-scale"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note: same notes, different home. Dorian from the 2nd, Mixolydian from the 5th.","more":"","see":["major-scale","scale"]},{"id":"key","term":"Key","short":"The home note of a song plus the scale it lives in — what everything leans toward.","more":"Change the key and the whole song slides up or down together.","see":["tonic","key-signature","transpose","circle-of-fifths"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats at the start of the staff that belong to the key, so they are not written every time.","more":"","see":["key","sharp","flat","circle-of-fifths"]},{"id":"tonic","term":"Tonic","short":"The home note of a key, do in solfège — the one that feels like rest.","more":"","see":["key","solfege"]},{"id":"transpose","term":"Transpose","short":"Moving a whole song up or down into a key that fits a voice. The shapes stay; the pitch moves.","more":"Too high or low is not a flaw in the singer; it is the wrong key.","see":["key","tessitura"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from.","more":"","see":["chord","triad"]},{"id":"chord","term":"Chord","short":"Three or more notes sounding together.","more":"Most are a root with a third and a fifth stacked on it — a triad.","see":["triad","root","chord-tone"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: root, third, fifth. Three singers can sing one.","more":"","see":["chord","third","fifth"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — bright.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — darker. One half step separates it from major.","more":"","see":["triad","third","major-chord"]},{"id":"diminished","term":"Diminished","short":"A tense triad of two stacked minor thirds, marked °. Built on the 7th note of a major key.","more":"","see":["triad","third"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with one more third on top. A dominant 7th (V7) pulls hard back home.","more":"","see":["triad","tritone","cadence"]},{"id":"roman-numerals","term":"Roman numerals","short":"Chords named by their place in the key — I IV V major, ii iii vi minor, vii° diminished — so a progression works in any key.","more":"","see":["progression","key","tonic"]},{"id":"progression","term":"Progression","short":"The sequence of chords under a song — its skeleton, and the map a harmony singer reads.","more":"I–V–vi–IV is the famous four-chord song.","see":["roman-numerals","chord-tone","cadence"]},{"id":"cadence","term":"Cadence","short":"How a phrase lands: V to I feels finished, IV to I feels like “amen”, ending on V leaves it hanging.","more":"","see":["progression","phrase"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys in a ring; each step clockwise is up a fifth and adds one sharp.","more":"Neighbours share almost every note. A key’s V is one step clockwise, its IV one step back.","see":["key","fifth","relative-minor","key-signature"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key sharing a major key’s exact notes, a minor third below. A minor for C major.","more":"","see":["minor-scale","key"]},{"id":"staff","term":"The staff","short":"The five lines music is written on; a note’s height is its pitch.","more":"Singers read the treble clef: the lines E G B D F, the spaces F A C E.","see":["clef","note","time-signature"]},{"id":"clef","term":"Clef","short":"The sign at the start of the staff that says which line is which note. Treble (𝄞) for most voices, bass (𝄢) for low ones.","more":"","see":["staff"]},{"id":"time-signature","term":"Time signature","short":"The two stacked numbers at the start: beats per bar, and which note gets a beat. 4/4 is most songs.","more":"","see":["staff","tempo"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute.","more":"","see":["time-signature"]},{"id":"overtone","term":"Overtone","short":"One of the quiet pure tones stacked inside every sung note, vibrating at 2, 3, 4… times the speed of the note you name.","more":"A vowel is a choice of which overtones to feed. Overtone singers go further and isolate one until it rings like a separate whistle.","see":["harmonic-series","formant","resonance"]},{"id":"harmonic-series","term":"Harmonic series","short":"The fixed ladder of overtones above any note: an octave, then a fifth, then closer and closer rungs.","more":"Its spacing is physics — the same for every voice and every instrument. The upper rungs fall between the piano’s keys, which is part of their shimmer.","see":["overtone","octave","fifth"]},{"id":"fundamental","term":"Fundamental","short":"The lowest tone in a sung note — the pitch you name it by. Everything above it is overtones.","more":"","see":["overtone","pitch","harmonic-series"]},{"id":"formant","term":"Formant","short":"A resonance of the throat and mouth that boosts whichever overtones fall inside it.","more":"Vowels are formant recipes. Slide ee into oo on one note and you are sweeping a formant down the harmonic ladder.","see":["overtone","vowel","resonance"]},{"id":"spectrogram","term":"Spectrogram","short":"A picture of sound: time runs across, frequency runs up, and whatever is loud glows.","more":"A sung note draws a ladder — the fundamental with its overtones above it. The Mirror draws yours live.","see":["overtone","fundamental","harmonic-series"]},{"id":"throat-singing","term":"Throat singing","short":"Singing that carries two or more sounds at once — a held drone and an overtone melody carved out above it.","more":"Best known from Tuva and Mongolia (khoomei) and from Tibetan monastery chant; relatives reach from Sardinian tenores to Inuit vocal games.","see":["khoomei","sygyt","kargyraa","overtone"]},{"id":"khoomei","term":"Khoomei","short":"The central Tuvan style: a steady mid-range drone with its first soft overtones ringing above, like wind over grass.","more":"The word names both this base style and the whole Tuvan family. Everything else grows from it: tighten toward sygyt, drop into kargyraa.","see":["throat-singing","sygyt","kargyraa"]},{"id":"sygyt","term":"Sygyt","short":"The whistle style of Tuvan singing: one high overtone isolated until it pipes like a flute over the drone.","more":"Tuvan for “whistle”. The tongue seals against the palate and leaves one small window; the melody lives on harmonics six to twelve.","see":["throat-singing","khoomei","overtone"]},{"id":"kargyraa","term":"Kargyraa","short":"The underground Tuvan style: the false cords join the true folds at half speed, sounding a full octave below the sung note.","more":"A sung G2 rings as G1 — lower than any true-fold note. Tibetan monastery chant reaches the same register by the same door.","see":["throat-singing","false-cords","subharmonic"]},{"id":"subharmonic","term":"Subharmonic","short":"A tone below the sung note — half the vibration speed, one octave down — made when a second structure joins in at half time.","more":"Kargyraa, Tibetan chant and the lowest choral basses live here. On the Mirror it appears as new rungs between the ladder’s rungs.","see":["kargyraa","vocal-fry","octave"]},{"id":"yodel","term":"Yodel","short":"Singing that leaps across the chest–head break on purpose and lets the flip sound.","more":"The crack every other technique smooths away, kept and celebrated — in Alpine calls, early country, and the polyphony of the Aka and Mbuti.","see":["passaggio","register","kulning"]},{"id":"kulning","term":"Kulning","short":"The Scandinavian herding call: a high, loud head-voice cry built to carry for miles across a valley.","more":"No vibrato, forward placement, pure vowels, nothing held back. A voice used as a beacon.","see":["head-voice","placement","yodel"]},{"id":"ululation","term":"Ululation","short":"A high trill made by flicking the tongue side to side on a held note — celebration and grief across Africa, the Middle East and South Asia.","more":"","see":["kulning","register"]},{"id":"onset","term":"Onset","short":"How a note starts: breath first (aspirate, “hah”), folds first (glottal, a small click) or both together (coordinated, the one you want most of the time).","more":"","see":["vocal-folds","breath-support"]},{"id":"sovt","term":"SOVT (straw phonation)","short":"Semi-occluded vocal tract: singing through a straw, a lip trill or an “ng”. The back-pressure lets the folds vibrate with less effort — the safest warm-up there is.","more":"","see":["lip-trill","warm-up","vocal-folds"]},{"id":"twang","term":"Twang","short":"A bright, narrow sound from tightening the funnel above the folds (the aryepiglottic sphincter). It makes the voice carry without pushing; country, musical theatre and belting lean on it.","more":"","see":["belt","resonance","placement"]},{"id":"cry","term":"Cry (sob quality)","short":"A slightly lowered larynx and a tilted thyroid: the sound of a gentle sob. It thins the folds for high notes and takes the shout out of a belt.","more":"","see":["larynx","belt","mixed-voice"]},{"id":"soft-palate","term":"Soft palate","short":"The soft back of the roof of the mouth. Lifted, it closes off the nose and opens the throat (the yawn); dropped, the sound turns nasal.","more":"","see":["resonance","vowel","placement"]},{"id":"nasality","term":"Nasality","short":"Sound leaking through the nose because the soft palate is down. Pinch your nose on an “ah”: if the tone changes, it was nasal.","more":"","see":["soft-palate","resonance"]},{"id":"vowel-modification","term":"Vowel modification","short":"Nudging a vowel toward a neighbour as the pitch rises — “ee” toward “ih”, “ah” toward “uh” — so the resonance keeps up with the note. Every trained high note does it.","more":"","see":["vowel","passaggio","formant"]},{"id":"whistle-register","term":"Whistle register","short":"The register above head voice, where only the front edge of the folds vibrates: the very top of a soprano. Rare, light, and not for forcing.","more":"","see":["register","head-voice","range"]},{"id":"melisma","term":"Melisma (a run)","short":"Many notes on one syllable — the gospel and R&B run. Learn it slow, as a scale fragment with solfège, before you speed it up.","more":"","see":["solfege","scale","phrase"]},{"id":"portamento","term":"Portamento (a scoop)","short":"Sliding between two notes through every pitch in between. On purpose it is expressive; by accident (scooping up to every note) it reads as unsure of the pitch.","more":"","see":["pitch","siren","legato"]},{"id":"straight-tone","term":"Straight tone","short":"A note held with no vibrato. Choirs blend with it; folk and early music live in it; a pop singer uses it, then lets vibrato bloom at the end of a note.","more":"","see":["vibrato","blend"]},{"id":"agility","term":"Agility","short":"Moving fast and clean between pitches: runs, trills, fast scales. Built on a light, flexible onset, not on volume.","more":"","see":["melisma","onset","warm-up"]},{"id":"intonation","term":"Intonation","short":"Singing in tune: the note you make against the note you meant. Flat is the usual drift (tired breath); sharp comes from pushing.","more":"","see":["pitch","pitch-matching","breath-support"]},{"id":"ear-training","term":"Ear training","short":"Learning to hear what you sing before you sing it: intervals, scale degrees, chords. The Pitch Lab and the interval lessons are the book’s ear training.","more":"","see":["interval","solfege","pitch-matching"]},{"id":"hand-signs","term":"Hand signs (Kodály)","short":"A hand shape for each solfège syllable, do at the waist rising to high do above the head. The hand shows the pitch the voice is about to find.","more":"","see":["solfege","movable-do"]},{"id":"vocal-health","term":"Vocal health","short":"Water, sleep, warm-ups, no shouting, and rest when the voice is hoarse. Hoarseness that lasts two weeks is a doctor’s question, not a technique question.","more":"","see":["warm-up","cool-down","vocal-fry"]},{"id":"a-cappella","term":"A cappella","short":"Voices with no instruments. The pitch has nowhere to hide, which is why a cappella groups drill tuning and blend above all.","more":"","see":["blend","intonation","harmony"]},{"id":"round","term":"Round (canon)","short":"The same melody started by each voice a bar or two apart: Row, Row, Row Your Boat. The easiest way into singing a part against another.","more":"","see":["harmony","melody","countermelody"]},{"id":"call-and-response","term":"Call and response","short":"A leader sings a phrase, the group answers. Gospel, blues, work songs and every concert sing-along.","more":"","see":["phrase","melody"]},{"id":"backing-vocals","term":"Backing vocals","short":"The voices behind the lead: thirds and sixths above or below, oohs on the chord tones, the hook doubled. Sung softer and straighter than the lead.","more":"","see":["harmony","chord-tone","blend"]},{"id":"mic-technique","term":"Microphone technique","short":"Closer for soft and low (the proximity effect adds warmth), back for loud and high. The microphone is part of the instrument.","more":"","see":["dynamics","belt"]},{"id":"breath-mark","term":"Breath mark","short":"A small comma above the staff: breathe here. Plan the breaths of a song the way a phrase plans its commas.","more":"","see":["phrase","breath-support","staff"]},{"id":"rubato","term":"Rubato","short":"Stealing time: stretching one note and hurrying the next while the whole phrase keeps its length. The expressive singer’s licence, used in small amounts.","more":"","see":["tempo","phrase"]},{"id":"fermata","term":"Fermata","short":"The eye-shaped sign over a note: hold it longer than written, as long as the leader wants. The last note of a hymn.","more":"","see":["tempo","phrase"]},{"id":"enharmonic","term":"Enharmonic","short":"Two names for one pitch: F♯ and G♭ sound the same. Which name you sing depends on the key — the key of D has a C♯, never a D♭.","more":"","see":["sharp","flat","key"]},{"id":"chromatic","term":"Chromatic","short":"Moving by half steps. The chromatic scale is all twelve notes; the warm-ups climb chromatically, one half step at a time.","more":"","see":["half-step","scale","warm-up"]},{"id":"musical-alphabet","term":"The musical alphabet","short":"A B C D E F G, then A again. Between most letters is a whole step; between B–C and E–F only a half step. That is why mi–fa and ti–do are the close ones.","more":"","see":["note","half-step","solfege"]},{"id":"perfect-interval","term":"Perfect intervals","short":"The unison, fourth, fifth and octave: the intervals that are neither major nor minor. They sound hollow and still; the fifth is the first harmony people find by ear.","more":"","see":["fifth","fourth","octave","unison"]},{"id":"interval-quality","term":"Interval quality","short":"Major, minor, perfect, augmented or diminished: the flavour of an interval at a given size. A third is major at four half steps (do–mi), minor at three (re–fa).","more":"","see":["interval","third","perfect-interval"]},{"id":"fourth","term":"Fourth","short":"Five half steps, do up to fa: “Here Comes the Bride”. The fourth of the key is the note the IV chord is built on.","more":"","see":["interval","perfect-interval","fifth"]},{"id":"inversion","term":"Inversion","short":"Turn an interval over by moving the lower note up an octave: a third becomes a sixth, a fifth a fourth. The sixths on the Harmony page are the thirds turned over.","more":"","see":["third","sixth","octave"]},{"id":"augmented","term":"Augmented","short":"An interval one half step wider than major or perfect; a triad with a raised fifth. The strange chord in a barbershop tag.","more":"","see":["interval-quality","triad"]},{"id":"consonance","term":"Consonance and dissonance","short":"Intervals that rest (thirds, sixths, fifths, octaves) and intervals that lean (seconds, sevenths, the tritone). Harmony is the two in turn.","more":"","see":["interval","tritone","suspension"]},{"id":"diatonic","term":"Diatonic","short":"Belonging to the key: the seven notes of its scale and the chords built on them. A diatonic melody never needs an accidental — do re mi all the way.","more":"","see":["key","scale","accidental"]},{"id":"scale-degree","term":"Scale degree","short":"A note’s number in its scale, 1 to 7: the number behind each solfège syllable. Movable do is scale degrees you can sing.","more":"","see":["scale","solfege","movable-do"]},{"id":"dominant","term":"Dominant (sol, 5)","short":"The fifth degree and the V chord: the one that pulls home to I. The note a harmony singer reaches for when the melody sits on do.","more":"","see":["scale-degree","fifth","cadence"]},{"id":"subdominant","term":"Subdominant (fa, 4)","short":"The fourth degree and the IV chord: the “away” chord, one step anticlockwise on the circle. The second chord of most songs.","more":"","see":["scale-degree","circle-of-fifths","fourth"]},{"id":"leading-tone","term":"Leading tone (ti, 7)","short":"The seventh degree, a half step under do, leaning on it. Sing ti and stop: the ear begs for do.","more":"","see":["scale-degree","tonic","cadence"]},{"id":"parallel-key","term":"Parallel keys","short":"A major and a minor key with the same tonic: G major and G minor. They share a root, not a key signature; relative keys share the signature, not the root.","more":"","see":["key","relative-minor","minor-scale"]},{"id":"natural-minor","term":"Natural minor","short":"The relative minor’s own scale, la ti do re mi fa sol la — the major scale started on its sixth note. Aeolian.","more":"","see":["minor-scale","relative-minor","mode"]},{"id":"harmonic-minor","term":"Harmonic minor","short":"Natural minor with the seventh raised (si), so the V chord is major and pulls home. The raised note gives it the “gypsy” step.","more":"","see":["natural-minor","leading-tone","dominant"]},{"id":"melodic-minor","term":"Melodic minor","short":"Natural minor with the sixth and seventh raised going up (fi, si), so a line can climb to la without a gap; lowered again coming down.","more":"","see":["natural-minor","harmonic-minor"]},{"id":"blues-scale","term":"Blues scale","short":"The minor pentatonic plus the ♭5: six notes that fit every chord of a blues. The bent notes between them are where the singing lives.","more":"","see":["pentatonic","blue-note"]},{"id":"blue-note","term":"Blue note","short":"The ♭3, ♭5 or ♭7 slid into a major key, bent toward the “right” note and never quite arriving. Gospel, blues, soul.","more":"","see":["blues-scale","portamento"]},{"id":"mixolydian","term":"Mixolydian","short":"Major with a flat seventh: te instead of ti. The sound of folk, rock and a lot of Celtic song; it never quite resolves.","more":"","see":["mode","leading-tone"]},{"id":"dorian","term":"Dorian","short":"Minor with a bright sixth (la instead of le): Scarborough Fair, most “minor” folk songs.","more":"","see":["mode","natural-minor"]},{"id":"modulation","term":"Modulation","short":"Changing key inside a song. The last-chorus key change up a half or whole step is the pop version; a careful singer re-finds do before the first note of the new key.","more":"","see":["key","transpose"]},{"id":"chord-quality","term":"Chord quality","short":"What kind of chord sits on a root: major, minor, seventh, diminished. The same root, a different middle note, and the mood changes.","more":"","see":["chord","major-chord","minor-chord","seventh-chord"]},{"id":"dominant-seventh","term":"Dominant 7 chord","short":"A major triad with a ♭7 on top (G7 = G B D F): the V7 of a key. The tritone inside it is what pulls it home.","more":"","see":["seventh-chord","dominant","tritone"]},{"id":"sus-chord","term":"Sus chord","short":"A triad with its third replaced by the 2 or the 4: neither major nor minor, waiting to resolve. A harmony singer holding fa over a I chord makes one.","more":"","see":["triad","third","suspension"]},{"id":"voicing","term":"Voicing","short":"Which octave each note of a chord sits in and in what order. A three-voice stack is a voicing: who takes the root, who the third, who the fifth.","more":"","see":["chord","chord-tone","blend"]},{"id":"authentic-cadence","term":"Authentic cadence (V–I)","short":"The strongest ending: the V chord into the I, ti to do in the tune. The last two bars of nearly every song.","more":"","see":["cadence","dominant","tonic"]},{"id":"plagal-cadence","term":"Plagal cadence (IV–I)","short":"The “amen” ending: IV into I, fa to mi or fa to do. The end of hymns and gospel songs.","more":"","see":["cadence","subdominant"]},{"id":"half-cadence","term":"Half cadence","short":"A phrase that stops on the V and hangs there — the end of a verse’s first half, before the second half takes it home.","more":"","see":["cadence","dominant","phrase"]},{"id":"deceptive-cadence","term":"Deceptive cadence (V–vi)","short":"V goes to vi instead of I: the ear expected home and got the relative minor. One more time around.","more":"","see":["cadence","relative-minor"]},{"id":"resolution","term":"Tension and resolution","short":"Notes and chords that lean (ti, fa, the V, a suspension) and the moment they land (do, the I). A phrase is the pull and the arrival.","more":"","see":["dominant","leading-tone","suspension"]},{"id":"twelve-bar-blues","term":"12-bar blues","short":"Three lines of four bars on I, IV and V: I I I I · IV IV I I · V IV I I. Sing the first line twice, answer it in the third.","more":"","see":["progression","blues-scale","call-and-response"]},{"id":"borrowed-chord","term":"Borrowed chord","short":"A chord from the parallel key: the minor iv in a major song, the ♭VII under a Mixolydian tune. A melody singer feels it as a sudden shadow.","more":"","see":["parallel-key","mixolydian","roman-numerals"]},{"id":"nashville-numbers","term":"Nashville numbers","short":"Chords written as numbers, 1 4 5, so a chart works in any key — handy when the key moves to fit the singer.","more":"","see":["roman-numerals","transpose","progression"]},{"id":"beat","term":"Beat","short":"The steady pulse under a song, the one you tap. The tempo says how fast it goes; the time signature says how it groups.","more":"","see":["tempo","time-signature","bar"]},{"id":"bar","term":"Bar (measure)","short":"The beats between two bar lines: four in common time, three in a waltz. A verse is usually eight or sixteen of them.","more":"","see":["beat","time-signature","phrase"]},{"id":"note-values","term":"Note values","short":"Whole, half, quarter, eighth, sixteenth: each half as long as the one before. A quarter note is one beat in 4/4.","more":"","see":["beat","dotted-note","rest"]},{"id":"rest","term":"Rest","short":"A silence with a length: whole, half, quarter, eighth rests match the notes. A rest is where the breath goes.","more":"","see":["note-values","breath-mark"]},{"id":"dotted-note","term":"Dotted note","short":"A dot after a note adds half its length again: a dotted quarter is a beat and a half, the long note of a lilting 6/8.","more":"","see":["note-values","compound-time"]},{"id":"tie","term":"Tie","short":"A curve joining two notes of the same pitch into one longer note, often across a bar line. Not a slur, which joins different pitches on one syllable.","more":"","see":["note-values","bar","melisma"]},{"id":"compound-time","term":"Compound time","short":"Time signatures where the beat splits in three: 6/8 (two beats), 9/8, 12/8. The lilt of lullabies and slow blues.","more":"","see":["time-signature","beat"]},{"id":"pickup-notes","term":"Pickup notes (anacrusis)","short":"The note or two before the first full bar that lead into beat 1: “Happy” before “BIRTH-day”. Most songs start on one; breathe before it, not on it.","more":"","see":["bar","phrase","breath-mark"]},{"id":"syncopation","term":"Syncopation","short":"An accent where the ear does not expect one, on an offbeat or between beats. Pop and gospel melodies push words early all the time.","more":"","see":["beat","offbeat"]},{"id":"offbeat","term":"Offbeat","short":"The “and” between two beats. Clap on 2 and 4 and the offbeats are the gaps you fall into.","more":"","see":["beat","syncopation"]},{"id":"shuffle","term":"Shuffle (swing feel)","short":"Eighth notes sung long-short instead of evenly: the first of each pair gets about two thirds of the beat. Blues, jazz and a lot of gospel.","more":"","see":["beat","note-values"]},{"id":"ledger-line","term":"Ledger line","short":"A short extra line for notes above or below the staff. Middle C sits on one ledger line below the treble staff.","more":"","see":["staff","clef"]},{"id":"repeat-sign","term":"Repeat sign","short":"Two dots by a double bar line: sing the section again. A chorus is usually written once with a repeat.","more":"","see":["bar","verse-chorus"]},{"id":"song-form","term":"Song form","short":"The order of a song’s parts: verse, chorus, bridge, and the letters that name them (AABA, verse–chorus). Knowing the form is knowing where the breath and the big note go.","more":"","see":["verse-chorus","song-bridge","phrase"]},{"id":"verse-chorus","term":"Verse and chorus","short":"Verses tell the story (new words, same tune); the chorus repeats (same words, the hook, usually higher). The harmony comes in on the chorus.","more":"","see":["song-form","hook","backing-vocals"]},{"id":"song-bridge","term":"Bridge (of a song)","short":"The part that goes somewhere else once — a new chord, a new key, a different range — before the last chorus comes back.","more":"","see":["song-form","modulation"]},{"id":"hook","term":"Hook","short":"The line everyone sings back: short, repeated, on the strongest beat of the chorus.","more":"","see":["verse-chorus","phrase"]},{"id":"intro-outro","term":"Intro and outro","short":"The way in and the way out: a few bars of the chord changes before the voice, a tag or a fade after it.","more":"","see":["song-form","cadence"]}],"aliases":{"half step":"half-step","half steps":"half-step","semitone":"half-step","semitones":"half-step","whole step":"whole-step","whole steps":"whole-step","relative minor":"relative-minor","circle of fifths":"circle-of-fifths","key signature":"key-signature","key signatures":"key-signature","perfect fifth":"fifth","fifths":"fifth","major scale":"major-scale","minor scale":"minor-scale","time signature":"time-signature","seventh chord":"seventh-chord","roman numerals":"roman-numerals","major third":"third","minor third":"third","thirds":"third","sixths":"sixth","octaves":"octave","intervals":"interval","chords":"chord","scales":"scale","modes":"mode","triads":"triad","accidentals":"accidental","keys":"key","progressions":"progression","cadences":"cadence","sharps":"sharp","flats":"flat","notes":"note","vowels":"vowel","chord tone":"chord-tone","chord tones":"chord-tone","breath support":"breath-support","support":"breath-support","vocal folds":"vocal-folds","folds":"vocal-folds","chest voice":"chest-voice","head voice":"head-voice","mixed voice":"mixed-voice","mix":"mixed-voice","registers":"register","lip trill":"lip-trill","lip trills":"lip-trill","sirens":"siren","messa di voce":"messa-di-voce","pitch matching":"pitch-matching","match pitch":"pitch-matching","solfège":"solfege","movable do":"movable-do","voice type":"voice-type","voice types":"voice-type","harmonies":"harmony","warm-ups":"warm-up","warm up":"warm-up","phrases":"phrase","transposing":"transpose","transposition":"transpose","contrary motion":"contrary-motion","parallel motion":"parallel-motion","drone":"pedal","fry":"vocal-fry","onsets":"onset","glottal":"onset","aspirate":"onset","straw":"sovt","straw phonation":"sovt","semi-occluded":"sovt","sob":"cry","palate":"soft-palate","nasal":"nasality","modify the vowel":"vowel-modification","vowel modification":"vowel-modification","whistle":"whistle-register","run":"melisma","runs":"melisma","riff":"melisma","riffs":"melisma","scoop":"portamento","scooping":"portamento","glissando":"portamento","straight tone":"straight-tone","in tune":"intonation","out of tune":"intonation","ear":"ear-training","hand signs":"hand-signs","kodály":"hand-signs","hoarse":"vocal-health","hoarseness":"vocal-health","a cappella":"a-cappella","canon":"round","rounds":"round","call and response":"call-and-response","backing vocal":"backing-vocals","backing vocals":"backing-vocals","bvs":"backing-vocals","microphone":"mic-technique","mic":"mic-technique","breath marks":"breath-mark","chromatic scale":"chromatic","perfect fourth":"fourth","fourths":"fourth","inversions":"inversion","dissonance":"consonance","consonant":"consonance","dissonant":"consonance","scale degrees":"scale-degree","degree":"scale-degree","degrees":"scale-degree","v chord":"dominant","iv chord":"subdominant","leading note":"leading-tone","natural minor":"natural-minor","harmonic minor":"harmonic-minor","melodic minor":"melodic-minor","blues scale":"blues-scale","blue notes":"blue-note","modulate":"modulation","key change":"modulation","dominant seventh":"dominant-seventh","v7":"dominant-seventh","sus4":"sus-chord","sus2":"sus-chord","suspended":"sus-chord","voicings":"voicing","12-bar":"twelve-bar-blues","twelve-bar":"twelve-bar-blues","borrowed":"borrowed-chord","nashville number system":"nashville-numbers","beats":"beat","bars":"bar","measure":"bar","measures":"bar","note value":"note-values","quarter note":"note-values","eighth note":"note-values","eighth notes":"note-values","rests":"rest","dotted":"dotted-note","ties":"tie","tied":"tie","compound":"compound-time","pickup":"pickup-notes","pickups":"pickup-notes","anacrusis":"pickup-notes","syncopated":"syncopation","offbeats":"offbeat","swing":"shuffle","swung":"shuffle","ledger lines":"ledger-line","repeat signs":"repeat-sign","form":"song-form","verse":"verse-chorus","verses":"verse-chorus","chorus":"verse-chorus","choruses":"verse-chorus","bridge":"song-bridge","hooks":"hook","intro":"intro-outro","outro":"intro-outro","fry scream":"vocal-fry","false cord":"false-cords","false cords":"false-cords","false folds":"false-cords","grit":"distortion","growl":"distortion","scream":"distortion","screaming":"distortion","rasp":"distortion","cool down":"cool-down","cooldown":"cool-down","warm-down":"cool-down","pedal note":"pedal","treble clef":"clef","bass clef":"clef","overtones":"overtone","harmonics":"overtone","harmonic":"overtone","partial":"overtone","partials":"overtone","harmonic series":"harmonic-series","formants":"formant","overtone singing":"throat-singing","throat singing":"throat-singing","subharmonics":"subharmonic","yodeling":"yodel","yodelling":"yodel","spectrograms":"spectrogram"},"theory":{"facts":[{"t":"How a note happens","b":"Air from the lungs passes between the vocal folds and sets them buzzing; the throat, mouth and nose turn that buzz into tone. Breath is the engine, folds the source, resonance the loudspeaker.","tag":"voice"},{"t":"Low breath","b":"A singer’s breath drops the diaphragm and widens the belly and lower ribs; the shoulders stay still. A high, chesty breath is short and tightens the throat.","tag":"voice"},{"t":"Support is release, not push","b":"Support means letting the breath out slowly under control, not forcing it. The hiss exercise teaches the feeling: steady air, belly giving way a little at a time.","tag":"voice"},{"t":"Two registers, one voice","b":"Chest voice uses thick, short folds; head voice thin, stretched ones. Sirens and lip trills blend them through the passaggio so the seam disappears.","tag":"voice"},{"t":"The larynx stays home","b":"Most strain is a larynx rising with the pitch. Yawn gently, keep the throat open, and let the sound thin at the top rather than reaching for it.","tag":"voice"},{"t":"Vowels carry the song","b":"Consonants are short; the vowel holds the pitch, the tone and the time. Five pure Italian vowels — i e a o u — are the whole toolkit; English vowels are mixtures of them.","tag":"voice"},{"t":"Forward placement carries","b":"A sound that seems to sit in the mask of the face (the “nay” buzz) carries without being loud. A sound that sits in the throat is swallowed, however hard you push.","tag":"voice"},{"t":"Vibrato happens","b":"A free, supported voice wobbles about six times a second on its own. Make it on purpose and it sounds made; squeeze it out and the tone goes straight and tight.","tag":"voice"},{"t":"Vocal health","b":"Water, sleep and warm-ups; no shouting, no whispering (it is harder on the folds than speaking), and a rest day after a heavy one. Hoarseness for more than two weeks is a doctor’s question.","tag":"voice"},{"t":"Singing is hearing first","b":"You cannot sing a note you have not heard inside. Audiation — imagining the pitch before you make it — is the skill behind pitch matching, harmony and sight-singing alike.","tag":"voice"},{"t":"Grit is added, never forced","b":"Rasp, growl and scream sit on top of a clean, supported note. The roughness comes from the false cords or from vocal fry riding on steady air with the larynx low; squeezing the true folds together is shouting.","tag":"voice"},{"t":"Fry and false cords","b":"Fry is the creaky bottom register of the true folds; the false cords are the folds above them, which rattle without making pitch. Melissa Cross named the fry scream and the false-cord scream for those two sources. Learn each quiet first; the room makes it loud.","tag":"voice"},{"t":"Warm up clean before grit","b":"A scream-ready session is a full clean warm-up, placement and support work, and only then fry and false cords — then a cool-down. If it hurts or makes you cough, the engagement is wrong: stop and find it another way.","tag":"voice"},{"t":"A session has an order","b":"Breath, body, closed sounds (hums, trills, straw), sirens, syllables (ng, nay, gee, mum), open vowels and range, the demanding work last, and two or three minutes of descending slides to finish.","tag":"voice"},{"t":"Pitch is speed","b":"A note is how fast the folds vibrate: A4 is 440 times a second, the A an octave up 880. Doubling the speed is always an octave.","tag":"intervals"},{"t":"What an interval is","b":"The distance between two notes, counted in letters and measured in half steps. A third is two letters up; whether it is major (4 half steps) or minor (3) is the whole difference between bright and sad.","tag":"intervals"},{"t":"Cue songs","b":"Every interval has a tune that starts with it: a fifth is “Twinkle, Twinkle”, a fourth “Here Comes the Bride”, an octave “Somewhere Over the Rainbow”. Sing the cue, then the note.","tag":"intervals"},{"t":"Consonant and dissonant","b":"Octaves, fifths, thirds and sixths sound settled; seconds, sevenths and the tritone sound tense. A harmony is mostly thirds and sixths for exactly that reason.","tag":"intervals"},{"t":"Solfège","b":"Do re mi fa sol la ti names the degrees of any major key, so a tune learned in C is the same syllables in G. Lowered notes take me, le, te and ra; raised ones di, ri, fi, si, li.","tag":"scales"},{"t":"The major scale","b":"Whole, whole, half, whole, whole, whole, half. That pattern of steps is what sounds major, whatever note you start on.","tag":"scales"},{"t":"Major and minor","b":"The third degree tells you the mood: four half steps up from home is bright, three is dark. Everything else follows from that one note.","tag":"scales"},{"t":"The three minors","b":"Natural minor is the major scale from its 6th note. Harmonic minor raises the 7th so the V chord pulls home. Melodic minor also raises the 6th on the way up so the climb is smooth to sing.","tag":"scales"},{"t":"Pentatonics","b":"Drop the 4th and 7th from a major scale and nothing clashes with anything: five safe notes, the shape of most riffs, gospel runs and lullabies.","tag":"scales"},{"t":"Modes","b":"Sing the major scale from each of its notes and you get seven moods on the same notes: Dorian from the 2nd (soul, folk), Mixolydian from the 5th (rock), Aeolian from the 6th (the natural minor).","tag":"scales"},{"t":"What a key is","b":"A home note plus its scale. The key signature records which notes are sharp or flat so they need not be marked every time.","tag":"key"},{"t":"Chords in a key","b":"Build a triad on each note of the major scale and the pattern is always major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°.","tag":"key"},{"t":"Roman numerals","b":"Capitals are major chords, lower-case minor, ° diminished. They describe a progression in every key at once — which is how a singer talks to a band about a key change.","tag":"key"},{"t":"The V wants home","b":"The chord on the 5th degree pulls hardest back to the I. That tension and release, V to I, is how most phrases land; ending on V leaves a question in the air.","tag":"key"},{"t":"Transposing","b":"If a song sits too high or low, move the whole thing to a key that fits. The chord numerals stay the same; only the letters change. Ask for it a step down, not a “bit lower”.","tag":"key"},{"t":"The circle of fifths","b":"Twelve keys in a ring. Each step clockwise is up a fifth and adds one sharp; each step counter-clockwise adds a flat. Neighbours share almost all their notes.","tag":"cof"},{"t":"Order of sharps and flats","b":"Sharps arrive F C G D A E B; flats arrive B E A D G C F — the same list backwards. One sharp is G major, one flat is F major.","tag":"cof"},{"t":"Relative keys","b":"Every major key shares its notes with a minor key a minor third below: A minor for C major. Same notes, same signature, different home.","tag":"cof"},{"t":"I, IV and V on the circle","b":"For any key, one step clockwise is its V and one step back is its IV. Three touching keys give the three chords most songs are built from.","tag":"cof"},{"t":"Why a third","b":"Sing the melody and step up two letters of the key: that is the third above, and it is a chord tone of nearly every chord the melody is on. It is the first harmony everyone finds.","tag":"harmony"},{"t":"Why it is not one interval","b":"A third above C is E — four half steps, major. A third above D is F — three, minor. The ear does this by itself because every note of the harmony comes from the key.","tag":"harmony"},{"t":"Safe notes","b":"A harmony note that lands on a beat should be a chord tone of the chord underneath — root, third or fifth. The note is never wrong; the chord under it changed.","tag":"harmony"},{"t":"The four motions","b":"Parallel: same way, same distance (easy, thin). Similar: same way, distance changing. Oblique: one voice holds. Contrary: opposite ways — the strongest sound of two people.","tag":"harmony"},{"t":"Three voices","b":"Three singers, three notes of the triad; nobody doubles the melody. Whoever has the third decides the mood and must be dead in tune.","tag":"harmony"},{"t":"Blend","b":"Match the vowel, land the consonants together, use less vibrato than the lead, and sit under it in volume. If a listener can pick the harmony out, it is too loud.","tag":"harmony"},{"t":"Harmony is a dynamic","b":"Verse one bare; the last line of the chorus a third above; verse two a drone or nothing; chorus two the full part; the last chorus adds the third voice. Parts climb with the song.","tag":"harmony"},{"t":"Tuning the third","b":"Sung exactly to a keyboard, the third of a chord sounds a shade flat, and singers naturally lift it. Let them: unaccompanied harmony is meant to bend, which is why a good trio is sweeter than a piano.","tag":"harmony"},{"t":"The treble staff","b":"Five lines, bottom to top E G B D F (Every Good Boy Does Fine); four spaces F A C E. Middle C sits on a short ledger line just below.","tag":"reading"},{"t":"Note values","b":"A whole note fills a 4/4 bar; a half is two beats, a quarter one, an eighth half a beat. A dot adds half the note’s own length; a tie joins two notes into one held sound.","tag":"reading"},{"t":"Time signatures","b":"The top number is beats per bar, the bottom which note gets the beat. 4/4 is most songs, 3/4 a waltz, 6/8 two big beats of three — ONE-two-three FOUR-five-six.","tag":"reading"},{"t":"Reading a key signature","b":"The last sharp is one half step below the key: F♯ means G major. The second-to-last flat is the key: B♭ E♭ means B♭ major. One flat alone is F.","tag":"reading"},{"t":"Sight-singing","b":"Find do from the key signature, sing the scale once, then read every note as a solfège syllable and a distance from the last. Rhythm first, pitch second; keep going even when you miss.","tag":"reading"},{"t":"The beat is a floor","b":"A singer who can feel the pulse without hearing it can phrase ahead of it, behind it or across it on purpose. Clap it, walk it, count the subdivision under a long note — the beat is what lets you be free, not what holds you.","tag":"reading"},{"t":"Syncopation is an agreement","b":"A note on the offbeat only surprises because the listener expected the downbeat. Keep the pulse honest inside you and the push lands; lose it and the same note just sounds early.","tag":"reading"},{"t":"A chord locks when the beats vanish","b":"Two notes slightly out of tune beat against each other at the difference of their frequencies. Singers tune a chord by listening for that waver and easing the note until it stops: the just third sits 14 cents under the piano’s.","tag":"harmony"},{"t":"A song is a shape","b":"Verse, chorus, bridge are not rules but a map of where the listener’s attention goes. The verse changes its words and keeps them leaning forward; the chorus repeats and gives them the title; the bridge leaves once so the last chorus can feel like coming home.","tag":"harmony"},{"t":"Melody is chord tones with steps between","b":"On the strong beats the tune sits on a note of the chord; on the weak beats it walks. Write the downbeats first, from the chords the Sketchpad hands you, and the line between them almost writes itself.","tag":"harmony"},{"t":"Two sounds at once","b":"Every note already contains its overtones; throat singing does not add a second voice, it un-hides one. The drone is the instrument, the mouth is the tuner, and the melody was always there.","tag":"extended"},{"t":"The ladder is physics","b":"Harmonic two is the octave, three the fifth above that, four two octaves; the rungs crowd closer as they climb. The series is identical for every voice on earth — what differs is which rungs a tradition chooses to light.","tag":"extended"},{"t":"Grit rides on tone","b":"Every sustainable scream is a clean, supported note with a rattle riding on it — fry or false cords excited by air. The true folds work no harder than in clean singing; the moment they are squeezed to make the roughness, it is shouting with a costume on.","tag":"extended"},{"t":"The subharmonic door","b":"When a second structure joins the voice at half speed, a tone appears one octave below the sung note. Tuvan kargyraa, Tibetan chant and the lowest choral basses all stand in that doorway; the Mirror shows it as new rungs between the rungs.","tag":"extended"},{"t":"The break is an instrument","b":"The passaggio every method smooths away is also a feature: flipped on purpose it is the yodel, celebrated from the Alps to the Aka. One voice’s flaw is another music’s engine.","tag":"extended"},{"t":"Seeing is the shortcut","b":"These sounds are hard to describe and easy to see. A spectrogram turns timbre into a picture — ladder, storm, whistle-line, double-drone — and the fastest way to learn one is to match the picture, not the adjective.","tag":"extended"}]},"harmonics":[{"n":1,"cents":0,"semis":0,"dev":0},{"n":2,"cents":1200,"semis":12,"dev":0},{"n":3,"cents":1902,"semis":19,"dev":2},{"n":4,"cents":2400,"semis":24,"dev":0},{"n":5,"cents":2786,"semis":28,"dev":-14},{"n":6,"cents":3102,"semis":31,"dev":2},{"n":7,"cents":3369,"semis":34,"dev":-31},{"n":8,"cents":3600,"semis":36,"dev":0},{"n":9,"cents":3804,"semis":38,"dev":4},{"n":10,"cents":3986,"semis":40,"dev":-14},{"n":11,"cents":4151,"semis":42,"dev":-49},{"n":12,"cents":4302,"semis":43,"dev":2},{"n":13,"cents":4441,"semis":44,"dev":41},{"n":14,"cents":4569,"semis":46,"dev":-31},{"n":15,"cents":4688,"semis":47,"dev":-12},{"n":16,"cents":4800,"semis":48,"dev":0}],"ext":[{"id":"fry-scream","name":"The fry scream","fam":"grit","origin":"metal and hardcore; the gateway grit","what":"Vocal fry — the loose morning rattle — fed with more air and an open throat until it blooms into a scream that costs almost nothing.","feel":"A lazy rattle that gets excited. The throat stays as loose as a sigh; the power is air and resonance, not squeeze.","steps":["Settle into fry: a relaxed, creaky “ahh” at the bottom of your voice, almost no air.","Keep the rattle and slowly add air from the belly. Volume comes up without the throat changing.","Open the mouth tall (think “awe”) and let the rattle ring forward in the mask.","Shape vowels through it — aw, oh, ay — a few seconds each, then rest. Sentences come later."],"mirror":"A low fuzzy band with faint, widely spaced rungs — fry pulses are slow, so the ladder is dense and soft. As you add air the whole picture brightens without jumping.","hear":"fry","safety":"Warm up first, always. This should feel like nothing — a tickle, never a burn. The moment anything scratches or hurts, stop and glide a soft siren down. Minutes a day, not hours, and cool down after."},{"id":"false-cord","name":"The false-cord scream","fam":"grit","origin":"metal; the big low growl-scream","what":"A clean, supported note from the true folds while the false cords — the shelves of tissue above them — rattle on the moving air. Distortion as a passenger, never the driver.","feel":"A cough held gently, or clearing your throat in slow motion, over a note. The true folds sing exactly as they do clean.","steps":["Sing a comfortable low-mid note, solid support, tall open throat.","Find the false cords: make the softest possible cough, then the start of a gentle throat-clear — that flutter above the voice is them.","Bring that flutter onto the held note at low volume: a quiet growl riding a clean tone.","Grow it with breath and resonance only. If the pitch chokes or the throat tightens, drop the grit and start again cleaner."],"mirror":"The clean note’s ladder stays visible, with a storm of noise wrapped around it. If the rungs vanish entirely, you have squeezed the tone away — back off.","hear":"grit","safety":"The false cords must never replace the sung note — grit rides on tone. Warm up fully, keep sessions short, cool down after, and take grit-free days. Pain, tickle-coughing or a hoarse next morning mean the balance was wrong."},{"id":"khoomei","name":"Khoomei","fam":"overtone","origin":"Tuva; the root style of Tuvan throat singing","what":"A steady mid-voice drone with the mouth half-closed, tuned so the first overtones shimmer above the note like wind over the steppe.","feel":"Humming with the mouth slightly open, then finding the position where the note grows a halo.","steps":["Sing a comfortable drone on “oh”, even and unhurried — the drone is the instrument.","Round the lips a little and raise the back of the tongue slightly, as if between “oh” and “oo”.","Sweep that shape very slowly. At some point the note sprouts a quiet ringing above it — stop there and hold.","Rock the shape a few millimetres either side to make the halo brighten and dim. That rocking is the beginning of melody."],"mirror":"The drone’s ladder holds still while one or two mid rungs brighten as you find the shape. Melody shows as the bright spot stepping between rungs.","hear":"drone","safety":""},{"id":"sygyt","name":"Sygyt","fam":"overtone","origin":"Tuva; the whistle above the drone","what":"One high harmonic isolated until it pipes like a clear flute over the drone. The melody style of Tuvan singing.","feel":"The tip of the tongue sealing just behind the teeth, the sides sealing along the molars, one small window left — the whistle lives in that window.","steps":["Start in khoomei: drone plus halo.","Touch the tongue tip behind the top teeth and seal the sides, leaving a small opening on one side.","Say a slow internal “ee” and listen above the drone for a thin whistle — tiny jaw and lip moves tune it.","Walk it along the ladder: the vowel-shape of “ee–ih–eh” moves the whistle between harmonics 6, 8, 9, 10 and 12."],"mirror":"One high rung lights far brighter than the rest — a solid bright line with a quiet ladder below it. Stepping the line between rungs is the tune.","hear":"drone","safety":""},{"id":"kargyraa","name":"Kargyraa","fam":"overtone","origin":"Tuva; the underground voice — and the door Tibetan chant uses","what":"The false cords join the true folds at exactly half speed, adding a tone one octave below the sung note. Over that double-drone, vowels carve the overtone melody.","feel":"A deep, relaxed rumble that seems to come from below your own range — the chest buzzes like a cat’s purr.","steps":["Sing a relaxed low note on “aw”, big and warm, nowhere near your floor.","Let the throat soften the way it does at the edge of a yawn, and give the note a little more air.","Invite a slow, even flutter to join — it locks in suddenly, one octave down, like a gear engaging.","Keep it lazy and loud-ish (it needs some air to lock), and shape slow vowels — aw, oh, oo — to light the overtones above."],"mirror":"New rungs appear exactly halfway between the ladder’s rungs — the picture of a subharmonic. The felt pitch drops an octave while the sung note stays put.","hear":"subdrone","safety":"Kargyraa is loose or it is wrong — it locks in from relaxation, never from force. Warm up first, keep early sessions to a few minutes, and stop at any scratch. The same door, pushed, is just a damaged cough."},{"id":"tibetan","name":"Tibetan chant voice","fam":"overtone","origin":"Gyütö and Gyüme monasteries, Tibet; prayer sung on the subharmonic","what":"The kargyraa mechanism in sacred use: a very low double-drone held on slow vowels, tuned so one overtone hums steadily above the prayer.","feel":"Less a technique to display than a state to settle into: long breath, loose throat, the sound owned by the room.","steps":["Find your kargyraa lock on “aw”, then slow everything down — one breath, one syllable.","Keep the volume moderate and absolutely even; evenness, not power, is the discipline.","Settle the vowel toward a dark “o” until a single overtone stands still above the drone and stays.","Chant phrases as slow exhales. The goal is a sound you could hold for an hour, not an effect."],"mirror":"A very low, dense ladder with one unwavering bright rung — the steadiest picture in this book. Movement means it is not settled yet.","hear":"chant","safety":"Same rules as kargyraa: looseness or nothing. This register asks for patience measured in weeks."},{"id":"yodel","name":"Yodel","fam":"call","origin":"the Alps, early country, and the forest polyphony of the Aka and Mbuti","what":"Melody that leaps across the chest–head break on purpose and lets the flip crack audibly — the passaggio turned from seam into ornament.","feel":"A controlled trip: you aim the low note in chest, the high note in head, and enjoy the catch between them.","steps":["Pick a low note in easy chest voice and a high note a sixth or octave up in easy head voice.","Sing them separately until both are casual; the yodel is only ever two easy notes.","Leap low–high–low on “yo–dl–ay” without smoothing — let the flip click.","Speed it up gradually. The faster it gets, the less you do: the voice flips itself."],"mirror":"The pitch line jumps between two levels with a visible kink at each flip — the break you can see. Smooth curves mean you are sneaking, not yodelling.","hear":"yodel","safety":""},{"id":"kulning","name":"Kulning","fam":"call","origin":"Sweden and Norway; the herding call sung across valleys","what":"A high, piercing head-voice call built to carry for miles: pure vowels, no vibrato, forward as a horn, nothing held back.","feel":"Calling a name across a canyon on pitch — the whole body behind one clear line.","steps":["Breathe low and wide, like before a shout you intend to control.","On “oo” or “ah”, place a high head-voice note far forward — brassy, not breathy, no vibrato.","Hold it straight and let it grow to full carrying volume; think distance, not loudness.","Shape short falling calls — high, then tumbling ornaments down — and imagine the far hillside answering."],"mirror":"A thin, extremely bright line high on the picture with almost no wobble and strong overtones riding above it — a lighthouse beam of a sound.","hear":"kulning","safety":"Full-reach calling is athletic: warm up as for belting, keep sessions short, and stop before the edge of the voice rather than at it."},{"id":"ululation","name":"Ululation","fam":"call","origin":"North and East Africa, the Middle East, South Asia; joy and grief at full voice","what":"A held high note broken into a rapid trill by the tongue flicking side to side — la-la-la-la faster than thought.","feel":"The tongue does all the moving; the note underneath stays still and supported.","steps":["Hold a comfortable high note on “la”, bright and steady.","Flick the tongue side to side against the corners of the mouth, slowly at first — lal-lal-lal.","Let the flick accelerate until it blurs into a trill; the pitch should not budge.","Ride it on a long breath, swelling and fading. It is percussion played on a held note."],"mirror":"A steady bright line chopped into a rapid, even dotted pattern — amplitude flickering at eight to twelve beats a second while the pitch holds.","hear":"ulu","safety":""}],"qualIv":{"":[0,4,7],"m":[0,3,7],"°":[0,3,6],"7":[0,4,7,10],"m7":[0,3,7,10],"maj7":[0,4,7,11],"m7♭5":[0,3,6,10],"sus2":[0,2,7],"sus4":[0,5,7],"add9":[0,2,4,7],"7♭9":[0,1,4,7,10],"6":[0,4,7,9],"m6":[0,3,7,9],"9":[0,2,4,7,10],"m9":[0,2,3,7,10],"5":[0,7]},"progs":[{"group":"Pop & Rock","num":"I–V–vi–IV","desc":"the four chords","minor":false,"toks":[[0,0,""],[4,0,""],[5,0,"m"],[3,0,""]]},{"group":"Pop & Rock","num":"vi–IV–I–V","desc":"moody pop","minor":false,"toks":[[5,0,"m"],[3,0,""],[0,0,""],[4,0,""]]},{"group":"Pop & Rock","num":"I–vi–IV–V","desc":"fifties","minor":false,"toks":[[0,0,""],[5,0,"m"],[3,0,""],[4,0,""]]},{"group":"Pop & Rock","num":"I–IV–V","desc":"classic rock","minor":false,"toks":[[0,0,""],[3,0,""],[4,0,""]]},{"group":"Pop & Rock","num":"I–♭VII–IV","desc":"anthemic","minor":false,"toks":[[0,0,""],[6,-1,""],[3,0,""]]},{"group":"Pop & Rock","num":"vi–V–IV–V","desc":"driving","minor":false,"toks":[[5,0,"m"],[4,0,""],[3,0,""],[4,0,""]]},{"group":"Pop & Rock","num":"I–iii–vi–V","desc":"yearning","minor":false,"toks":[[0,0,""],[2,0,"m"],[5,0,"m"],[4,0,""]]},{"group":"Folk & Country","num":"I–IV–I–V","desc":"porch song","minor":false,"toks":[[0,0,""],[3,0,""],[0,0,""],[4,0,""]]},{"group":"Folk & Country","num":"I–V–IV–I","desc":"singalong","minor":false,"toks":[[0,0,""],[4,0,""],[3,0,""],[0,0,""]]},{"group":"Folk & Country","num":"I–iii–IV–V","desc":"gentle lift","minor":false,"toks":[[0,0,""],[2,0,"m"],[3,0,""],[4,0,""]]},{"group":"Folk & Country","num":"I–IV–vi–V","desc":"warm","minor":false,"toks":[[0,0,""],[3,0,""],[5,0,"m"],[4,0,""]]},{"group":"Folk & Country","num":"I–V–vi–IV–I","desc":"hymn-like","minor":false,"toks":[[0,0,""],[4,0,""],[5,0,"m"],[3,0,""],[0,0,""]]},{"group":"Folk & Country","num":"IV–I–V–vi","desc":"rolling","minor":false,"toks":[[3,0,""],[0,0,""],[4,0,""] // the duet stage: rows = [{name, col, midi, names}], one per singer, in the order to show them
function duetStage(host, {piece, rows, beats, words = null, big = false}) {

    h('span', {class: 'duet-name', style: `color:${r.col}`}, r.name),
    h('div', {class: 'duet-svg', html: phraseSVG([r], beats, a, b, {lit, words, ...size})})));

    box.replaceChildren(...rowsOf(a, b, litAt, S));

}

/* ---- mic.js ---- */
/* ================================================================ the microphone: one stream for the whole book
   Pitch (the old startMic loop: autocorrelation, median of five), what technique it hears (a lip trill's flutter, a hum's closed
   tone, a siren's slide), and recordings kept as takes. The detectors are pure functions so the smoke test can prove them on
   synthesized sound; the thresholds are first estimates, to be tuned against a real voice. */

/* ---------------------------------------------------------------- the detectors (pure) */
// how strongly the loudness flutters, and how fast: a lip trill pulses the sound about 20–30 times a second
function modulation(x, sr) {
  const n = x.length, w = Math.max(1, Math.round(sr * .006)), hop = Math.max(1, Math.round(sr * .002)), rate = sr / hop;
  // rectify, then two passes of a 6 ms moving average (a 12 ms triangle): the voice's own waveform is smoothed away, the flutter stays
  const smooth = a => { const o = new Float32Array(a.length); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= w) s -= a[i - w]; o[i] = s / Math.min(i + 1, w); } return o; };

  const sm = smooth(smooth(ab)), env = []; for (let i = 2 * w; i < n; i += hop) env.push(sm[i]);

  const e = env.map(v => v - m), sd = Math.sqrt(e.reduce((a, b) => a + b * b, 0) / e.length);
  const r = lag => { let s = 0, a = 0, b = 0; for (let i = 0; i + lag < e.length; i++) { s += e[i] * e[i + lag]; a += e[i] * e[i]; b += e[i + lag] * e[i + lag]; } return a && b ? s / Math.sqrt(a * b) : 0; };

  for (let l = L0; l <= L1; l++) { const v = r(l); if (v > best) { best = v; bl = l; } }
  if (bl <= L0 || bl >= L1) return {hz: 0, depth: 0};             // the peak sits on the edge: no flutter in the trill's band
  const y1 = r(bl - 1), y3 = r(bl + 1), den = y1 - 2 * best + y3, lag = den ? bl + (y1 - y3) / (2 * den) : bl;
  return {hz: rate / lag, depth: Math.max(0, best) * Math.min(1, (sd / m) / .2)};   // a steady tone barely moves, so its depth stays near 0
}

/* ---------------------------------------------------------------- the stream */
const Mic = { state: 'off', get ok() { return this.state === 'on'; }, _subs: [], _s: null,

// what to say when the microphone will not open: one plain sentence per reason
const MIC_MSG = {
  denied: 'The microphone is blocked. Allow it in Settings, Safari, Microphone (or the browser’s site settings), then try again.',
  insecure: 'The microphone only works when the book is opened from https:// or as the installed app.',

};
const micMessage = state => MIC_MSG[state] || MIC_MSG.error;

/* ---------------------------------------------------------------- takes: the newest six recordings, kept on this device */
const Takes = (() => {
  const KEEP = 6;
  const db = () => new Promise((res, rej) => { try { const r = indexedDB.open('vm2-takes', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('takes', {keyPath: 'id', autoIncrement: true});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('takes', mode), s = t.objectStore('takes'), out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); }); };
  const list = async () => { try { const all = await tx('readonly', s => s.getAll()); return (all || []).sort((a, b) => b.id - a.id); } catch (e) { return []; } };
  return {
    list,
    async save({label, blob, secs, inTune = null}) {
      try { const id = await tx('readwrite', s => s.add({label, blob, secs, inTune, date: Date.now()}));
        const extra = (await list()).slice(KEEP); for (const t of extra) await this.remove(t.id);
        return id; } catch (e) { return null; } },
    async remove(id) { try { await tx('readwrite', s => s.delete(id)); } catch (e) {} },
    url: take => URL.createObjectURL(take.blob),

})();

/* ---- lane.js ---- */
/* ================================================================ the pitch lane and the range column: the voice drawn as a line
   The instrument is invisible, so the screen is its fretboard: pitch goes up, time goes right, the book's notes are bars and your
   voice is the line over them, sage when you are on the note, amber when you are not (never red). The break is shaded. */
const laneTone = (sung, target) => sung == null || target == null ? null : Math.abs(sung - target) <= .25 ? 'ok' : 'off';

  function resize() { r = Math.min(2, devicePixelRatio || 1); W = Math.max(1, host.clientWidth); H = Math.max(1, host.clientHeight);
    cv.width = W * r; cv.height = H * r; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }

  const rowH = () => (H - 16) / (hi - lo + 1);

    const tn = now(), nowX = KW + (W - KW) * PAST, pps = (W - KW) / seconds, x = t => nowX - (tn - t) * pps, rh = rowH();
    const rose = cssv('--rose', '#a97b22'), ink = cssv('--ink', '#2b2e4a'), rule = cssv('--rule', 'rgba(0,0,0,.15)'), mute = cssv('--mute', '#888');
    // the break, a soft band across the whole lane

      g.fillStyle = n.other ? plain : rose; g.globalAlpha = n.other ? .22 : .32;

    gradeAt,

/* ---------------------------------------------------------------- the range column: a keyboard standing up, your range on it */
const pair = (p, lo, hi) => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite) && p[0] < p[1]
  ? [Math.max(lo, Math.min(hi, p[0])), Math.max(lo, Math.min(hi, p[1]))] : null;

  const yTop = m => top + (hi - m) * RH;                     // the top edge of note m's row
  const o = [`<svg class="rangecol" viewBox="0 0 ${W} ${Hh}" xmlns="${NS}" role="img" aria-label="${R ? `your range, ${midiName(R[0])} to ${midiName(R[1])}` : 'the keyboard'}"`
    + `${R ? ` data-range="${R[0]}-${R[1]}"` : ''}${B ? ` data-break="${B[0]}-${B[1]}"` : ''} preserveAspectRatio="xMidYMid meet">`];
  for (let m = lo; m <= hi; m++) { const blk = [1, 3, 6, 8, 10].includes(m % 12);
    o.push(`<rect x="${blk ? 40 : 28}" y="${yTop(m) + .5}" width="${blk ? 44 : 64}" height="${RH - 1}" rx="2" fill="${blk ? 'var(--ink)' : '#ffffff'}" opacity="${blk ? .85 : .95}"${blk ? '' : ' stroke="var(--rule)" stroke-width=".6"'}/>`);
    if (m % 12 === 0) o.push(`<text x="24" y="${yTop(m) + RH / 2 + 3}" font-size="11" text-anchor="end" fill="var(--mute)">${midiName(m)}</text>`); }
  if (Z) o.push(`<rect x="26" y="${yTop(Z[1])}" width="68" height="${(Z[1] - Z[0] + 1) * RH}" rx="5" fill="var(--teal)" opacity=".16"/>`);
  if (R) o.push(`<rect x="26" y="${yTop(R[1])}" width="68" height="${(R[1] - R[0] + 1) * RH}" rx="6" fill="var(--rose)" opacity=".22"/>`);
  if (B) [B[1], B[0] - 1].forEach(m => o.push(`<line x1="24" x2="96" y1="${yTop(m) + (m === B[1] ? 0 : RH)}" y2="${yTop(m) + (m === B[1] ? 0 : RH)}" stroke="var(--rose)" stroke-width="1.4" stroke-dasharray="4 3"/>`));
  if (B) o.push(`<text x="96" y="${yTop(B[1]) - 2}" font-size="10" text-anchor="end" fill="var(--rose)">break</text>`);
  return o.join('') + '</svg>';

/* ================================================================ the Mirror: your voice as a live spectrogram
   The old Extended Voice room, now fed by the book's one microphone (Mic.tap for the wide spectrum, Mic's frames for the pitch).
   Time runs right to left, pitch goes up on a log scale (55 Hz to 4.2 kHz); the harmonic ladder of the note you sing sits at the right. */
